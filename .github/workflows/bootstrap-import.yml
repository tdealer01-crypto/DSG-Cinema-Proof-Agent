name: Bootstrap source import

on:
  push:
    paths:
      - ".github/workflows/bootstrap-import.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staged bundle
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/source.part.* > /tmp/source.b64
          base64 -d /tmp/source.b64 > /tmp/dsg_source.tar.gz
          echo "8d70ed9c779168c783401863dda8c8616fd660aab5df487e29e4ea11577dc3b0  /tmp/dsg_source.tar.gz" | sha256sum -c -

      - name: Replace repository contents
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xzf /tmp/dsg_source.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: import DSG Cinema Proof Agent source"
          git push origin HEAD:main
