name: Full Live AIMO Authority E2E Proof

on:
  pull_request:
    branches: [main]
    paths:
      - '_proof/dsg-one-live-harness/**'
      - '.github/workflows/live-aimo-e2e-proof.yml'

permissions:
  contents: read
  id-token: write

jobs:
  live-e2e:
    name: Control Plane to Simulation to Cinema live proof
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      DSG_ONE_APP: dsg-one-v1
      EXPECTED_DSG_ONE_SOURCE: b2395a072b1e85c68fababefe799c07744641605

    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify byte-identical DSG ONE orchestration source
        shell: bash
        run: |
          set -euo pipefail
          cd _proof/dsg-one-live-harness
          test "$(jq -r '.sourceCommit' SOURCE_MANIFEST.json)" = "$EXPECTED_DSG_ONE_SOURCE"
          jq -r '.files[] | [.path,.originalBlobSha] | @tsv' SOURCE_MANIFEST.json | while IFS=$'\t' read -r path expected; do
            test -f "$path" || { echo "BLOCK: missing mirrored file $path"; exit 1; }
            actual=$(git hash-object "$path")
            test "$actual" = "$expected" || { echo "BLOCK: source drift $path expected=$expected actual=$actual"; exit 1; }
            echo "SOURCE_BLOB_PASS path=$path sha=$actual"
          done
          echo 'DSG_ONE_MERGED_SOURCE_PROOF=PASS'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pinned proof runner
        working-directory: _proof/dsg-one-live-harness
        run: npm install --omit=dev --ignore-scripts=false --no-audit --no-fund

      - name: Azure login with Cinema production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Load DSG ONE production bindings without logging values
        shell: bash
        run: |
          set -euo pipefail
          settings=$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$DSG_ONE_APP" --output json --only-show-errors)

          get_setting() {
            local name="$1"
            SETTINGS="$settings" NAME="$name" node --input-type=module <<'NODE'
          const rows = JSON.parse(process.env.SETTINGS);
          const row = rows.find((item) => item.name === process.env.NAME);
          if (typeof row?.value === 'string') process.stdout.write(row.value);
          NODE
          }

          export_one() {
            local name="$1"
            local value
            value=$(get_setting "$name")
            if [ -n "$value" ]; then
              echo "::add-mask::$value"
              printf '%s<<DSG_EOF\n%s\nDSG_EOF\n' "$name" "$value" >> "$GITHUB_ENV"
              return 0
            fi
            return 1
          }

          required=(DSG_CONTROL_PLANE_URL DSG_CONTROL_PLANE_API_KEY DSG_AGI_SIMULATION_URL DSG_CINEMA_PROOF_URL)
          for name in "${required[@]}"; do
            export_one "$name" || { echo "BLOCK: missing production binding name=$name"; exit 1; }
          done

          export_one DSG_AGI_SIMULATION_API_KEY || true
          export_one DSG_CINEMA_PROOF_API_KEY || true
          export_one DSG_AIMO_ROOT_KEY || true

          sim_key=$(get_setting DSG_AGI_SIMULATION_API_KEY)
          cinema_key=$(get_setting DSG_CINEMA_PROOF_API_KEY)
          root_key=$(get_setting DSG_AIMO_ROOT_KEY)
          test -n "$sim_key" || test -n "$root_key" || { echo 'BLOCK: simulation auth binding missing'; exit 1; }
          test -n "$cinema_key" || test -n "$root_key" || { echo 'BLOCK: Cinema auth binding missing'; exit 1; }
          echo 'AZURE_DSG_ONE_BINDINGS=PASS'

      - name: Execute full live authority chain
        shell: bash
        working-directory: _proof/dsg-one-live-harness
        env:
          NODE_ENV: production
          DSG_AIMO_MAX_PARALLELISM: '1'
        run: |
          set -euo pipefail
          npm run live 2>&1 | tee live-e2e.log
          grep -q '^FULL_LIVE_E2E=PASS$' live-e2e.log

      - name: Upload safe live proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-live-aimo-e2e-${{ github.run_id }}
          path: |
            _proof/dsg-one-live-harness/live-e2e-proof.json
            _proof/dsg-one-live-harness/live-e2e.log
            _proof/dsg-one-live-harness/SOURCE_MANIFEST.json
          if-no-files-found: warn
          retention-days: 30
