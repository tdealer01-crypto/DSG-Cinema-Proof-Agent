name: Probe Cinema Azure Runtime

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The staging GitHub Environment supplies the read-capable PR OIDC subject.
    # The resource being probed below is the current production Container App.
    environment: staging
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Probe current production Container App
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          APP_JSON=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --output json)

          HOST=$(jq -r '.properties.configuration.ingress.fqdn // empty' <<<"$APP_JSON")
          PROVISIONING_STATE=$(jq -r '.properties.provisioningState // empty' <<<"$APP_JSON")
          RUNNING_STATUS=$(jq -r '.properties.runningStatus // empty' <<<"$APP_JSON")
          LATEST_REVISION=$(jq -r '.properties.latestRevisionName // empty' <<<"$APP_JSON")
          ENVIRONMENT_ID=$(jq -r '.properties.environmentId // empty' <<<"$APP_JSON")
          CONFIG_PRESENCE_JSON=$(jq -c '
            [.properties.template.containers[0].env[]?.name] as $names |
            {
              STRIPE_SECRET_KEY: ($names | index("STRIPE_SECRET_KEY") != null),
              STRIPE_WEBHOOK_SECRET: ($names | index("STRIPE_WEBHOOK_SECRET") != null),
              STRIPE_PRODUCT_ID: ($names | index("STRIPE_PRODUCT_ID") != null),
              STRIPE_PRICE_ID: ($names | index("STRIPE_PRICE_ID") != null),
              STRIPE_METER_ID: ($names | index("STRIPE_METER_ID") != null),
              STRIPE_METER_EVENT_NAME: ($names | index("STRIPE_METER_EVENT_NAME") != null),
              STRIPE_WEBHOOK_ENDPOINT_ID: ($names | index("STRIPE_WEBHOOK_ENDPOINT_ID") != null),
              STRIPE_WEBHOOK_ENDPOINT_URL: ($names | index("STRIPE_WEBHOOK_ENDPOINT_URL") != null),
              GITHUB_MARKETPLACE_WEBHOOK_SECRET: ($names | index("GITHUB_MARKETPLACE_WEBHOOK_SECRET") != null),
              GITHUB_MARKETPLACE_OAUTH_CLIENT_ID: ($names | index("GITHUB_MARKETPLACE_OAUTH_CLIENT_ID") != null),
              GITHUB_MARKETPLACE_OAUTH_CLIENT_SECRET: ($names | index("GITHUB_MARKETPLACE_OAUTH_CLIENT_SECRET") != null)
            }
          ' <<<"$APP_JSON")

          test -n "$HOST"
          : > /tmp/cinema-health-body
          : > /tmp/billing-status-body
          : > /tmp/marketplace-status-body

          set +e
          HEALTH_CODE=$(curl --silent --show-error \
            --output /tmp/cinema-health-body \
            --write-out '%{http_code}' \
            --max-time 30 \
            "https://$HOST/health")
          HEALTH_RC=$?
          BILLING_CODE=$(curl --silent --show-error \
            --output /tmp/billing-status-body \
            --write-out '%{http_code}' \
            --max-time 30 \
            "https://$HOST/billing/status")
          BILLING_RC=$?
          MARKETPLACE_CODE=$(curl --silent --show-error \
            --output /tmp/marketplace-status-body \
            --write-out '%{http_code}' \
            --max-time 30 \
            "https://$HOST/marketplace/github/status")
          MARKETPLACE_RC=$?
          set -e

          if [[ "$HEALTH_RC" != "0" ]]; then HEALTH_CODE=0; fi
          if [[ "$BILLING_RC" != "0" ]]; then BILLING_CODE=0; fi
          if [[ "$MARKETPLACE_RC" != "0" ]]; then MARKETPLACE_CODE=0; fi

          HEALTH_READY=false
          if [[ "$HEALTH_CODE" == "200" ]] && \
             jq -e '.status == "ready" and .backend == "ready"' /tmp/cinema-health-body >/dev/null 2>&1; then
            HEALTH_READY=true
          fi

          BILLING_READABLE=false
          if [[ "$BILLING_CODE" == "200" ]] && \
             jq -e '.billing_version and (.metering_enabled == true) and .checkout_status and .stripe and .ledger' \
               /tmp/billing-status-body >/dev/null 2>&1; then
            BILLING_READABLE=true
          fi

          MARKETPLACE_READABLE=false
          if [[ "$MARKETPLACE_CODE" == "200" ]] && \
             jq -e '.status and .checks' /tmp/marketplace-status-body >/dev/null 2>&1; then
            MARKETPLACE_READABLE=true
          fi

          CHECKOUT_STATUS=$(jq -r '.checkout_status // "UNAVAILABLE"' /tmp/billing-status-body 2>/dev/null || echo UNAVAILABLE)
          STRIPE_CHARGES_ENABLED=$(jq -r '.stripe.charges_enabled // false' /tmp/billing-status-body 2>/dev/null || echo false)
          METERING_ENFORCED=$(jq -r '.metering_enforced // false' /tmp/billing-status-body 2>/dev/null || echo false)
          ENFORCEMENT_READY=$(jq -r '.enforcement_ready // false' /tmp/billing-status-body 2>/dev/null || echo false)
          LEDGER_ENTRIES=$(jq -r '.ledger.entries // 0' /tmp/billing-status-body 2>/dev/null || echo 0)
          STRIPE_JSON=$(jq -c '.stripe // {}' /tmp/billing-status-body 2>/dev/null || echo '{}')
          MARKETPLACE_JSON=$(jq -c '.' /tmp/marketplace-status-body 2>/dev/null || echo '{}')

          jq -n \
            --arg app_name "$CINEMA_APP" \
            --arg host "$HOST" \
            --arg provisioning_state "$PROVISIONING_STATE" \
            --arg running_status "$RUNNING_STATUS" \
            --arg latest_revision "$LATEST_REVISION" \
            --arg environment_id "$ENVIRONMENT_ID" \
            --argjson config_presence "$CONFIG_PRESENCE_JSON" \
            --argjson health_http_status "$HEALTH_CODE" \
            --argjson health_ready "$HEALTH_READY" \
            --argjson billing_http_status "$BILLING_CODE" \
            --argjson billing_readable "$BILLING_READABLE" \
            --arg checkout_status "$CHECKOUT_STATUS" \
            --argjson stripe_charges_enabled "$STRIPE_CHARGES_ENABLED" \
            --argjson metering_enforced "$METERING_ENFORCED" \
            --argjson enforcement_ready "$ENFORCEMENT_READY" \
            --argjson ledger_entries "$LEDGER_ENTRIES" \
            --argjson stripe "$STRIPE_JSON" \
            --argjson marketplace_http_status "$MARKETPLACE_CODE" \
            --argjson marketplace_readable "$MARKETPLACE_READABLE" \
            --argjson marketplace "$MARKETPLACE_JSON" \
            '{
              target: "azure_container_app",
              app_name: $app_name,
              default_host: $host,
              provisioning_state: $provisioning_state,
              running_status: $running_status,
              latest_revision: $latest_revision,
              environment_id: $environment_id,
              config_presence: $config_presence,
              health: {
                http_status: $health_http_status,
                ready: $health_ready
              },
              revenue: {
                http_status: $billing_http_status,
                readable: $billing_readable,
                checkout_status: $checkout_status,
                stripe_charges_enabled: $stripe_charges_enabled,
                metering_enforced: $metering_enforced,
                enforcement_ready: $enforcement_ready,
                ledger_entries: $ledger_entries,
                stripe: $stripe
              },
              github_marketplace: {
                http_status: $marketplace_http_status,
                readable: $marketplace_readable,
                status: $marketplace
              }
            }' > cinema_runtime_probe.json

          cat cinema_runtime_probe.json

          if [[ "$HEALTH_READY" != "true" ]]; then
            echo 'Current production Cinema health is not ready.' >&2
            cat /tmp/cinema-health-body >&2 || true
            exit 1
          fi
          if [[ "$BILLING_READABLE" != "true" ]]; then
            echo 'Current production billing/status is unavailable or malformed.' >&2
            cat /tmp/billing-status-body >&2 || true
            exit 1
          fi
          if [[ "$MARKETPLACE_READABLE" != "true" ]]; then
            echo 'Current production marketplace/github/status is unavailable or malformed.' >&2
            cat /tmp/marketplace-status-body >&2 || true
            exit 1
          fi

      - name: Upload Cinema probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinema-runtime-probe-${{ github.sha }}
          path: cinema_runtime_probe.json
          retention-days: 30
          if-no-files-found: warn
