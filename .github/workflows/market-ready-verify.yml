name: Verify Market-Ready Product

on:
  pull_request:
    paths:
      - 'api_v1/market_ready_*'
      - 'market_ready_payload/**'
      - 'tools/dsgctl.py'
      - 'Dockerfile.cinema'
      - 'tests/test_market_ready_platform.py'
      - '.github/workflows/market-ready-verify.yml'
  push:
    branches: [main]
    paths:
      - 'api_v1/market_ready_*'
      - 'market_ready_payload/**'
      - 'tools/dsgctl.py'
      - 'Dockerfile.cinema'
      - 'tests/test_market_ready_platform.py'
      - '.github/workflows/market-ready-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Cinema test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cinema.txt pytest
      - name: Reconstruct exact sandbox-tested product shell
        run: python market_ready_payload/reconstruct.py
      - name: Verify exact source hashes and syntax
        shell: bash
        run: |
          set -euo pipefail
          # Preserve all immutable upstream SHA-256 checks, then independently
          # verify the exact bounded UI/CSS additions served from reconstruction.
          python3 - <<'PY'
          from pathlib import Path
          from market_ready_payload.reconstruct import (
              FILES, _verified_bytes, _add_oauth_entry,
              _add_scoped_navigation, _add_scope_styles,
              _add_existing_workspace_recovery, _guard_workspace_activation,
          )
          for name in ("index.html", "styles.css", "app.js"):
              prefix, expected = FILES[name]
              original = _verified_bytes(name, prefix, expected)
              if name == "index.html":
                  rendered = _add_existing_workspace_recovery(_add_scoped_navigation(_add_oauth_entry(original)))
              elif name == "styles.css":
                  rendered = _add_scope_styles(original)
              else:
                  rendered = _guard_workspace_activation(original)
              assert Path("market_ready_ui", name).read_bytes() == rendered, name
          print("MARKET_READY_VERIFIED_BASELINE_AND_SCOPED_UI=PASS")
          PY
          node --check market_ready_ui/app.js
          python -m py_compile api_v1/market_ready_platform.py api_v1/market_ready_ui.py tools/dsgctl.py
      - name: Run Market-Ready provisioner and OAuth entry tests
        run: python -m pytest -q tests/test_market_ready_platform.py tests/test_market_ready_oauth_entry.py
