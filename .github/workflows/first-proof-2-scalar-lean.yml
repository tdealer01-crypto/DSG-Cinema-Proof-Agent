name: First Proof 2 scalar Lean proof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PROJECT_DIR: formal/first-proof-2-scalar
  LEAN_TOOLCHAIN: leanprover/lean4:v4.28.0
  SCALAR_FILE: FirstProof2Scalar/Problem2Scalar.lean
  LOGICAL_FILE: FirstProof2Scalar/Problem2Logical.lean
  FOURIER_FILE: FirstProof2Scalar/Problem2FiniteFourier.lean
  VECTOR_FOURIER_FILE: FirstProof2Scalar/Problem2VectorFourier.lean

jobs:
  scalar-lean-proof:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout DSG formalization
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify deterministic source pins
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "${LEAN_TOOLCHAIN}"
          grep -F 'rev = "v4.28.0"' lakefile.toml
          grep -F 'theorem proposition6_scalar_spine' "${SCALAR_FILE}"
          grep -F 'theorem reference_dependency_logical_closure' "${LOGICAL_FILE}"
          grep -F 'theorem dft_const_one_support' "${FOURIER_FILE}"
          grep -F 'theorem vector_character_sum' "${VECTOR_FOURIER_FILE}"
          grep -F 'theorem vector_character_sum_eq_zero_of_ne_zero' "${VECTOR_FOURIER_FILE}"
          sha256sum "${SCALAR_FILE}" "${LOGICAL_FILE}" "${FOURIER_FILE}" "${VECTOR_FOURIER_FILE}" lean-toolchain lakefile.toml

      - name: Install pinned elan bootstrap
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/leanprover/elan/464c9d28395000a2a0128e07081e4956d50eced2/elan-init.sh' -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Confirm pinned Lean toolchain
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          lean --version
          lake --version
          lean --version | grep -F 'version 4.28.0'

      - name: Restore pinned Mathlib cache
        working-directory: ${{ env.PROJECT_DIR }}
        run: lake exe cache get

      - name: Build First Proof 2 formal project
        working-directory: ${{ env.PROJECT_DIR }}
        run: lake build

      - name: Kernel recheck theorem files
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          lake env lean "${SCALAR_FILE}"
          lake env lean "${LOGICAL_FILE}"
          lake env lean "${FOURIER_FILE}"
          lake env lean "${VECTOR_FOURIER_FILE}"

      - name: Audit theorem axioms for sorryAx
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          cat > FirstProof2AxiomAudit.lean <<'EOF'
          import FirstProof2Scalar.Problem2Scalar
          import FirstProof2Scalar.Problem2Logical
          import FirstProof2Scalar.Problem2FiniteFourier
          import FirstProof2Scalar.Problem2VectorFourier
          #print axioms Problem2Scalar.proposition6_scalar_spine
          #print axioms Problem2Logical.reference_dependency_logical_closure
          #print axioms Problem2FiniteFourier.dft_const_one_support
          #print axioms Problem2VectorFourier.vector_character_sum
          EOF
          lake env lean FirstProof2AxiomAudit.lean 2>&1 | tee /tmp/first-proof-2-axioms.txt
          if grep -F 'sorryAx' /tmp/first-proof-2-axioms.txt; then
            echo 'A theorem transitively depends on Lean sorryAx'
            exit 1
          fi
          echo 'NO_SORRY_AXIOM=PASS'

      - name: Emit deterministic proof receipt
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo 'FIRST_PROOF_2_SCALAR_LEAN=PASS'
          echo 'FIRST_PROOF_2_LOGICAL_SKELETON=PASS'
          echo 'FIRST_PROOF_2_FINITE_FOURIER=PASS'
          echo 'FIRST_PROOF_2_VECTOR_FOURIER=PASS'
          echo 'NO_SORRY_AXIOM=PASS'
          echo "LEAN_TOOLCHAIN=${LEAN_TOOLCHAIN}"
          echo 'SCALAR_THEOREM=Problem2Scalar.proposition6_scalar_spine'
          echo 'LOGICAL_THEOREM=Problem2Logical.reference_dependency_logical_closure'
          echo 'FOURIER_THEOREM=Problem2FiniteFourier.dft_const_one_support'
          echo 'VECTOR_FOURIER_THEOREM=Problem2VectorFourier.vector_character_sum'
          echo 'VECTOR_FOURIER_SCOPE=finite coordinate conductor quotient orthogonality only'
          echo 'CLAIM_BOUNDARY=matrix/lattice Fourier-to-K1(q) full p-adic identity remains external'
          sha256sum "${SCALAR_FILE}" "${LOGICAL_FILE}" "${FOURIER_FILE}" "${VECTOR_FOURIER_FILE}" lean-toolchain lakefile.toml
