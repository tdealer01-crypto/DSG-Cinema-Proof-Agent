name: PI-Bench AgentBeats DSG

on:
  pull_request:
    paths:
      - 'benchmarks/pibench_dsg/**'
      - '.github/workflows/pibench-agentbeats.yml'
  push:
    branches: [main]
    paths:
      - 'benchmarks/pibench_dsg/**'
      - '.github/workflows/pibench-agentbeats.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: benchmarks/pibench_dsg/requirements.txt

      - name: Install benchmark dependencies
        run: python -m pip install -r benchmarks/pibench_dsg/requirements.txt

      - name: Unit tests
        run: |
          mkdir -p benchmark-evidence
          pytest -q benchmarks/pibench_dsg/tests | tee benchmark-evidence/pytest.txt

      - name: Compile check
        run: python -m compileall -q benchmarks/pibench_dsg

      - name: Build AgentBeats image for linux/amd64
        run: |
          docker build --platform linux/amd64 \
            -f benchmarks/pibench_dsg/Dockerfile \
            -t dsg-pibench-agent:${GITHUB_SHA} .
          docker image inspect dsg-pibench-agent:${GITHUB_SHA} \
            --format '{{json .}}' > benchmark-evidence/docker-image.json

      - name: A2A card and bootstrap smoke proof
        run: |
          set -euo pipefail
          cid=$(docker run -d --rm -p 9010:9010 dsg-pibench-agent:${GITHUB_SHA} \
            --host 0.0.0.0 --port 9010 --card-url http://127.0.0.1:9010/)
          trap 'docker logs "$cid" > benchmark-evidence/container.log 2>&1 || true; docker stop "$cid" >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9010/health > benchmark-evidence/health.json; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:9010/.well-known/agent-card.json > benchmark-evidence/agent-card.json

          cat > benchmark-evidence/bootstrap-request.json <<'JSON'
          {
            "jsonrpc": "2.0",
            "id": "ci-bootstrap",
            "method": "message/send",
            "params": {
              "message": {
                "parts": [
                  {
                    "data": {
                      "bootstrap": true,
                      "run_id": "ci",
                      "domain": "ci",
                      "benchmark_context": [
                        {"kind": "policy", "content": "CI bootstrap proof only"}
                      ],
                      "tools": [
                        {
                          "type": "function",
                          "function": {
                            "name": "record_decision",
                            "parameters": {
                              "type": "object",
                              "properties": {
                                "decision": {
                                  "type": "string",
                                  "enum": ["ALLOW", "ALLOW-CONDITIONAL", "DENY", "ESCALATE"]
                                }
                              },
                              "required": ["decision"],
                              "additionalProperties": false
                            }
                          }
                        }
                      ]
                    }
                  }
                ]
              }
            }
          }
          JSON

          curl -fsS -X POST http://127.0.0.1:9010/ \
            -H 'content-type: application/json' \
            --data-binary @benchmark-evidence/bootstrap-request.json \
            > benchmark-evidence/bootstrap-response.json

          python - <<'PY'
          import json
          card = json.load(open('benchmark-evidence/agent-card.json'))
          response = json.load(open('benchmark-evidence/bootstrap-response.json'))
          assert 'urn:pi-bench:policy-bootstrap:v1' in card['extensions']
          data = response['result']['status']['message']['parts'][0]['data']
          assert data['bootstrapped'] is True
          assert data['context_id']
          PY

      - name: Evidence checksums
        if: always()
        run: |
          if [ -d benchmark-evidence ]; then
            find benchmark-evidence -type f -print0 | sort -z | xargs -0 sha256sum > benchmark-evidence/SHA256SUMS.txt || true
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pibench-agentbeats-verification-${{ github.sha }}
          path: benchmark-evidence
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and publish immutable AgentBeats image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: benchmarks/pibench_dsg/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/tdealer01-crypto/dsg-pibench-agent:latest
            ghcr.io/tdealer01-crypto/dsg-pibench-agent:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/tdealer01-crypto/DSG-Cinema-Proof-Agent
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=DSG Proof-Governed PI-Bench Agent

      - name: Record publish evidence
        run: |
          mkdir -p publish-evidence
          cat > publish-evidence/image.json <<JSON
          {
            "repository": "ghcr.io/tdealer01-crypto/dsg-pibench-agent",
            "commit": "${GITHUB_SHA}",
            "digest": "${{ steps.build.outputs.digest }}",
            "platform": "linux/amd64",
            "source": "https://github.com/tdealer01-crypto/DSG-Cinema-Proof-Agent"
          }
          JSON
          sha256sum publish-evidence/image.json > publish-evidence/SHA256SUMS.txt

      - name: Upload publish evidence
        uses: actions/upload-artifact@v4
        with:
          name: pibench-agentbeats-publish-${{ github.sha }}
          path: publish-evidence
          if-no-files-found: error
