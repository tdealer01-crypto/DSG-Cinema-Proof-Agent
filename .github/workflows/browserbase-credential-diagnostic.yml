name: Browserbase Credential Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browserbase-credential-diagnostic.yml'

permissions:
  contents: read

# Safe diagnostic only: never prints the credential or response body.
jobs:
  repository-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - name: Test repository-scope credential without revealing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BROWSERBASE_API_KEY:-}" ]]; then
            echo 'BROWSERBASE_REPOSITORY_SCOPE=MISSING'
            exit 0
          fi
          echo "::add-mask::$BROWSERBASE_API_KEY"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request GET 'https://api.browserbase.com/v1/projects' \
            --header "X-BB-API-Key: $BROWSERBASE_API_KEY")
          case "$code" in
            200) echo 'BROWSERBASE_REPOSITORY_SCOPE=VALID' ;;
            401) echo 'BROWSERBASE_REPOSITORY_SCOPE=UNAUTHORIZED' ;;
            *) echo "BROWSERBASE_REPOSITORY_SCOPE=HTTP_${code}" ;;
          esac

  production-environment-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
    steps:
      - name: Test production-environment credential without revealing it
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${BROWSERBASE_API_KEY:-}" ]]; then
            echo 'BROWSERBASE_PRODUCTION_SCOPE=MISSING'
            exit 0
          fi
          echo "::add-mask::$BROWSERBASE_API_KEY"
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request GET 'https://api.browserbase.com/v1/projects' \
            --header "X-BB-API-Key: $BROWSERBASE_API_KEY")
          case "$code" in
            200) echo 'BROWSERBASE_PRODUCTION_SCOPE=VALID' ;;
            401) echo 'BROWSERBASE_PRODUCTION_SCOPE=UNAUTHORIZED' ;;
            *) echo "BROWSERBASE_PRODUCTION_SCOPE=HTTP_${code}" ;;
          esac
