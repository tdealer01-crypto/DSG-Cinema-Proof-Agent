name: Deploy Cinema + Z3 Production

on:
  push:
    branches: [main]
    paths:
      - 'z3_main.py'
      - 'cinema_main.py'
      - 'requirements.txt'
      - 'requirements-cinema.txt'
      - 'Dockerfile'
      - 'Dockerfile.cinema'
      - 'tests/**'
      - '.github/workflows/deploy-cinema-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-z3-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      LOCATION: westus3
      ACR_NAME: tdealer01acr
      CONTAINER_ENV: dsg-z3-env-production
      ACR_PULL_IDENTITY: dsg-z3-acr-pull-production
      Z3_IMAGE_NAME: z3-solver-service
      Z3_APP: dsg-z3-verifier-production
      CINEMA_IMAGE_NAME: cinema-proof-agent
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production identity and secrets
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          PULL_IDENTITY_ID=$(az identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_PULL_IDENTITY" \
            --query id --output tsv)
          test -n "$PULL_IDENTITY_ID"

          Z3_SECRET=$(openssl rand -hex 32)
          CINEMA_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$Z3_SECRET"
          echo "::add-mask::$CINEMA_SECRET"
          echo "PULL_IDENTITY_ID=$PULL_IDENTITY_ID" >> "$GITHUB_ENV"
          echo "Z3_SECRET=$Z3_SECRET" >> "$GITHUB_ENV"
          echo "CINEMA_SECRET=$CINEMA_SECRET" >> "$GITHUB_ENV"

      - name: Ensure production Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_ENV" >/dev/null 2>&1; then
            az containerapp env create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_ENV" \
              --location "$LOCATION" \
              --output none
          fi

      - name: Build immutable production images
        shell: bash
        run: |
          set -euo pipefail
          Z3_TAG="prod-${GITHUB_SHA}"
          CINEMA_TAG="prod-${GITHUB_SHA}"
          Z3_IMAGE_REF="$ACR_NAME.azurecr.io/$Z3_IMAGE_NAME:$Z3_TAG"
          CINEMA_IMAGE_REF="$ACR_NAME.azurecr.io/$CINEMA_IMAGE_NAME:$CINEMA_TAG"
          echo "Z3_IMAGE_REF=$Z3_IMAGE_REF" >> "$GITHUB_ENV"
          echo "CINEMA_IMAGE_REF=$CINEMA_IMAGE_REF" >> "$GITHUB_ENV"

          az acr build --registry "$ACR_NAME" --image "$Z3_IMAGE_NAME:$Z3_TAG" --file Dockerfile .
          az acr build --registry "$ACR_NAME" --image "$CINEMA_IMAGE_NAME:$CINEMA_TAG" --file Dockerfile.cinema .

      - name: Deploy Z3 production
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            while (( attempt <= 8 )); do
              if "$@"; then return 0; fi
              sleep $((attempt * 10))
              ((attempt++))
            done
            return 1
          }

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" >/dev/null 2>&1; then
            retry az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --user-assigned "$PULL_IDENTITY_ID" --output none
            retry az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --server "$ACR_NAME.azurecr.io" --identity "$PULL_IDENTITY_ID" --output none
            retry az containerapp secret set --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --secrets "solver-secret=$Z3_SECRET" --output none
            retry az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
              --image "$Z3_IMAGE_REF" \
              --set-env-vars DSG_SOLVER_SHARED_SECRET=secretref:solver-secret Z3_DETERMINISTIC_SEED=42 Z3_TIMEOUT_MS=30000 PORT=8080 \
              --output none
          else
            retry az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --environment "$CONTAINER_ENV" \
              --image "$Z3_IMAGE_REF" --ingress external --target-port 8080 --transport http \
              --user-assigned "$PULL_IDENTITY_ID" --registry-server "$ACR_NAME.azurecr.io" --registry-identity "$PULL_IDENTITY_ID" \
              --secrets "solver-secret=$Z3_SECRET" \
              --env-vars DSG_SOLVER_SHARED_SECRET=secretref:solver-secret Z3_DETERMINISTIC_SEED=42 Z3_TIMEOUT_MS=30000 PORT=8080 \
              --min-replicas 1 --max-replicas 2 --cpu 0.5 --memory 1.0Gi --output none
          fi

          retry az containerapp ingress update \
            --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
            --type external --target-port 8080 --transport http --allow-insecure false --output none

          Z3_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$Z3_FQDN"
          echo "Z3_URL=https://$Z3_FQDN" >> "$GITHUB_ENV"

      - name: Verify direct production Z3 proof
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"request_id":"production-e2e","preset_name":"production","problem_type":"qubo","linear":[-4,-3,1],"quadratic":[[0,1,5],[1,2,2]],"proveOptimality":true,"z3TimeoutMs":30000}'
          echo "$PAYLOAD" > /tmp/payload.json

          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error --output /tmp/z3-ready.json --write-out '%{http_code}' "$Z3_URL/ready" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.status == "ready"' /tmp/z3-ready.json >/dev/null 2>&1; then
              SOLVE_CODE=$(curl --silent --show-error --output /tmp/z3-proof-1.json --write-out '%{http_code}' \
                --request POST "$Z3_URL/solve" --header "Authorization: Bearer $Z3_SECRET" --header 'Content-Type: application/json' --data @/tmp/payload.json || true)
              [[ "$SOLVE_CODE" == "200" ]] && break
            fi
            [[ "$attempt" == "72" ]] && exit 1
            sleep 5
          done

          curl --fail-with-body --silent --show-error \
            --request POST "$Z3_URL/solve" --header "Authorization: Bearer $Z3_SECRET" --header 'Content-Type: application/json' --data @/tmp/payload.json > /tmp/z3-proof-2.json

          jq -e '.verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .witness == [1,0,0] and .energy_exact == "-4"' /tmp/z3-proof-1.json >/dev/null
          test "$(jq -r .proof_hash /tmp/z3-proof-1.json)" = "$(jq -r .proof_hash /tmp/z3-proof-2.json)"
          test "$(jq -r .request_hash /tmp/z3-proof-1.json)" = "$(jq -r .request_hash /tmp/z3-proof-2.json)"

      - name: Deploy Cinema production
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            while (( attempt <= 8 )); do
              if "$@"; then return 0; fi
              sleep $((attempt * 10))
              ((attempt++))
            done
            return 1
          }

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" >/dev/null 2>&1; then
            retry az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --user-assigned "$PULL_IDENTITY_ID" --output none
            retry az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --server "$ACR_NAME.azurecr.io" --identity "$PULL_IDENTITY_ID" --output none
            retry az containerapp secret set --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --secrets "backend-secret=$Z3_SECRET" "cinema-secret=$CINEMA_SECRET" --output none
            retry az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --image "$CINEMA_IMAGE_REF" \
              --set-env-vars DSG_BACKEND_BASE_URL="$Z3_URL" DSG_BACKEND_API_KEY=secretref:backend-secret CINEMA_API_SECRET=secretref:cinema-secret PORT=8000 \
              --output none
          else
            retry az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --environment "$CONTAINER_ENV" \
              --image "$CINEMA_IMAGE_REF" --ingress external --target-port 8000 --transport http \
              --user-assigned "$PULL_IDENTITY_ID" --registry-server "$ACR_NAME.azurecr.io" --registry-identity "$PULL_IDENTITY_ID" \
              --secrets "backend-secret=$Z3_SECRET" "cinema-secret=$CINEMA_SECRET" \
              --env-vars DSG_BACKEND_BASE_URL="$Z3_URL" DSG_BACKEND_API_KEY=secretref:backend-secret CINEMA_API_SECRET=secretref:cinema-secret PORT=8000 \
              --min-replicas 1 --max-replicas 2 --cpu 0.5 --memory 1.0Gi --output none
          fi

          retry az containerapp ingress update \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --type external --target-port 8000 --transport http --allow-insecure false --output none

          CINEMA_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$CINEMA_FQDN"
          echo "CINEMA_URL=https://$CINEMA_FQDN" >> "$GITHUB_ENV"

      - name: Verify production Cinema to Z3 E2E and replay
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error --output /tmp/cinema-health.json --write-out '%{http_code}' "$CINEMA_URL/health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.status == "ready" and .backend == "ready"' /tmp/cinema-health.json >/dev/null 2>&1; then
              break
            fi
            [[ "$attempt" == "72" ]] && exit 1
            sleep 5
          done

          for out in /tmp/cinema-proof-1.json /tmp/cinema-proof-2.json; do
            curl --fail-with-body --silent --show-error \
              --request POST "$CINEMA_URL/solve" \
              --header "Authorization: Bearer $CINEMA_SECRET" \
              --header 'Content-Type: application/json' \
              --data @/tmp/payload.json > "$out"
          done

          jq -e '.cinema_status == "VERIFIED" and .verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .z3_proof.witness == [1,0,0] and .z3_proof.energy_exact == "-4"' /tmp/cinema-proof-1.json >/dev/null

          DIRECT_HASH=$(jq -r .proof_hash /tmp/z3-proof-1.json)
          DIRECT_REQUEST=$(jq -r .request_hash /tmp/z3-proof-1.json)
          CINEMA_HASH_1=$(jq -r .proof_hash /tmp/cinema-proof-1.json)
          CINEMA_HASH_2=$(jq -r .proof_hash /tmp/cinema-proof-2.json)
          CINEMA_REQUEST_1=$(jq -r .request_hash /tmp/cinema-proof-1.json)
          CINEMA_REQUEST_2=$(jq -r .request_hash /tmp/cinema-proof-2.json)

          test "$CINEMA_HASH_1" = "$CINEMA_HASH_2"
          test "$CINEMA_REQUEST_1" = "$CINEMA_REQUEST_2"
          test "$CINEMA_HASH_1" = "$DIRECT_HASH"
          test "$CINEMA_REQUEST_1" = "$DIRECT_REQUEST"

      - name: Write non-secret production evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg z3_url "$Z3_URL" \
            --arg cinema_url "$CINEMA_URL" \
            --arg z3_image "$Z3_IMAGE_REF" \
            --arg cinema_image "$CINEMA_IMAGE_REF" \
            --slurpfile direct /tmp/z3-proof-1.json \
            --slurpfile cinema /tmp/cinema-proof-1.json \
            '{commit:$commit,environment:"production",transport:"https",z3_url:$z3_url,cinema_url:$cinema_url,z3_image:$z3_image,cinema_image:$cinema_image,direct_verification:$direct[0].verification,cinema_status:$cinema[0].cinema_status,verification:$cinema[0].verification,witness:$cinema[0].z3_proof.witness,energy_exact:$cinema[0].z3_proof.energy_exact,proof_hash:$cinema[0].proof_hash,request_hash:$cinema[0].request_hash,replay_match:true,direct_proof_match:true}' \
            > production_evidence.json
          cat production_evidence.json

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinema-production-evidence-${{ github.sha }}
          path: production_evidence.json
          retention-days: 30
