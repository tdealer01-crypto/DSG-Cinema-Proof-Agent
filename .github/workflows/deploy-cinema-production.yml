name: Deploy Cinema + Z3 Production

on:
  push:
    branches: [main]
    paths:
      - 'z3_main.py'
      - 'cinema_main.py'
      - 'requirements.txt'
      - 'requirements-cinema.txt'
      - 'revenue/**'
      - 'Dockerfile'
      - 'Dockerfile.cinema'
      - 'tests/**'
      - '.github/workflows/deploy-cinema-production.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-z3-production
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      LOCATION: westus3
      ACR_NAME: tdealer01acr
      CONTAINER_ENV: dsg-z3-env-production
      ACR_PULL_IDENTITY: dsg-z3-acr-pull-production
      Z3_IMAGE_NAME: z3-solver-service
      Z3_APP: dsg-z3-verifier-production
      CINEMA_IMAGE_NAME: cinema-proof-agent
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      CONFIGURED_REVENUE_ADMIN_SECRET: ${{ secrets.DSG_REVENUE_ADMIN_SECRET }}
      # Metering always records usage. Enforcement (paid gating) stays opt-in
      # until a durable ledger store is attached; see REVENUE_AUTOMATION.md.
      REVENUE_ENFORCE: ${{ vars.DSG_REVENUE_ENFORCE || '0' }}
      # Stripe credentials. Setting DSG_KEY_VAULT_NAME makes the deployment read
      # them from Key Vault through the app's managed identity instead, so the
      # live key never passes through this workflow. See SECRET_MANAGEMENT.md.
      KEY_VAULT_NAME: ${{ vars.DSG_KEY_VAULT_NAME }}
      KEY_VAULT_Z3_SECRET_NAME: ${{ vars.DSG_KEY_VAULT_Z3_SECRET_NAME || 'z3-backend-shared-secret' }}
      CONFIGURED_Z3_SHARED_SECRET: ${{ secrets.DSG_Z3_SHARED_SECRET }}
      KEY_VAULT_STRIPE_SECRET_NAME: ${{ vars.DSG_KEY_VAULT_STRIPE_SECRET_NAME || 'stripe-secret-key' }}
      KEY_VAULT_STRIPE_WEBHOOK_NAME: ${{ vars.DSG_KEY_VAULT_STRIPE_WEBHOOK_NAME || 'stripe-webhook-secret' }}
      CONFIGURED_STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      CONFIGURED_STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      # Stripe catalog identity. These are object ids, not credentials, so they
      # belong in repository variables. Supplying one is only a claim: the app
      # verifies every id against Stripe before it will report that checkout
      # works, so a wrong id fails loudly instead of charging nothing.
      CONFIGURED_STRIPE_PRODUCT_ID: ${{ vars.DSG_STRIPE_PRODUCT_ID }}
      CONFIGURED_STRIPE_PRICE_ID: ${{ vars.DSG_STRIPE_PRICE_ID }}
      CONFIGURED_STRIPE_METER_ID: ${{ vars.DSG_STRIPE_METER_ID }}
      CONFIGURED_STRIPE_METER_EVENT_NAME: ${{ vars.DSG_STRIPE_METER_EVENT_NAME || 'dsg_verified_execution' }}
      CONFIGURED_STRIPE_WEBHOOK_ENDPOINT_ID: ${{ vars.DSG_STRIPE_WEBHOOK_ENDPOINT_ID }}
      CONFIGURED_STRIPE_WEBHOOK_ENDPOINT_URL: ${{ vars.DSG_STRIPE_WEBHOOK_ENDPOINT_URL }}
      # Durable revenue storage. Enforcement stays refused until the ledger and
      # account registry survive a restart and have a single writer.
      REVENUE_STORAGE_ACCOUNT: ${{ vars.DSG_REVENUE_STORAGE_ACCOUNT || 'dsgrevenuestore' }}
      REVENUE_SHARE_NAME: revenue
      REVENUE_MOUNT_PATH: /revenue

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Cinema and marketplace contracts before deployment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cinema.txt pytest
          python -m py_compile cinema_main.py marketplace_verification.py revenue/*.py
          python -m pytest -q tests/test_cinema_main.py tests/test_marketplace_surfaces.py tests/test_revenue.py

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve production identity and secrets
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          PULL_IDENTITY_ID=$(az identity show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$ACR_PULL_IDENTITY" \
            --query id --output tsv)
          test -n "$PULL_IDENTITY_ID"

          Z3_SECRET="${CONFIGURED_Z3_SHARED_SECRET:-}"
          if [[ -z "$Z3_SECRET" ]]; then
            echo 'DSG_Z3_SHARED_SECRET is required; refusing to mint a deployment credential.' >&2
            exit 1
          fi
          if [[ ${#Z3_SECRET} -lt 32 ]]; then
            echo 'DSG_Z3_SHARED_SECRET must contain at least 32 characters.' >&2
            exit 1
          fi
          CINEMA_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$Z3_SECRET"
          echo "::add-mask::$CINEMA_SECRET"

          # Revenue reconciliation must use a stable repository secret. Missing
          # configuration stays explicitly unavailable; never mint an ephemeral
          # value that the scheduled workflow cannot know.
          REVENUE_ADMIN_SECRET="${CONFIGURED_REVENUE_ADMIN_SECRET:-}"
          if [[ -z "$REVENUE_ADMIN_SECRET" ]]; then
            REVENUE_ADMIN_CONFIGURED=false
            echo 'DSG_REVENUE_ADMIN_SECRET is not configured; admin reconciliation will remain unavailable.'
          else
            REVENUE_ADMIN_CONFIGURED=true
            echo "::add-mask::$REVENUE_ADMIN_SECRET"
          fi

          # Enforcement charges against the ledger's contents, and the only
          # proof the ledger survives a restart runs through the admin route.
          # Without that secret the proof later in this workflow is skipped, so
          # enforcement would go live having never been shown that a paid
          # customer's usage outlives a revision. Refuse here, before anything
          # in production has been touched, rather than turning on unproven.
          if [[ "$REVENUE_ENFORCE" == "1" && "$REVENUE_ADMIN_CONFIGURED" != "true" ]]; then
            echo 'DSG_REVENUE_ENFORCE=1 requires DSG_REVENUE_ADMIN_SECRET.' >&2
            echo 'Without it the ledger restart-survival proof is skipped and paid gating would run unproven.' >&2
            exit 1
          fi

          echo "PULL_IDENTITY_ID=$PULL_IDENTITY_ID" >> "$GITHUB_ENV"
          echo "Z3_SECRET=$Z3_SECRET" >> "$GITHUB_ENV"
          echo "CINEMA_SECRET=$CINEMA_SECRET" >> "$GITHUB_ENV"
          echo "REVENUE_ADMIN_SECRET=$REVENUE_ADMIN_SECRET" >> "$GITHUB_ENV"
          echo "REVENUE_ADMIN_CONFIGURED=$REVENUE_ADMIN_CONFIGURED" >> "$GITHUB_ENV"

      - name: Ensure production Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp env show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_ENV" >/dev/null 2>&1; then
            az containerapp env create \
              --resource-group "$RESOURCE_GROUP" \
              --name "$CONTAINER_ENV" \
              --location "$LOCATION" \
              --output none
          fi

      - name: Ensure durable revenue storage
        shell: bash
        run: |
          set -euo pipefail

          # A file-backed ledger on a container filesystem is lost on restart,
          # which is why enforcement refuses to turn on without this. An Azure
          # Files share gives the ledger and the account registry a lifetime
          # independent of any revision.
          if ! az storage account show --resource-group "$RESOURCE_GROUP" --name "$REVENUE_STORAGE_ACCOUNT" >/dev/null 2>&1; then
            az storage account create \
              --resource-group "$RESOURCE_GROUP" --name "$REVENUE_STORAGE_ACCOUNT" \
              --location "$LOCATION" --sku Standard_LRS --kind StorageV2 \
              --min-tls-version TLS1_2 --allow-blob-public-access false \
              --output none
          fi

          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" --account-name "$REVENUE_STORAGE_ACCOUNT" \
            --query '[0].value' --output tsv)
          test -n "$STORAGE_KEY"
          echo "::add-mask::$STORAGE_KEY"

          az storage share-rm create \
            --resource-group "$RESOURCE_GROUP" --storage-account "$REVENUE_STORAGE_ACCOUNT" \
            --name "$REVENUE_SHARE_NAME" --quota 16 --output none 2>/dev/null || true

          # Register the share with the Container Apps environment so the app
          # can mount it. AccessMode ReadWrite is required: the ledger appends.
          az containerapp env storage set \
            --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_ENV" \
            --storage-name "$REVENUE_SHARE_NAME" \
            --azure-file-account-name "$REVENUE_STORAGE_ACCOUNT" \
            --azure-file-account-key "$STORAGE_KEY" \
            --azure-file-share-name "$REVENUE_SHARE_NAME" \
            --access-mode ReadWrite --output none

          echo 'REVENUE_STORAGE_READY=1' >> "$GITHUB_ENV"

      - name: Build immutable production images
        shell: bash
        run: |
          set -euo pipefail
          Z3_TAG="prod-${GITHUB_SHA}"
          CINEMA_TAG="prod-${GITHUB_SHA}"
          Z3_IMAGE_REF="$ACR_NAME.azurecr.io/$Z3_IMAGE_NAME:$Z3_TAG"
          CINEMA_IMAGE_REF="$ACR_NAME.azurecr.io/$CINEMA_IMAGE_NAME:$CINEMA_TAG"
          echo "Z3_IMAGE_REF=$Z3_IMAGE_REF" >> "$GITHUB_ENV"
          echo "CINEMA_IMAGE_REF=$CINEMA_IMAGE_REF" >> "$GITHUB_ENV"

          az acr build --registry "$ACR_NAME" --image "$Z3_IMAGE_NAME:$Z3_TAG" --file Dockerfile .
          az acr build --registry "$ACR_NAME" --image "$CINEMA_IMAGE_NAME:$CINEMA_TAG" --file Dockerfile.cinema .

      - name: Deploy Z3 production
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            while (( attempt <= 8 )); do
              if "$@"; then return 0; fi
              sleep $((attempt * 10))
              ((attempt++))
            done
            return 1
          }

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" >/dev/null 2>&1; then
            # Cinema is still running on the previous credential until its own
            # deployment step lands. Keep accepting that value for the length of
            # this deployment so requests in flight are not rejected against a
            # secret that is correct but one revision old. The window is closed
            # explicitly once the Cinema E2E has passed.
            PREVIOUS_Z3_SECRET=$(az containerapp secret show \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
              --secret-name solver-secret --query value --output tsv 2>/dev/null || true)

            Z3_SECRET_ARGS=("solver-secret=$Z3_SECRET")
            # The shared credential is stable and supplied by the production
            # environment. Do not retain a previous per-deployment value: accepting
            # it can leave old revisions healthy and serving traffic indefinitely.
            Z3_ROTATION_ENV="DSG_SOLVER_PREVIOUS_SECRET="
            echo 'ROTATION_WINDOW_OPEN=0' >> "$GITHUB_ENV"

            retry az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --user-assigned "$PULL_IDENTITY_ID" --output none
            retry az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --server "$ACR_NAME.azurecr.io" --identity "$PULL_IDENTITY_ID" --output none
            retry az containerapp secret set --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --secrets "${Z3_SECRET_ARGS[@]}" --output none
            retry az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
              --image "$Z3_IMAGE_REF" \
              --revision-suffix "z3-${GITHUB_RUN_ATTEMPT}-${GITHUB_RUN_ID}" \
              --set-env-vars DSG_SOLVER_SHARED_SECRET=secretref:solver-secret "$Z3_ROTATION_ENV" Z3_DETERMINISTIC_SEED=42 Z3_TIMEOUT_MS=30000 PORT=8080 \
              --output none
          else
            # First deployment: there is no earlier credential to honour.
            echo 'ROTATION_WINDOW_OPEN=0' >> "$GITHUB_ENV"
            retry az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --environment "$CONTAINER_ENV" \
              --image "$Z3_IMAGE_REF" --ingress external --target-port 8080 --transport http \
              --user-assigned "$PULL_IDENTITY_ID" --registry-server "$ACR_NAME.azurecr.io" --registry-identity "$PULL_IDENTITY_ID" \
              --secrets "solver-secret=$Z3_SECRET" \
              --env-vars DSG_SOLVER_SHARED_SECRET=secretref:solver-secret Z3_DETERMINISTIC_SEED=42 Z3_TIMEOUT_MS=30000 PORT=8080 \
              --min-replicas 1 --max-replicas 2 --cpu 0.5 --memory 1.0Gi --output none
          fi

          retry az containerapp ingress update \
            --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
            --type external --target-port 8080 --transport http --allow-insecure false --output none

          Z3_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$Z3_FQDN"
          echo "Z3_URL=https://$Z3_FQDN" >> "$GITHUB_ENV"

      - name: Verify direct production Z3 proof
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"request_id":"production-e2e","preset_name":"production","problem_type":"qubo","linear":[-4,-3,1],"quadratic":[[0,1,5],[1,2,2]],"proveOptimality":true,"z3TimeoutMs":30000}'
          echo "$PAYLOAD" > /tmp/payload.json

          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error --output /tmp/z3-ready.json --write-out '%{http_code}' "$Z3_URL/ready" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.status == "ready"' /tmp/z3-ready.json >/dev/null 2>&1; then
              SOLVE_CODE=$(curl --silent --show-error --output /tmp/z3-proof-1.json --write-out '%{http_code}' \
                --request POST "$Z3_URL/solve" --header "Authorization: Bearer $Z3_SECRET" --header 'Content-Type: application/json' --data @/tmp/payload.json || true)
              [[ "$SOLVE_CODE" == "200" ]] && break
            fi
            [[ "$attempt" == "72" ]] && exit 1
            sleep 5
          done

          curl --fail-with-body --silent --show-error \
            --request POST "$Z3_URL/solve" --header "Authorization: Bearer $Z3_SECRET" --header 'Content-Type: application/json' --data @/tmp/payload.json > /tmp/z3-proof-2.json

          jq -e '.verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .witness == [1,0,0] and .energy_exact == "-4"' /tmp/z3-proof-1.json >/dev/null
          test "$(jq -r .proof_hash /tmp/z3-proof-1.json)" = "$(jq -r .proof_hash /tmp/z3-proof-2.json)"
          test "$(jq -r .request_hash /tmp/z3-proof-1.json)" = "$(jq -r .request_hash /tmp/z3-proof-2.json)"

      - name: Deploy Cinema production
        shell: bash
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            while (( attempt <= 8 )); do
              if "$@"; then return 0; fi
              sleep $((attempt * 10))
              ((attempt++))
            done
            return 1
          }

          # Secret and env sets are assembled once, so an optional credential adds
          # one array entry instead of another copy of the whole deployment call.
          CINEMA_SECRET_ARGS=("backend-secret=$Z3_SECRET" "cinema-secret=$CINEMA_SECRET")
          CINEMA_ENV_ARGS=(
            DSG_BACKEND_BASE_URL="$Z3_URL"
            DSG_BACKEND_API_KEY=secretref:backend-secret
            CINEMA_API_SECRET=secretref:cinema-secret
            DSG_REVENUE_ENFORCE="$REVENUE_ENFORCE"
            PORT=8000
          )

          if [[ "$REVENUE_ADMIN_CONFIGURED" == "true" ]]; then
            CINEMA_SECRET_ARGS+=("revenue-admin-secret=$REVENUE_ADMIN_SECRET")
            CINEMA_ENV_ARGS+=(DSG_REVENUE_ADMIN_SECRET=secretref:revenue-admin-secret)
          fi

          # Stripe credentials are long-lived and externally issued, unlike the
          # per-deployment values above: they cannot be regenerated on each run
          # and a leak costs money. Prefer Key Vault so they are stored, rotated,
          # and audited outside this workflow, with repository secrets as the
          # fallback. With neither configured Stripe stays unlinked, and
          # /billing/status keeps reporting NOT_VERIFIED_NOT_LINKED truthfully.
          STRIPE_SOURCE='none'
          STRIPE_WEBHOOK_SECRET_PROVISIONED='false'
          if [[ -n "$KEY_VAULT_NAME" ]]; then
            VAULT_BASE="https://$KEY_VAULT_NAME.vault.azure.net/secrets"
            CINEMA_SECRET_ARGS+=(
              "stripe-secret-key=keyvaultref:$VAULT_BASE/$KEY_VAULT_STRIPE_SECRET_NAME,identityref:$PULL_IDENTITY_ID"
              "stripe-webhook-secret=keyvaultref:$VAULT_BASE/$KEY_VAULT_STRIPE_WEBHOOK_NAME,identityref:$PULL_IDENTITY_ID"
            )
            CINEMA_ENV_ARGS+=(
              STRIPE_SECRET_KEY=secretref:stripe-secret-key
              STRIPE_WEBHOOK_SECRET=secretref:stripe-webhook-secret
            )
            STRIPE_SOURCE='key_vault'
            STRIPE_WEBHOOK_SECRET_PROVISIONED='true'
          else
            if [[ -n "$CONFIGURED_STRIPE_SECRET_KEY" ]]; then
              CINEMA_SECRET_ARGS+=("stripe-secret-key=$CONFIGURED_STRIPE_SECRET_KEY")
              CINEMA_ENV_ARGS+=(STRIPE_SECRET_KEY=secretref:stripe-secret-key)
              STRIPE_SOURCE='repository_secret'
            fi
            if [[ -n "$CONFIGURED_STRIPE_WEBHOOK_SECRET" ]]; then
              CINEMA_SECRET_ARGS+=("stripe-webhook-secret=$CONFIGURED_STRIPE_WEBHOOK_SECRET")
              CINEMA_ENV_ARGS+=(STRIPE_WEBHOOK_SECRET=secretref:stripe-webhook-secret)
              STRIPE_SOURCE='repository_secret'
              STRIPE_WEBHOOK_SECRET_PROVISIONED='true'
            fi
          fi
          # The catalog ids decide whether the credentials can reach money at
          # all: without a product and price the app has nothing to charge
          # against, so it scopes webhooks closed no matter what secrets it
          # holds. Pass through only the ids that are actually configured.
          STRIPE_CATALOG_SCOPED='false'
          if [[ -n "$CONFIGURED_STRIPE_PRODUCT_ID" && -n "$CONFIGURED_STRIPE_PRICE_ID" ]]; then
            STRIPE_CATALOG_SCOPED='true'
          fi
          for catalog_pair in \
            "STRIPE_PRODUCT_ID=$CONFIGURED_STRIPE_PRODUCT_ID" \
            "STRIPE_PRICE_ID=$CONFIGURED_STRIPE_PRICE_ID" \
            "STRIPE_METER_ID=$CONFIGURED_STRIPE_METER_ID" \
            "STRIPE_METER_EVENT_NAME=$CONFIGURED_STRIPE_METER_EVENT_NAME" \
            "STRIPE_WEBHOOK_ENDPOINT_ID=$CONFIGURED_STRIPE_WEBHOOK_ENDPOINT_ID" \
            "STRIPE_WEBHOOK_ENDPOINT_URL=$CONFIGURED_STRIPE_WEBHOOK_ENDPOINT_URL"; do
            if [[ -n "${catalog_pair#*=}" ]]; then
              CINEMA_ENV_ARGS+=("$catalog_pair")
            fi
          done

          # Holding the signing secret and being able to act on a webhook are
          # different facts, and they drive different assertions after the
          # deployment. The secret alone decides whether the route answers a
          # forged event with 400 rather than 503; the app only reports webhooks
          # configured once it also has the catalog scope to apply one against.
          STRIPE_WEBHOOK_CONFIGURED='false'
          if [[ "$STRIPE_WEBHOOK_SECRET_PROVISIONED" == "true" && "$STRIPE_CATALOG_SCOPED" == "true" ]]; then
            STRIPE_WEBHOOK_CONFIGURED='true'
          fi

          echo "STRIPE_SOURCE=$STRIPE_SOURCE" >> "$GITHUB_ENV"
          echo "STRIPE_CATALOG_SCOPED=$STRIPE_CATALOG_SCOPED" >> "$GITHUB_ENV"
          echo "STRIPE_WEBHOOK_SECRET_PROVISIONED=$STRIPE_WEBHOOK_SECRET_PROVISIONED" >> "$GITHUB_ENV"
          echo "STRIPE_WEBHOOK_CONFIGURED=$STRIPE_WEBHOOK_CONFIGURED" >> "$GITHUB_ENV"

          # Point the stores at the mounted share and attest only what this
          # deployment actually arranged. Single-writer is a property of the
          # replica ceiling, so it is derived here rather than declared: an
          # attestation that does not match the deployment would let enforcement
          # run on a ledger two replicas are racing to rewrite.
          CINEMA_MAX_REPLICAS=2
          if [[ "${REVENUE_STORAGE_READY:-0}" == "1" ]]; then
            CINEMA_ENV_ARGS+=(
              DSG_REVENUE_ACCOUNT_STORE="$REVENUE_MOUNT_PATH/accounts.json"
              DSG_REVENUE_LEDGER_STORE="$REVENUE_MOUNT_PATH/ledger.json"
              DSG_REVENUE_STORAGE_DURABLE=1
            )
            if [[ "$REVENUE_ENFORCE" == "1" ]]; then
              # Paid gating runs on exactly one writer.
              CINEMA_MAX_REPLICAS=1
              CINEMA_ENV_ARGS+=(DSG_REVENUE_SINGLE_WRITER=1)
            else
              CINEMA_ENV_ARGS+=(DSG_REVENUE_SINGLE_WRITER=0)
            fi
          else
            CINEMA_ENV_ARGS+=(DSG_REVENUE_STORAGE_DURABLE=0 DSG_REVENUE_SINGLE_WRITER=0)
          fi
          echo "CINEMA_MAX_REPLICAS=$CINEMA_MAX_REPLICAS" >> "$GITHUB_ENV"
          echo "Stripe credential source: $STRIPE_SOURCE"

          if az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" >/dev/null 2>&1; then
            retry az containerapp identity assign --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --user-assigned "$PULL_IDENTITY_ID" --output none
            retry az containerapp registry set --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --server "$ACR_NAME.azurecr.io" --identity "$PULL_IDENTITY_ID" --output none
            retry az containerapp secret set --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --secrets "${CINEMA_SECRET_ARGS[@]}" --output none
            retry az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --image "$CINEMA_IMAGE_REF" \
              --revision-suffix "cinema-${GITHUB_RUN_ATTEMPT}-${GITHUB_RUN_ID}" \
              --set-env-vars "${CINEMA_ENV_ARGS[@]}" \
              --min-replicas 1 --max-replicas "$CINEMA_MAX_REPLICAS" \
              --output none
          else
            retry az containerapp create \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --environment "$CONTAINER_ENV" \
              --image "$CINEMA_IMAGE_REF" --ingress external --target-port 8000 --transport http \
              --user-assigned "$PULL_IDENTITY_ID" --registry-server "$ACR_NAME.azurecr.io" --registry-identity "$PULL_IDENTITY_ID" \
              --secrets "${CINEMA_SECRET_ARGS[@]}" \
              --env-vars "${CINEMA_ENV_ARGS[@]}" \
              --min-replicas 1 --max-replicas "$CINEMA_MAX_REPLICAS" --cpu 0.5 --memory 1.0Gi --output none
          fi

          # Mount the durable share. Done after the app exists so the same call
          # works for both create and update.
          if [[ "${REVENUE_STORAGE_READY:-0}" == "1" ]]; then
            CURRENT=$(mktemp --suffix=.yaml)
            az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --output yaml > "$CURRENT"
            python - "$CURRENT" "$REVENUE_SHARE_NAME" "$REVENUE_MOUNT_PATH" <<'PY'
          import sys, yaml

          path, share, mount = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, encoding='utf-8') as handle:
              app = yaml.safe_load(handle)

          template = app['properties']['template']
          template['volumes'] = [
              {'name': 'revenue', 'storageType': 'AzureFile', 'storageName': share}
          ]
          for container in template['containers']:
              container['volumeMounts'] = [
                  {'volumeName': 'revenue', 'mountPath': mount}
              ]

          with open(path, 'w', encoding='utf-8') as handle:
              yaml.safe_dump(app, handle)
          PY
            retry az containerapp update \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --yaml "$CURRENT" --output none
          fi

          retry az containerapp ingress update \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --type external --target-port 8000 --transport http --allow-insecure false --output none

          CINEMA_FQDN=$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" --query properties.configuration.ingress.fqdn --output tsv)
          test -n "$CINEMA_FQDN"
          echo "CINEMA_URL=https://$CINEMA_FQDN" >> "$GITHUB_ENV"

      - name: Verify production Cinema to Z3 E2E and replay
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error --output /tmp/cinema-health.json --write-out '%{http_code}' "$CINEMA_URL/health" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.status == "ready" and .backend == "ready"' /tmp/cinema-health.json >/dev/null 2>&1; then
              SOLVE_CODE=$(curl --silent --show-error --output /tmp/cinema-proof-1.json --write-out '%{http_code}' \
                --request POST "$CINEMA_URL/solve" \
                --header "Authorization: Bearer $CINEMA_SECRET" \
                --header 'Content-Type: application/json' \
                --data @/tmp/payload.json || true)
              if [[ "$SOLVE_CODE" == "200" ]]; then
                break
              fi
            fi
            if [[ "$attempt" == "72" ]]; then
              echo 'Cinema production did not converge to the new authenticated revision' >&2
              cat /tmp/cinema-proof-1.json 2>/dev/null || true
              exit 1
            fi
            sleep 5
          done

          curl --fail-with-body --silent --show-error \
            --request POST "$CINEMA_URL/solve" \
            --header "Authorization: Bearer $CINEMA_SECRET" \
            --header 'Content-Type: application/json' \
            --data @/tmp/payload.json > /tmp/cinema-proof-2.json

          jq -e '.cinema_status == "VERIFIED" and .verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .z3_proof.witness == [1,0,0] and .z3_proof.energy_exact == "-4"' /tmp/cinema-proof-1.json >/dev/null

          DIRECT_HASH=$(jq -r .proof_hash /tmp/z3-proof-1.json)
          DIRECT_REQUEST=$(jq -r .request_hash /tmp/z3-proof-1.json)
          CINEMA_HASH_1=$(jq -r .proof_hash /tmp/cinema-proof-1.json)
          CINEMA_HASH_2=$(jq -r .proof_hash /tmp/cinema-proof-2.json)
          CINEMA_REQUEST_1=$(jq -r .request_hash /tmp/cinema-proof-1.json)
          CINEMA_REQUEST_2=$(jq -r .request_hash /tmp/cinema-proof-2.json)

          test "$CINEMA_HASH_1" = "$CINEMA_HASH_2"
          test "$CINEMA_REQUEST_1" = "$CINEMA_REQUEST_2"
          test "$CINEMA_HASH_1" = "$DIRECT_HASH"
          test "$CINEMA_REQUEST_1" = "$DIRECT_REQUEST"

      - name: Close the credential rotation window
        if: env.ROTATION_WINDOW_OPEN == '1'
        shell: bash
        run: |
          set -euo pipefail

          # The E2E above proved Cinema reaches Z3 on the new credential, so the
          # previous one is no longer needed. Revoking it here keeps the window
          # to the length of one deployment instead of leaving a second valid
          # credential live until the next deploy happens to overwrite it.
          retry() {
            local attempt=1
            while (( attempt <= 6 )); do
              if "$@"; then return 0; fi
              sleep $((attempt * 10))
              ((attempt++))
            done
            return 1
          }

          retry az containerapp update \
            --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
            --set-env-vars DSG_SOLVER_PREVIOUS_SECRET= \
            --output none

          retry az containerapp secret remove \
            --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
            --secret-names solver-previous-secret --output none

          # Revoking the credential creates a new revision, and the old one
          # keeps serving until the replacement passes its health probes. Wait
          # for that swap before reading /metrics: polling first reads the
          # revision that still holds the previous secret, so a rollout slower
          # than the poll budget fails a revocation that in fact succeeded.
          for attempt in $(seq 1 60); do
            REVISION_STATE=$(az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" --name "$Z3_APP" \
              --query "[?properties.active].properties.runningState | [0]" \
              --output tsv 2>/dev/null || true)
            [[ "$REVISION_STATE" == "Running" ]] && break
            if [[ "$attempt" == "60" ]]; then
              echo "Z3 revision carrying the revocation never became active (last state: ${REVISION_STATE:-unknown})" >&2
              exit 1
            fi
            sleep 5
          done

          # Prove the revoked credential is actually refused and the current one
          # still works, so a failed revocation cannot pass silently.
          for attempt in $(seq 1 60); do
            METRICS=$(curl --silent --show-error "$Z3_URL/metrics" || true)
            # Read the field itself. jq's `//` yields its right side when the
            # left is false as well as when it is absent, so
            # `.rotation_in_progress // empty` returns empty for exactly the
            # value this waits for: with it, the loop could never succeed.
            ROTATING=$(jq -r '
              if has("rotation_in_progress")
              then (.rotation_in_progress | tostring)
              else "absent" end' <<<"$METRICS" 2>/dev/null || echo unreadable)
            [[ "$ROTATING" == "false" ]] && break
            if [[ "$attempt" == "60" ]]; then
              case "$ROTATING" in
                absent)
                  echo 'Z3 /metrics does not report rotation_in_progress: the running image predates credential rotation support.' >&2 ;;
                true)
                  echo 'Rotation window did not close: the previous credential is still accepted.' >&2 ;;
                *)
                  echo 'Z3 /metrics could not be read.' >&2 ;;
              esac
              echo "$METRICS" >&2
              exit 1
            fi
            sleep 5
          done

          LIVE_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$Z3_URL/solve" \
            --header "Authorization: Bearer $Z3_SECRET" \
            --header 'Content-Type: application/json' \
            --data @/tmp/payload.json)
          test "$LIVE_CODE" = '200'

          echo 'Rotation window closed; only the current credential is accepted.'

      - name: Wait for Cinema app to be fully ready with enforcement configuration
        shell: bash
        run: |
          set -euo pipefail
          # After updating environment variables, wait for the app to fully restart
          # and the enforcement gate to be properly configured. Test the actual
          # enforcement gate behavior, not just the status endpoint. Also verify
          # that /billing/status is ready (it initializes the revenue ledger, which
          # may take time if mounted from Azure Files).
          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error --output /tmp/cinema-health-2.json --write-out '%{http_code}' "$CINEMA_URL/health" || true)
            if [[ "$CODE" == "200" ]]; then
              # Check that billing status endpoint is ready (initializes revenue ledger)
              STATUS_CODE=$(curl --silent --output /tmp/billing-status-check.json --write-out '%{http_code}' \
                "$CINEMA_URL/billing/status" || true)

              if [[ "$STATUS_CODE" != "200" ]]; then
                # Status endpoint not ready yet, continue waiting
                if [[ "$attempt" == "72" ]]; then
                  echo "Cinema billing status endpoint did not become responsive within 360 seconds" >&2
                  echo "Last status response code: $STATUS_CODE" >&2
                  cat /tmp/billing-status-check.json >&2 || true
                  exit 1
                fi
              else
                # Test the actual enforcement gate behavior with an unauthenticated request
                GATE_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
                  --request POST "$CINEMA_URL/verify/evaluate" \
                  --header 'Content-Type: application/json' \
                  --data @/tmp/marketplace-request.json || true)

                if [[ "$REVENUE_ENFORCE" == "1" ]]; then
                  # When enforcement is on, unauthenticated requests must return 401
                  if [[ "$GATE_CODE" == "401" ]]; then
                    echo "Cinema enforcement gate is active and working (returns 401 for unauthenticated requests)"
                    echo "Cinema billing status endpoint is ready and reporting correctly"
                    break
                  fi
                else
                  # When enforcement is off, unauthenticated requests should return 200
                  if [[ "$GATE_CODE" == "200" ]]; then
                    echo "Cinema enforcement is off and gate allows unauthenticated access (returns 200)"
                    echo "Cinema billing status endpoint is ready and reporting correctly"
                    break
                  fi
                fi
              fi
            fi
            if [[ "$attempt" == "72" && "$CODE" != "200" ]]; then
              echo "Cinema app health endpoint did not become responsive within 360 seconds" >&2
              echo "Last health response code: $CODE" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify marketplace adapters and Azure browser CORS
        shell: bash
        run: |
          set -euo pipefail
          AZURE_ORIGIN=$(jq -er '.product.public_landing | rtrimstr("/")' marketplace/launch-manifest.json)
          RENDER_ORIGIN='https://dsg-one-verified-execution.onrender.com'
          VERIFY_URL="$CINEMA_URL/verify/evaluate"

          for origin in "$AZURE_ORIGIN" "$RENDER_ORIGIN"; do
            CORS_CODE=$(curl --silent --show-error --output /dev/null --dump-header /tmp/cors-headers.txt --write-out '%{http_code}' \
              --request OPTIONS "$VERIFY_URL" \
              --header "Origin: $origin" \
              --header 'Access-Control-Request-Method: POST' \
              --header 'Access-Control-Request-Headers: content-type,x-dsg-api-key')
            test "$CORS_CODE" = '200'
            tr -d '\r' < /tmp/cors-headers.txt | grep -Fxi "access-control-allow-origin: $origin"
            # The landing page sends the key header on every evaluation once
            # enforcement is on. If the preflight does not permit it the browser
            # refuses the request before it is ever made, so assert it here
            # rather than discovering it from a blank panel in production.
            tr -d '\r' < /tmp/cors-headers.txt \
              | grep -i '^access-control-allow-headers:' | grep -qi 'x-dsg-api-key'
          done

          # Enforcement refuses an unauthenticated evaluation, so these checks
          # have to present a key the way a real caller does. Activation is the
          # self-serve route to one: it can only ever grant the free capped
          # plan, so this proves the visitor's path without granting billable
          # capacity. Without it, turning enforcement on would fail this step
          # after the deployment had already switched production to gated.
          curl --fail-with-body --silent --show-error \
            --request POST "$CINEMA_URL/billing/activate" \
            --header 'Content-Type: application/json' \
            --data "$(jq -n --arg id "production-deploy-$GITHUB_RUN_ID" \
              '{channel:"api",activation_id:$id,display_name:"production deployment check"}')" \
            > /tmp/activation.json
          E2E_API_KEY=$(jq -r '.api_key // empty' /tmp/activation.json)
          if [[ -z "$E2E_API_KEY" ]]; then
            echo 'Activation issued no API key; the deployment cannot verify an authenticated evaluation.' >&2
            jq -c '{decision, activated}' /tmp/activation.json >&2 || true
            exit 1
          fi
          echo "::add-mask::$E2E_API_KEY"

          : > /tmp/marketplace-e2e.jsonl
          for channel in github aws azure jetbrains openai_plugin api; do
            jq -n \
              --arg channel "$channel" \
              --arg execution_id "production-$channel-e2e" \
              --arg trace_id "production-$channel-trace" \
              '{channel:$channel,approved_plan_hash:("1"*64),proposed_action_hash:("2"*64),execution_id:$execution_id,trace_id:$trace_id,agent_identity:"github-actions-production-e2e",authorized:true,plan_aligned:true,constraints_pass:true,execution_succeeded:true,replay_match:true,evidence_complete:true,cost_microunits:0}' \
              > /tmp/marketplace-request.json

            curl --fail-with-body --silent --show-error \
              --request POST "$VERIFY_URL" \
              --header "Origin: $AZURE_ORIGIN" \
              --header "X-DSG-API-Key: $E2E_API_KEY" \
              --header 'Content-Type: application/json' \
              --data @/tmp/marketplace-request.json \
              > /tmp/marketplace-response.json

            jq -e --arg channel "$channel" '
              .channel == $channel and
              .decision == "ALLOW" and
              .verified == true and
              .verification == "VERIFIED_GLOBAL_OPTIMUM" and
              (.proof_hash | test("^[0-9a-f]{64}$")) and
              (.request_hash | test("^[0-9a-f]{64}$")) and
              (.context_hash | test("^[0-9a-f]{64}$"))
            ' /tmp/marketplace-response.json >/dev/null
            jq -c '{channel,decision,verified,verification,proof_hash}' /tmp/marketplace-response.json >> /tmp/marketplace-e2e.jsonl
          done

          jq -n '{stripe_account_id:"acct_production_e2e",object_type:"charge",object_id:"ch_production_e2e",amount_cents:5000,currency:"usd",stripe_status:"succeeded",risk_level:"low"}' > /tmp/stripe-low-request.json
          jq -n '{stripe_account_id:"acct_production_e2e",object_type:"payout",object_id:"po_production_e2e",amount_cents:6000000,currency:"thb",stripe_status:"pending",risk_level:"critical"}' > /tmp/stripe-critical-request.json

          curl --fail-with-body --silent --show-error --request POST "$CINEMA_URL/stripe/evaluate" --header "X-DSG-API-Key: $E2E_API_KEY" --header 'Content-Type: application/json' --data @/tmp/stripe-low-request.json > /tmp/stripe-low-response.json
          curl --fail-with-body --silent --show-error --request POST "$CINEMA_URL/stripe/evaluate" --header "X-DSG-API-Key: $E2E_API_KEY" --header 'Content-Type: application/json' --data @/tmp/stripe-critical-request.json > /tmp/stripe-critical-response.json
          jq -e '.decision == "ALLOW" and .verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .risk_score == 0' /tmp/stripe-low-response.json >/dev/null
          jq -e '.decision == "BLOCK" and .verified == true and .verification == "VERIFIED_GLOBAL_OPTIMUM" and .risk_score == 100' /tmp/stripe-critical-response.json >/dev/null
          jq -s '.' /tmp/marketplace-e2e.jsonl > /tmp/marketplace-e2e.json
          jq -n --slurpfile low /tmp/stripe-low-response.json --slurpfile critical /tmp/stripe-critical-response.json '{low:{decision:$low[0].decision,risk_score:$low[0].risk_score,verification:$low[0].verification},critical:{decision:$critical[0].decision,risk_score:$critical[0].risk_score,verification:$critical[0].verification}}' > /tmp/stripe-e2e.json

      - name: Verify the revenue system reports its state truthfully
        shell: bash
        run: |
          set -euo pipefail

          curl --fail-with-body --silent --show-error "$CINEMA_URL/billing/status" > /tmp/billing-status.json

          # The public status route must never leak credential material.
          if jq -e 'tostring | test("sk_live_|sk_test_|whsec_|dsg_(live|test)_")' /tmp/billing-status.json >/dev/null; then
            echo 'Public billing status exposed credential material' >&2
            exit 1
          fi

          # Checkout state must match whether Stripe is actually linked, and
          # enforcement must match what this deployment configured.
          jq -e --arg enforce "$REVENUE_ENFORCE" '
            .billing_version == "dsg-revenue-1.1.0" and
            .metering_enabled == true and
            .enforcement_requested == ($enforce == "1") and
            .metering_enforced == (($enforce == "1") and .enforcement_ready) and
            (.checkout_status == (if .stripe.charges_enabled then "LINKED" else "NOT_VERIFIED_NOT_LINKED" end)) and
            ([.catalog.plans[].plan] | sort == ["enterprise","free","metered","team"])
          ' /tmp/billing-status.json >/dev/null

          # A provisioned Stripe signing secret must actually have reached the
          # running app, and an absent one must leave webhooks refused rather
          # than half-configured. Note charges_enabled/webhooks_enabled remain
          # false until live Stripe verification passes: possessing a secret is
          # never treated as proof that charging works.
          WEBHOOK_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/billing/webhook/stripe" \
            --header 'Content-Type: application/json' --data '{"type":"invoice.paid"}')
          if [[ "$STRIPE_WEBHOOK_SECRET_PROVISIONED" == "true" ]]; then
            # The signing secret reached the app: the route rejects on the
            # signature now, not on absence.
            test "$WEBHOOK_CODE" = '400'
          else
            # No signing secret: unsigned webhooks are refused, never trusted.
            test "$WEBHOOK_CODE" = '503'
          fi

          # Readiness is the stricter claim. A signing secret without a catalog
          # to apply the event against is not a working webhook, and the app
          # says so; assert against that rather than against the secret.
          jq -e --arg ready "$STRIPE_WEBHOOK_CONFIGURED" \
            '.stripe.webhooks_configured == ($ready == "true")' \
            /tmp/billing-status.json >/dev/null
          jq -e --arg source "$STRIPE_SOURCE" '.stripe.configured == ($source != "none")' \
            /tmp/billing-status.json >/dev/null

          # Holding a key is not the same as having something to charge for.
          # The catalog scope the app reports must match the ids this
          # deployment passed, or checkout readiness is being claimed on
          # credentials alone.
          jq -e --arg scoped "$STRIPE_CATALOG_SCOPED" \
            '.stripe.catalog_scope_configured == ($scoped == "true")' \
            /tmp/billing-status.json >/dev/null
          echo "Stripe credential source verified as: $STRIPE_SOURCE (catalog scoped: $STRIPE_CATALOG_SCOPED)"

          # Enforcement readiness must reflect the storage this deployment
          # actually arranged, not an attestation someone set by hand.
          if [[ "${REVENUE_STORAGE_READY:-0}" == "1" && "$REVENUE_ENFORCE" == "1" ]]; then
            jq -e '.enforcement_ready == true' /tmp/billing-status.json >/dev/null
          else
            jq -e '.enforcement_ready == false or .metering_enforced == false' /tmp/billing-status.json >/dev/null
          fi

          # Everything above reads what the app reports about itself. Enforcement
          # is a claim about what the gate actually refuses, so test the refusal:
          # an unauthenticated evaluation must be denied when enforcement is on
          # and served when it is off. Without this the deployment could report
          # enforcement live while still answering every anonymous caller.
          ANON_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/verify/evaluate" \
            --header 'Content-Type: application/json' \
            --data @/tmp/marketplace-request.json)
          if [[ "$REVENUE_ENFORCE" == "1" ]]; then
            # An absent key resolves to UNKNOWN_KEY, which the engine maps to 401.
            if [[ "$ANON_CODE" != "401" ]]; then
              echo "Enforcement is on but an unauthenticated evaluation answered $ANON_CODE, not 401." >&2
              exit 1
            fi
            echo 'Enforcement verified: an unauthenticated evaluation is refused.'
          else
            if [[ "$ANON_CODE" != "200" ]]; then
              echo "Enforcement is off but an unauthenticated evaluation answered $ANON_CODE, not 200." >&2
              exit 1
            fi
            echo 'Free public path verified: an unauthenticated evaluation is still served.'
          fi

          # The ledger must live on the mounted share, not the container
          # filesystem, or it is lost on the next restart.
          if [[ "${REVENUE_STORAGE_READY:-0}" == "1" && "$REVENUE_ADMIN_CONFIGURED" == "true" ]]; then
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $REVENUE_ADMIN_SECRET" \
              "$CINEMA_URL/billing/ledger/verify" > /tmp/ledger-before.json
            jq -e '.verified == true' /tmp/ledger-before.json >/dev/null

            CURRENT_REVISION=$(az containerapp revision list \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --query "[?properties.active].name | [0]" --output tsv)
            az containerapp revision restart \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --revision "$CURRENT_REVISION" --output none

            for attempt in $(seq 1 60); do
              if curl --silent --fail --show-error \
                --header "Authorization: Bearer $REVENUE_ADMIN_SECRET" \
                "$CINEMA_URL/billing/ledger/verify" > /tmp/ledger-after.json 2>/dev/null; then
                break
              fi
              [[ "$attempt" == "60" ]] && { echo 'Cinema did not return after restart' >&2; exit 1; }
              sleep 5
            done

            # A ledger on ephemeral storage comes back empty with a genesis head.
            BEFORE_HEAD=$(jq -r '.head_hash' /tmp/ledger-before.json)
            AFTER_HEAD=$(jq -r '.head_hash' /tmp/ledger-after.json)
            test "$BEFORE_HEAD" = "$AFTER_HEAD"
            jq -e '.verified == true' /tmp/ledger-after.json >/dev/null
            echo "Ledger survived a restart with head $AFTER_HEAD"
          fi

          # Admin billing routes must reject an unauthenticated caller.
          REPORT_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' "$CINEMA_URL/billing/report")
          if [[ "$REVENUE_ADMIN_CONFIGURED" == "true" ]]; then
            test "$REPORT_CODE" = '401'
          else
            test "$REPORT_CODE" = '503'
          fi
          USAGE_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' "$CINEMA_URL/billing/usage")
          test "$USAGE_CODE" = '401'

          # A bad API key must be rejected rather than served for free.
          KEY_CODE=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/verify/evaluate" \
            --header 'Content-Type: application/json' \
            --header "X-DSG-API-Key: dsg_live_00000000000000000000000000000000_$(printf '0%.0s' $(seq 1 48))" \
            --data @/tmp/marketplace-request.json)
          test "$KEY_CODE" = '401'

          # A configured stable admin credential must work. Missing
          # configuration remains explicitly unavailable in the evidence.
          if [[ "$REVENUE_ADMIN_CONFIGURED" == "true" ]]; then
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer $REVENUE_ADMIN_SECRET" \
              "$CINEMA_URL/billing/ledger/verify" > /tmp/billing-ledger.json
            jq -e '.verified == true' /tmp/billing-ledger.json >/dev/null
          else
            jq -n '{verified:false,entries:0,head_hash:null,availability:"UNAVAILABLE_ADMIN_SECRET"}' > /tmp/billing-ledger.json
          fi

          jq -n --argjson admin_routes_authenticated "$REVENUE_ADMIN_CONFIGURED" \
            --slurpfile status /tmp/billing-status.json \
            --slurpfile ledger /tmp/billing-ledger.json \
            '{checkout_status:$status[0].checkout_status,metering_enforced:$status[0].metering_enforced,enforcement_ready:$status[0].enforcement_ready,charges_enabled:$status[0].stripe.charges_enabled,ledger_verified:$ledger[0].verified,ledger_entries:$ledger[0].entries,admin_routes_authenticated:$admin_routes_authenticated,invalid_api_key_rejected:true}' \
            > /tmp/revenue-e2e.json
          cat /tmp/revenue-e2e.json

      - name: Write non-secret production evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg z3_url "$Z3_URL" \
            --arg cinema_url "$CINEMA_URL" \
            --arg z3_image "$Z3_IMAGE_REF" \
            --arg cinema_image "$CINEMA_IMAGE_REF" \
            --slurpfile direct /tmp/z3-proof-1.json \
            --slurpfile cinema /tmp/cinema-proof-1.json \
            --slurpfile marketplace /tmp/marketplace-e2e.json \
            --slurpfile stripe /tmp/stripe-e2e.json \
            --slurpfile revenue /tmp/revenue-e2e.json \
            '{commit:$commit,environment:"production",transport:"https",z3_url:$z3_url,cinema_url:$cinema_url,z3_image:$z3_image,cinema_image:$cinema_image,direct_verification:$direct[0].verification,cinema_status:$cinema[0].cinema_status,verification:$cinema[0].verification,witness:$cinema[0].z3_proof.witness,energy_exact:$cinema[0].z3_proof.energy_exact,proof_hash:$cinema[0].proof_hash,request_hash:$cinema[0].request_hash,replay_match:true,direct_proof_match:true,azure_browser_cors:true,render_browser_cors:true,marketplace_adapters:$marketplace[0],stripe_adapter:$stripe[0],revenue_system:$revenue[0]}' \
            > production_evidence.json
          cat production_evidence.json

      - name: Upload production evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinema-production-evidence-${{ github.sha }}
          path: production_evidence.json
          retention-days: 30
