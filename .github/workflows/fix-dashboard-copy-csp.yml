name: Apply CSP-safe Dashboard Copy Fix

on:
  push:
    branches: [dsg/fix-dashboard-copy-csp]
    paths:
      - '.github/workflows/fix-dashboard-copy-csp.yml'

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dsg/fix-dashboard-copy-csp
          fetch-depth: 0
      - name: Move copy logic into external dashboard.js
        shell: python
        run: |
          from pathlib import Path

          index_path = Path('web/customer-dashboard/index.html')
          js_path = Path('web/customer-dashboard/dashboard.js')
          test_path = Path('tests/test_dashboard_mcp_copy.py')

          html = index_path.read_text(encoding='utf-8')
          old_inline = '''<script>\n(() => {\n  function endpointUrl() { return location.origin + '/mcp'; }\n  function selectEndpoint(input) { input.focus(); input.select(); try { input.setSelectionRange(0, input.value.length); } catch (_) {} }\n  function remoteMessage(text, error = false) {\n    const message = document.getElementById('remoteMessage'); if (!message) return;\n    message.textContent = text; message.className = error ? 'status error' : 'status';\n  }\n  async function copyText(input, value, success) {\n    input.value = value; let copied = false;\n    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') { try { await navigator.clipboard.writeText(value); copied = true; } catch (_) {} }\n    if (!copied) { selectEndpoint(input); try { copied = document.execCommand('copy'); } catch (_) { copied = false; } }\n    remoteMessage(copied ? success : 'Copy was blocked. The value is selected — long-press it and tap Copy.', !copied);\n  }\n  document.addEventListener('DOMContentLoaded', () => {\n    const endpoint = document.getElementById('mcpEndpoint');\n    if (endpoint) { endpoint.value = endpointUrl(); endpoint.addEventListener('click', () => selectEndpoint(endpoint)); }\n    const copyEndpoint = document.getElementById('copyMcpEndpoint');\n    if (copyEndpoint) copyEndpoint.addEventListener('click', () => copyText(endpoint, endpointUrl(), 'MCP endpoint copied.'));\n    const copyPair = document.getElementById('copyPairingToken');\n    if (copyPair) copyPair.addEventListener('click', () => {\n      const input = document.getElementById('pairingToken'); if (input && input.value) copyText(input, input.value, 'Short-lived pairing token copied.');\n    });\n  });\n})();\n</script>\n'''
          if html.count(old_inline) != 1:
              raise SystemExit(f'expected one inline copy block, found {html.count(old_inline)}')
          html = html.replace(old_inline, '')
          index_path.write_text(html, encoding='utf-8')

          js = js_path.read_text(encoding='utf-8')
          marker = 'const PAIR_EXPIRY_SLOT = "dsg-one-agent-pairing-expiry";\n'
          helpers = '''\nfunction endpointUrl() { return location.origin + "/mcp"; }\n\nfunction selectCopyInput(input) {\n  if (!input) return;\n  input.focus();\n  input.select();\n  try { input.setSelectionRange(0, input.value.length); } catch (_) {}\n}\n\nasync function copyDashboardValue(input, value, successMessage) {\n  if (!input) return;\n  input.value = value;\n  let copied = false;\n  if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {\n    try { await navigator.clipboard.writeText(value); copied = true; } catch (_) {}\n  }\n  if (!copied) {\n    selectCopyInput(input);\n    try { copied = document.execCommand("copy"); } catch (_) { copied = false; }\n  }\n  remoteMessage(\n    copied ? successMessage : "Copy was blocked. The value is selected — long-press it and tap Copy.",\n    !copied\n  );\n}\n\nfunction wireAdvancedConnectionCopy() {\n  const endpoint = $("mcpEndpoint");\n  if (endpoint) {\n    endpoint.value = endpointUrl();\n    endpoint.addEventListener("click", () => selectCopyInput(endpoint));\n  }\n  const copyEndpoint = $("copyMcpEndpoint");\n  if (copyEndpoint) {\n    copyEndpoint.addEventListener("click", () => copyDashboardValue(endpoint, endpointUrl(), "MCP endpoint copied."));\n  }\n  const copyPair = $("copyPairingToken");\n  if (copyPair) {\n    copyPair.addEventListener("click", () => {\n      const input = $("pairingToken");\n      if (input && input.value) copyDashboardValue(input, input.value, "Short-lived pairing token copied.");\n    });\n  }\n}\n'''
          if helpers.strip() in js:
              raise SystemExit('copy helpers already present')
          if marker not in js:
              raise SystemExit('dashboard.js insertion marker missing')
          js = js.replace(marker, marker + helpers, 1)
          tail = '\nresumeSession();\n'
          if tail not in js:
              raise SystemExit('resumeSession tail missing')
          js = js.replace(tail, '\nwireAdvancedConnectionCopy();\nresumeSession();\n', 1)
          js_path.write_text(js, encoding='utf-8')

          test_path.write_text('''from __future__ import annotations\n\nfrom fastapi.testclient import TestClient\n\nimport cinema_main\n\n\nclient = TestClient(cinema_main.app)\n\n\ndef test_mcp_endpoint_is_full_selectable_and_copy_logic_is_csp_safe():\n    response = client.get("/dashboard")\n    assert response.status_code == 200\n    page = response.text\n\n    assert 'id="mcpEndpoint"' in page\n    assert 'readonly' in page\n    assert 'inputmode="url"' in page\n    assert 'id="copyMcpEndpoint"' in page\n    assert '<script src="/dashboard-assets/dashboard.js"></script>' in page\n    assert "navigator.clipboard.writeText" not in page\n    assert "document.execCommand" not in page\n\n    script = client.get("/dashboard-assets/dashboard.js")\n    assert script.status_code == 200\n    body = script.text\n    assert 'location.origin + "/mcp"' in body\n    assert 'navigator.clipboard.writeText' in body\n    assert 'document.execCommand("copy")' in body\n    assert 'setSelectionRange(0, input.value.length)' in body\n    assert 'wireAdvancedConnectionCopy();' in body\n\n\ndef test_mcp_copy_failure_keeps_the_real_url_visible_and_selected():\n    script = client.get("/dashboard-assets/dashboard.js")\n    body = script.text\n\n    assert 'endpoint.value = endpointUrl();' in body\n    assert 'selectCopyInput(input);' in body\n    assert 'Copy was blocked. The value is selected' in body\n    assert 'MCP endpoint copied.' in body\n    assert 'Short-lived pairing token copied.' in body\n\n\ndef test_dashboard_csp_allows_external_script_but_not_inline_script():\n    response = client.get("/dashboard")\n    csp = response.headers.get("content-security-policy", "")\n    assert "script-src 'self'" in csp\n    assert "'unsafe-inline'" not in csp\n    assert '<script>' not in response.text\n''', encoding='utf-8')

      - name: Validate focused regression tests and commit
        shell: bash
        run: |
          set -euo pipefail
          python -m pytest tests/test_dashboard_mcp_copy.py -q
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/customer-dashboard/index.html web/customer-dashboard/dashboard.js tests/test_dashboard_mcp_copy.py
          git commit -m 'fix(dashboard): make MCP copy work under CSP'
          git push origin HEAD:dsg/fix-dashboard-copy-csp
