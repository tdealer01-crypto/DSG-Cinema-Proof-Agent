name: Verify Production Pairing Restart

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-pairing-restart-proof.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-pairing-restart-proof
  cancel-in-progress: false

jobs:
  prove-production-pairing:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      REVENUE_STORAGE_ACCOUNT: ${{ vars.DSG_REVENUE_STORAGE_ACCOUNT || 'dsgrevenuestore' }}
      REVENUE_SHARE_NAME: revenue

    steps:
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve live production revision and replica baseline
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          CINEMA_FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --query properties.configuration.ingress.fqdn --output tsv)
          REVISION=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --query properties.latestReadyRevisionName --output tsv)
          test -n "$CINEMA_FQDN"
          test -n "$REVISION"

          CINEMA_URL="https://$CINEMA_FQDN"
          az containerapp replica list \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --revision "$REVISION" --output json > /tmp/replicas-before.json
          jq -e 'length > 0' /tmp/replicas-before.json >/dev/null
          jq -e 'all(.[]; .properties.containers[0].ready == true)' /tmp/replicas-before.json >/dev/null
          OLD_CREATED_MAX=$(jq -r '[.[].properties.createdTime] | max' /tmp/replicas-before.json)
          test -n "$OLD_CREATED_MAX"

          echo "CINEMA_URL=$CINEMA_URL" >> "$GITHUB_ENV"
          echo "REVISION=$REVISION" >> "$GITHUB_ENV"
          echo "OLD_CREATED_MAX=$OLD_CREATED_MAX" >> "$GITHUB_ENV"
          jq -r '.[].name' /tmp/replicas-before.json | sed 's/^/before replica: /'

      - name: Issue a real short-lived pairing token in production
        shell: bash
        run: |
          set -euo pipefail
          ACTIVATION_ID="pairing-restart-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          ACTIVATE_CODE=$(curl --silent --show-error \
            --output /tmp/activate.json --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/billing/activate" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --data "{\"channel\":\"remote_browser\",\"activation_id\":\"$ACTIVATION_ID\",\"display_name\":\"Production Pairing Restart Proof\"}")
          test "$ACTIVATE_CODE" = "200"
          API_KEY=$(jq -r '.api_key // empty' /tmp/activate.json)
          test -n "$API_KEY"
          echo "::add-mask::$API_KEY"

          PAIR_CODE=$(curl --silent --show-error \
            --output /tmp/pair.json --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/remote-browser/agent-pair" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "X-DSG-API-Key: $API_KEY" \
            --data '{"agent_name":"production-restart-proof","ttl_seconds":900}')
          test "$PAIR_CODE" = "201"
          TOKEN=$(jq -r '.pairing_token // empty' /tmp/pair.json)
          test -n "$TOKEN"
          echo "::add-mask::$TOKEN"
          TOKEN_HASH=$(printf '%s' "$TOKEN" | sha256sum | awk '{print $1}')

          jq -e '
            .paired == true and
            .durable_pairing_store == true and
            .pairing_token_persisted == false and
            .api_key_persisted_plaintext == false and
            .master_key_exposed_to_agent == false
          ' /tmp/pair.json >/dev/null

          printf '%s' "$API_KEY" > /tmp/proof-api-key
          printf '%s' "$TOKEN" > /tmp/proof-pair-token
          echo "TOKEN_HASH=$TOKEN_HASH" >> "$GITHUB_ENV"
          echo "pairing record digest: $TOKEN_HASH"

      - name: Prove durable record contains hash and ciphertext only
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=$(cat /tmp/proof-api-key)
          TOKEN=$(cat /tmp/proof-pair-token)
          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" --account-name "$REVENUE_STORAGE_ACCOUNT" \
            --query '[0].value' --output tsv)
          test -n "$STORAGE_KEY"
          echo "::add-mask::$STORAGE_KEY"

          PAIR_PATH="remote-action/agent-pairings/${TOKEN_HASH}.json"
          az storage file download \
            --account-name "$REVENUE_STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" \
            --share-name "$REVENUE_SHARE_NAME" --path "$PAIR_PATH" \
            --dest /tmp/pair-record-before.json --output none

          jq -e --arg digest "$TOKEN_HASH" '
            .version == 1 and
            .token_hash == $digest and
            (.api_key_ciphertext | type == "string" and length > 20) and
            .claimed_at == null and
            .status == "ACTIVE"
          ' /tmp/pair-record-before.json >/dev/null
          ! grep -F -- "$TOKEN" /tmp/pair-record-before.json
          ! grep -F -- "$API_KEY" /tmp/pair-record-before.json

      - name: Restart the live production revision
        shell: bash
        run: |
          set -euo pipefail
          az containerapp revision restart \
            --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
            --revision "$REVISION" --output none

      - name: Wait for a genuinely new ready replica
        shell: bash
        run: |
          set -euo pipefail
          FOUND=0
          for attempt in $(seq 1 60); do
            az containerapp replica list \
              --resource-group "$RESOURCE_GROUP" --name "$CINEMA_APP" \
              --revision "$REVISION" --output json > /tmp/replicas-after.json
            if jq -e --arg cutoff "$OLD_CREATED_MAX" '
              any(.[];
                .properties.createdTime > $cutoff and
                .properties.runningState == "Running" and
                .properties.containers[0].ready == true and
                .properties.containers[0].started == true
              )
            ' /tmp/replicas-after.json >/dev/null 2>&1; then
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" = "1"

          NEW_REPLICA=$(jq -r --arg cutoff "$OLD_CREATED_MAX" '
            [.[] | select(.properties.createdTime > $cutoff and .properties.containers[0].ready == true)]
            | sort_by(.properties.createdTime) | last | .name
          ' /tmp/replicas-after.json)
          NEW_CREATED=$(jq -r --arg name "$NEW_REPLICA" '.[] | select(.name == $name) | .properties.createdTime' /tmp/replicas-after.json)
          test -n "$NEW_REPLICA"
          test -n "$NEW_CREATED"
          echo "NEW_REPLICA=$NEW_REPLICA" >> "$GITHUB_ENV"
          echo "NEW_CREATED=$NEW_CREATED" >> "$GITHUB_ENV"
          echo "after replica: $NEW_REPLICA created $NEW_CREATED"

          for attempt in $(seq 1 36); do
            CODE=$(curl --silent --show-error --output /tmp/health.json --write-out '%{http_code}' "$CINEMA_URL/health" || true)
            if [[ "$CODE" == "200" ]]; then
              break
            fi
            [[ "$attempt" == "36" ]] && exit 1
            sleep 5
          done

      - name: Claim the pre-restart token through the real production MCP
        shell: bash
        run: |
          set -euo pipefail
          TOKEN=$(cat /tmp/proof-pair-token)
          RPC='{"jsonrpc":"2.0","id":1,"method":"tools/call","params":{"name":"remote_status","arguments":{}}}'
          MCP_CODE=$(curl --silent --show-error \
            --output /tmp/mcp-after-restart.json --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/mcp" \
            --header 'Accept: application/json' \
            --header 'Content-Type: application/json' \
            --header "Authorization: Bearer $TOKEN" \
            --data "$RPC")
          test "$MCP_CODE" = "200"
          jq -e '.result != null and (.result.isError // false) == false' /tmp/mcp-after-restart.json >/dev/null

          STORAGE_KEY=$(az storage account keys list \
            --resource-group "$RESOURCE_GROUP" --account-name "$REVENUE_STORAGE_ACCOUNT" \
            --query '[0].value' --output tsv)
          echo "::add-mask::$STORAGE_KEY"
          PAIR_PATH="remote-action/agent-pairings/${TOKEN_HASH}.json"
          az storage file download \
            --account-name "$REVENUE_STORAGE_ACCOUNT" --account-key "$STORAGE_KEY" \
            --share-name "$REVENUE_SHARE_NAME" --path "$PAIR_PATH" \
            --dest /tmp/pair-record-after.json --output none
          jq -e '.claimed_at != null and (.claimed_at | type) == "number"' /tmp/pair-record-after.json >/dev/null

      - name: Revoke proof token and write non-secret evidence
        shell: bash
        run: |
          set -euo pipefail
          API_KEY=$(cat /tmp/proof-api-key)
          TOKEN=$(cat /tmp/proof-pair-token)
          REVOKE_CODE=$(curl --silent --show-error \
            --output /tmp/revoke.json --write-out '%{http_code}' \
            --request POST "$CINEMA_URL/remote-browser/agent-pair/revoke" \
            --header 'Content-Type: application/json' \
            --header "X-DSG-API-Key: $API_KEY" \
            --data "{\"pairing_token\":\"$TOKEN\"}")
          test "$REVOKE_CODE" = "200"
          jq -e '.revoked == true' /tmp/revoke.json >/dev/null

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg cinema_url "$CINEMA_URL" \
            --arg revision "$REVISION" \
            --arg token_hash "$TOKEN_HASH" \
            --arg old_created_max "$OLD_CREATED_MAX" \
            --arg new_replica "$NEW_REPLICA" \
            --arg new_created "$NEW_CREATED" \
            '{
              commit: $commit,
              environment: "production",
              cinema_url: $cinema_url,
              revision: $revision,
              token_hash: $token_hash,
              pairing_token_persisted: false,
              api_key_persisted_plaintext: false,
              durable_record_pre_restart: true,
              revision_restart_invoked: true,
              old_replica_created_at_max: $old_created_max,
              post_restart_replica: $new_replica,
              post_restart_replica_created_at: $new_created,
              post_restart_mcp_claim: true,
              claimed_at_persisted: true,
              proof_token_revoked: true,
              verdict: "PAIRING_SURVIVED_REAL_PRODUCTION_REPLICA_RESTART"
            }' > production-pairing-restart-evidence.json

          rm -f /tmp/proof-api-key /tmp/proof-pair-token /tmp/activate.json /tmp/pair.json

      - name: Upload production pairing restart evidence
        uses: actions/upload-artifact@v4
        with:
          name: production-pairing-restart-evidence-${{ github.sha }}
          path: production-pairing-restart-evidence.json
          if-no-files-found: error
          retention-days: 30
