name: Verify Multi-Marketplace Launch Pack

on:
  pull_request:
    branches: [main]
    paths:
      - 'cinema_main.py'
      - 'marketplace_verification.py'
      - 'requirements-cinema.txt'
      - 'tests/test_cinema_main.py'
      - 'marketplace/**'
      - 'stripe-app/**'
      - 'landing/**'
      - 'azure-landing/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/test_marketplace_surfaces.py'
      - '.github/workflows/marketplace-launch-verify.yml'
  push:
    branches: [main]
    paths:
      - 'cinema_main.py'
      - 'marketplace_verification.py'
      - 'requirements-cinema.txt'
      - 'tests/test_cinema_main.py'
      - 'marketplace/**'
      - 'stripe-app/**'
      - 'landing/**'
      - 'azure-landing/**'
      - '.github/ISSUE_TEMPLATE/**'
      - 'tests/test_marketplace_surfaces.py'
      - '.github/workflows/marketplace-launch-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cinema.txt pytest pyyaml

      - name: Compile marketplace backend
        run: python -m py_compile cinema_main.py marketplace_verification.py

      - name: Run Cinema verification tests
        run: python -m pytest -q tests/test_cinema_main.py tests/test_marketplace_surfaces.py

      - name: Validate launch manifest
        run: |
          jq -e '.product.receipt_version == "dsg-proof-receipt-1.0.0"' marketplace/launch-manifest.json >/dev/null
          jq -e '.product.policy_version == "dsg-verified-execution-1.0.0"' marketplace/launch-manifest.json >/dev/null
          jq -e '.product.checkout_status == "NOT_VERIFIED_NOT_LINKED"' marketplace/launch-manifest.json >/dev/null
          jq -e '[.channels[].channel] | length == 7' marketplace/launch-manifest.json >/dev/null

      - name: Validate the revenue automation claims
        run: |
          jq -e '.revenue_automation.system == "dsg-revenue-1.1.0"' marketplace/launch-manifest.json >/dev/null
          jq -e '.revenue_automation.billable_unit | test("VERIFIED_GLOBAL_OPTIMUM")' marketplace/launch-manifest.json >/dev/null
          # The manifest must not claim a payment link the product does not have.
          jq -e '.revenue_automation.not_claimed | index("an active Stripe checkout link")' marketplace/launch-manifest.json >/dev/null
          jq -e '(.revenue_automation.supported // []) | length > 0' marketplace/launch-manifest.json >/dev/null
          # Each declared endpoint must exist in the Cinema backend.
          python - <<'PY'
          import json

          with open('marketplace/launch-manifest.json', encoding='utf-8') as handle:
              revenue = json.load(handle)['revenue_automation']

          source = open('cinema_main.py', encoding='utf-8').read()
          source += open('revenue/api.py', encoding='utf-8').read()

          for key in ('status_endpoint', 'usage_endpoint', 'webhook_endpoint'):
              path = revenue[key].removeprefix('/billing')
              assert f'"{path}"' in source, f'{revenue[key]} is declared but not routed'
          print('revenue endpoints verified against the backend')
          PY

      - name: Validate GitHub Action v2 package
        run: |
          test -f marketplace/github-action-v2/action.yml
          bash -n marketplace/github-action-v2/scripts/verified-execution.sh
          grep -q '/verify/evaluate' marketplace/github-action-v2/action.yml || {
            echo 'Verified Execution endpoint is not documented in GitHub Action package' >&2
            exit 1
          }
          python - <<'PY'
          import yaml
          with open('marketplace/github-action-v2/action.yml', encoding='utf-8') as f:
              action = yaml.safe_load(f)
          safety = ['authorized','plan_aligned','constraints_pass','execution_succeeded','replay_match','evidence_complete']
          for key in safety:
              spec = action['inputs'][key]
              assert spec.get('required') is True, f'{key} must be required'
              assert 'default' not in spec, f'{key} must not have a permissive default'
          PY

      - name: Validate OpenAI Skills package
        run: bash marketplace/openai-plugin/scripts/validate.sh

      - name: Type-check Stripe App package
        working-directory: stripe-app
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run typecheck

      - name: Validate Pydantic runtime contract
        run: |
          grep -Eq '^pydantic==2\.' requirements-cinema.txt || {
            echo 'Cinema requires an explicit Pydantic 2 pin for field_validator' >&2
            exit 1
          }

      - name: Validate DSG ONE landing page
        run: bash landing/validate.sh

      - name: Reject retired Control Plane runtime references
        run: |
          if grep -R -n -E 'tdealer01-crypto-dsg-control-plane|dsg-stripe-app\.vercel\.app' \
            marketplace marketplace_verification.py landing/index.html; then
            echo 'Retired Control Plane runtime reference found in launch package' >&2
            exit 1
          fi
