name: Deploy AIMO Simulation Authority Fix

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/deploy-aimo-simulation-authority-fix.yml'

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Verify then deploy exact simulation master
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      SIMULATION_APP: dsg-agi-simulation
      SIMULATION_URL: https://dsg-agi-simulation.azurewebsites.net
      EXPECTED_SIMULATION_SHA: 8a1a603a31aa65780b6e57762589ab19a0e76b68

    steps:
      - name: Checkout operator workflow
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Azure login with Cinema production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Checkout exact simulation source
        shell: bash
        run: |
          set -euo pipefail
          git clone --no-checkout https://github.com/tdealer01-crypto/dsg-agi-simulation.git "$RUNNER_TEMP/simulation"
          cd "$RUNNER_TEMP/simulation"
          git checkout --detach "$EXPECTED_SIMULATION_SHA"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SIMULATION_SHA" || { echo 'BLOCK: simulation SHA mismatch'; exit 1; }
          echo "SIMULATION_SOURCE_SHA=$actual"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ runner.temp }}/simulation/package-lock.json

      - name: Verify exact source before production mutation
        shell: bash
        working-directory: ${{ runner.temp }}/simulation
        run: |
          set -euo pipefail
          npm ci
          npm run build
          npm test
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const source = fs.readFileSync('src/http-server.ts', 'utf8');
          if (!source.includes('encodingProofAuthorityConfigured')) {
            throw new Error('BLOCK: exact source lacks authority health field');
          }
          if (!source.includes('solveGovernedAimoShard')) {
            throw new Error('BLOCK: public HTTP boundary is not governed');
          }
          NODE
          echo 'SIMULATION_PREDEPLOY_VERIFICATION=PASS'

      - name: Capture current Azure runtime metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simulation-evidence"
          az webapp show --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" \
            --query '{name:name,state:state,host:defaultHostName,kind:kind,enabled:enabled,reserved:reserved}' \
            --output json > "$RUNNER_TEMP/simulation-evidence/before.json"
          az webapp config show --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" \
            --query '{linuxFxVersion:linuxFxVersion,appCommandLine:appCommandLine,alwaysOn:alwaysOn}' \
            --output json > "$RUNNER_TEMP/simulation-evidence/config-before.json"
          cat "$RUNNER_TEMP/simulation-evidence/before.json"
          cat "$RUNNER_TEMP/simulation-evidence/config-before.json"

      - name: Build deterministic deployment package
        shell: bash
        working-directory: ${{ runner.temp }}/simulation
        run: |
          set -euo pipefail
          rm -rf node_modules
          zip -qr "$RUNNER_TEMP/simulation-authority-fix.zip" . \
            -x '.git/*' '*.log' 'coverage/*'
          sha256sum "$RUNNER_TEMP/simulation-authority-fix.zip" | tee "$RUNNER_TEMP/simulation-evidence/package.sha256"

      - name: Deploy exact verified source to Azure App Service
        shell: bash
        run: |
          set -euo pipefail
          # Oryx must restore runtime dependencies from package-lock.json.
          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" \
            --settings SCM_DO_BUILD_DURING_DEPLOYMENT=true \
            --only-show-errors --output none
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" \
            --startup-file 'npm run serve' \
            --only-show-errors --output none
          az webapp deploy \
            --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" \
            --src-path "$RUNNER_TEMP/simulation-authority-fix.zip" \
            --type zip --clean true --restart true \
            --track-status true \
            --only-show-errors --output json \
            > "$RUNNER_TEMP/simulation-evidence/deploy.json"
          echo 'SIMULATION_AZURE_DEPLOY=COMPLETE'

      - name: Prove deployed authority boundary
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/simulation-evidence/health.json"
          ok=false
          for attempt in $(seq 1 36); do
            code=$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' "$SIMULATION_URL/health" || true)
            if [[ "$code" == '200' ]] && jq -e '
              .ok == true and
              .service == "dsg-agi-simulation" and
              .authConfigured == true and
              .encodingProofAuthorityConfigured == true and
              .productionAuthFailClosed == true
            ' "$body" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 5
          done
          jq '{ok,service,aimoShardEndpoint,authConfigured,encodingProofAuthorityConfigured,authMode,productionAuthFailClosed,truthBoundary}' "$body" || cat "$body"
          if [[ "$ok" != 'true' ]]; then
            echo 'SIMULATION_DEPLOYMENT_PROOF=BLOCK'
            exit 1
          fi
          echo "EXPECTED_SOURCE_SHA=$EXPECTED_SIMULATION_SHA" > "$RUNNER_TEMP/simulation-evidence/source.txt"
          echo 'SIMULATION_DEPLOYMENT_PROOF=PASS'

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-authority-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/simulation-evidence
          if-no-files-found: warn
          retention-days: 30
