name: Diagnose Stripe Webhooks

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-stripe-webhooks.yml'
      - '.github/workflows/configure-stripe-production.yml'

permissions:
  contents: read
  id-token: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839

    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: List safe live webhook metadata for the Azure target
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          SECRET_META=$(az containerapp secret show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --secret-name stripe-secret-key \
            --output json)
          STRIPE_KEY=$(jq -r '.value // empty' <<<"$SECRET_META")
          if [[ -z "$STRIPE_KEY" ]]; then
            KEY_VAULT_URL=$(jq -r '.keyVaultUrl // empty' <<<"$SECRET_META")
            [[ -n "$KEY_VAULT_URL" ]] || { echo 'Stripe key source unavailable' >&2; exit 1; }
            STRIPE_KEY=$(az keyvault secret show --id "$KEY_VAULT_URL" --query value --output tsv)
          fi
          echo "::add-mask::$STRIPE_KEY"
          [[ "$STRIPE_KEY" == sk_live_* ]] || { echo 'Stripe key is not live' >&2; exit 1; }

          HOST=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          TARGET_URL="https://$HOST/billing/webhook/stripe"

          curl --fail-with-body --silent --show-error \
            --get 'https://api.stripe.com/v1/webhook_endpoints' \
            --header "Authorization: Bearer $STRIPE_KEY" \
            --data-urlencode 'limit=100' > /tmp/webhooks.json

          jq -n \
            --arg target_url "$TARGET_URL" \
            --argjson target_candidates "$(jq -c --arg url "$TARGET_URL" '[.data[] | select(.livemode == true and .url == $url) | {id,status,url,enabled_events}]' /tmp/webhooks.json)" \
            --argjson live_endpoints "$(jq -c '[.data[] | select(.livemode == true) | {id,status,url,enabled_events}]' /tmp/webhooks.json)" \
            '{target_url:$target_url,target_candidates:$target_candidates,live_endpoints:$live_endpoints}' \
            > stripe-webhook-diagnostic.json

          cat stripe-webhook-diagnostic.json

      - name: Upload safe webhook diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: stripe-webhook-diagnostic-${{ github.run_id }}
          path: stripe-webhook-diagnostic.json
          retention-days: 30
          if-no-files-found: error
