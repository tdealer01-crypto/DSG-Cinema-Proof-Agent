name: Verify Revenue W1-A Events

on:
  pull_request:
    paths:
      - 'revenue/revenue_events.py'
      - 'tests/test_revenue_events.py'
      - '.github/workflows/revenue-w1a-events-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m py_compile revenue/revenue_events.py
      - run: python -m pytest -q tests/test_revenue_events.py
