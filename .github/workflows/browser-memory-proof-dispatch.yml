name: Dispatch Browser Memory Production Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-memory-proof-dispatch.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch shared browser continuity production proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run shared-browser-continuity-production-e2e.yml \
            --repo "${{ github.repository }}" \
            --ref main
