name: Agentic Improvement Proof CI

on:
  push:
    branches: [feat/improvement-proof-adapter]
    paths:
      - 'api_v1/improvement_proof.py'
      - 'api_v1/github_actions_oidc.py'
      - 'api_v1/improvement_attestation.py'
      - 'api_v1/__init__.py'
      - 'tests/test_improvement_proof.py'
      - 'tests/test_improvement_attestation.py'
      - '.github/workflows/agentic-improvement-proof-ci.yml'
  pull_request:
    paths:
      - 'api_v1/improvement_proof.py'
      - 'api_v1/github_actions_oidc.py'
      - 'api_v1/improvement_attestation.py'
      - 'api_v1/__init__.py'
      - 'tests/test_improvement_proof.py'
      - 'tests/test_improvement_attestation.py'
      - '.github/workflows/agentic-improvement-proof-ci.yml'

permissions:
  contents: read

jobs:
  proof-verification:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact proof dependencies
        run: python -m pip install 'pydantic==2.13.4' 'pytest==9.0.3' 'cryptography==46.0.0' 'httpx==0.28.1' 'fastapi==0.129.2'
      - name: Run structural and raw-evidence proof tests
        run: python -m pytest -q tests/test_improvement_proof.py tests/test_improvement_attestation.py
