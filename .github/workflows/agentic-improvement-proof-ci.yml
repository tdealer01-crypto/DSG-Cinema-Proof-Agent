name: Agentic Improvement Proof CI

on:
  push:
    branches: [feat/improvement-proof-adapter]
    paths:
      - 'api_v1/improvement_proof.py'
      - 'tests/test_improvement_proof.py'
      - '.github/workflows/agentic-improvement-proof-ci.yml'
  pull_request:
    paths:
      - 'api_v1/improvement_proof.py'
      - 'tests/test_improvement_proof.py'
      - '.github/workflows/agentic-improvement-proof-ci.yml'

permissions:
  contents: read

jobs:
  structural-proof:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pydantic==2.13.4' 'pytest==9.0.3'
      - run: python -m pytest -q tests/test_improvement_proof.py
