name: Diagnose Azure Browser 500
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-azure-browser-500.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    steps:
      - uses: azure/login@v2
        with:
          client-id: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
          tenant-id: cbc618d5-9aa3-46b5-ae64-d07794603a7a
          subscription-id: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      - name: Read only recent safe exception signatures
        shell: bash
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --only-show-errors
          az containerapp logs show -g rg-t.dealer01-0468 -n dsg-cinema-production --type console --tail 300 --format text 2>&1 \
            | grep -E 'Traceback|ERROR|Exception|TypeError|AttributeError|RuntimeError|Playwright|azure_action|_perform_action|remote browser|Internal Server Error' \
            | tail -n 120 || true
