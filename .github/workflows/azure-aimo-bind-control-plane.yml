name: Azure AIMO Control Plane Binding

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/azure-aimo-bind-control-plane.yml'

permissions:
  contents: read
  id-token: write

jobs:
  bind:
    name: Bind AIMO proof authority to Azure services
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      DSG_ONE_APP: dsg-one-v1
      SIMULATION_APP: dsg-agi-simulation
      CONTROL_PLANE_URL: https://dsg-control-plane.azurewebsites.net
      SIMULATION_URL: https://dsg-agi-simulation.azurewebsites.net
      CINEMA_URL: https://dsg-cinema-production.nicetree-a005fe99.westus3.azurecontainerapps.io

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Azure login with Cinema production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Generate masked service key and bind Azure settings
        id: binding
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          raw_key="dsg_live_$(openssl rand -hex 32)"
          echo "::add-mask::$raw_key"
          key_hash="$(printf '%s' "$raw_key" | sha256sum | awk '{print $1}')"

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$DSG_ONE_APP" \
            --settings \
              "DSG_AGI_SIMULATION_URL=$SIMULATION_URL" \
              "DSG_CINEMA_PROOF_URL=$CINEMA_URL" \
              "DSG_CONTROL_PLANE_URL=$CONTROL_PLANE_URL" \
              "DSG_CONTROL_PLANE_API_KEY=$raw_key" \
            --only-show-errors --output none

          az webapp config appsettings set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$SIMULATION_APP" \
            --settings \
              "DSG_CONTROL_PLANE_URL=$CONTROL_PLANE_URL" \
              "DSG_CONTROL_PLANE_API_KEY=$raw_key" \
            --only-show-errors --output none

          # App Setting mutations restart App Service, but issue an explicit restart
          # so the evidence boundary is deterministic.
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$DSG_ONE_APP" --only-show-errors
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --only-show-errors

          mkdir -p "$RUNNER_TEMP/aimo-binding"
          jq -n \
            --arg key_hash "$key_hash" \
            --arg control_plane_url "$CONTROL_PLANE_URL" \
            --arg simulation_url "$SIMULATION_URL" \
            --arg cinema_url "$CINEMA_URL" \
            '{
              schemaVersion: "dsg.azure.aimo-authority-binding.v1",
              keyHash: $key_hash,
              rawKeyLogged: false,
              dsgOne: {
                app: "dsg-one-v1",
                bindings: ["DSG_AGI_SIMULATION_URL","DSG_CINEMA_PROOF_URL","DSG_CONTROL_PLANE_URL","DSG_CONTROL_PLANE_API_KEY"]
              },
              simulation: {
                app: "dsg-agi-simulation",
                bindings: ["DSG_CONTROL_PLANE_URL","DSG_CONTROL_PLANE_API_KEY"]
              },
              endpoints: {
                controlPlane: $control_plane_url,
                simulation: $simulation_url,
                cinema: $cinema_url
              }
            }' > "$RUNNER_TEMP/aimo-binding/binding.json"

          echo "key_hash=$key_hash" >> "$GITHUB_OUTPUT"
          echo "AIMO_CONTROL_PLANE_KEY_HASH=$key_hash"
          unset raw_key

      - name: Verify Azure binding names after mutation
        shell: bash
        run: |
          set -euo pipefail
          for app in "$DSG_ONE_APP" "$SIMULATION_APP"; do
            names="$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$app" --query '[].name' -o tsv)"
            echo "AZURE_BINDING_APP=$app"
            if [[ "$app" == "$DSG_ONE_APP" ]]; then
              for required in DSG_AGI_SIMULATION_URL DSG_CINEMA_PROOF_URL DSG_CONTROL_PLANE_URL DSG_CONTROL_PLANE_API_KEY; do
                grep -qx "$required" <<<"$names" || { echo "BLOCK missing=$required app=$app"; exit 1; }
              done
            else
              for required in DSG_CONTROL_PLANE_URL DSG_CONTROL_PLANE_API_KEY; do
                grep -qx "$required" <<<"$names" || { echo "BLOCK missing=$required app=$app"; exit 1; }
              done
            fi
          done
          echo 'AZURE_AIMO_BINDING_NAMES=PASS'

      - name: Probe simulation authority configuration
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/aimo-binding/simulation-health.json"
          ok=false
          for attempt in $(seq 1 24); do
            code=$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' "$SIMULATION_URL/health" || true)
            if [[ "$code" == '200' ]] && jq -e '.ok == true and .authConfigured == true and .encodingProofAuthorityConfigured == true' "$body" >/dev/null 2>&1; then
              ok=true
              break
            fi
            sleep 5
          done
          if [[ "$ok" != 'true' ]]; then
            echo 'SIMULATION_AUTHORITY_CONFIG=BLOCK'
            cat "$body" 2>/dev/null || true
            exit 1
          fi
          jq '{ok,service,authConfigured,encodingProofAuthorityConfigured,authMode,productionAuthFailClosed}' "$body"
          echo 'SIMULATION_AUTHORITY_CONFIG=PASS'

      - name: Upload binding evidence
        uses: actions/upload-artifact@v4
        with:
          name: azure-aimo-binding-${{ github.run_id }}
          path: ${{ runner.temp }}/aimo-binding
          if-no-files-found: error
          retention-days: 14
