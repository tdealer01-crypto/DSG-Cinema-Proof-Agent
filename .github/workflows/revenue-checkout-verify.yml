name: Verify Revenue Checkout

on:
  pull_request:
    paths:
      - 'revenue/checkout.py'
      - 'revenue/api.py'
      - 'revenue/accounts.py'
      - 'revenue/stripe_sync.py'
      - 'revenue/pricing.py'
      - 'api_v1/__init__.py'
      - 'tests/test_revenue_checkout.py'
      - '.github/workflows/revenue-checkout-verify.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/checkout.py'
      - 'revenue/api.py'
      - 'revenue/accounts.py'
      - 'revenue/stripe_sync.py'
      - 'revenue/pricing.py'
      - 'api_v1/__init__.py'
      - 'tests/test_revenue_checkout.py'
      - '.github/workflows/revenue-checkout-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revenue-checkout-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-checkout:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Cinema dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-cinema.txt pytest z3-solver==4.13.0

      - name: Compile checkout surface
        run: |
          python -m py_compile \
            api_v1/__init__.py \
            revenue/checkout.py \
            tests/test_revenue_checkout.py

      - name: Run checkout contract tests
        run: python -m pytest -q tests/test_revenue_checkout.py

      - name: Assert checkout cannot grant entitlement directly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('revenue/checkout.py').read_text(encoding='utf-8')
          forbidden = (
              'payment_linked=True',
              'payment_linked = True',
              'plan="metered"',
              "plan='metered'",
          )
          hits = [token for token in forbidden if token in source]
          if hits:
              raise SystemExit(f'checkout route must not grant entitlement directly: {hits}')
          if 'CHECKOUT_CREATED_NOT_ENTITLED' not in source:
              raise SystemExit('missing explicit non-entitled checkout state')
          print('PASS: checkout creation is separated from entitlement mutation')
          PY
