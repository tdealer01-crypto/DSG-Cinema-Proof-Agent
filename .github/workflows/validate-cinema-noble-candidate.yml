name: Verify isolated Ubuntu Noble Cinema candidate

on:
  pull_request:
    paths:
      - "Dockerfile.cinema.noble"
      - ".github/workflows/validate-cinema-noble-candidate.yml"
      - ".github/workflows/stage-aws-cinema-noble-candidate.yml"
      - "requirements-cinema.noble.txt"
      - "tests/test_cinema_noble_source.py"
      - "requirements-cinema.txt"
      - "market_ready_payload/**"
      - "api_v1/oauth_cinema_link.py"
  # Intentionally no push-to-main build or ECR publisher:
  # this is a non-production migration candidate with a blocking CVE scan.

permissions:
  contents: read

jobs:
  validate-noble-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Source-only fail-closed assertions
        run: python3 -m unittest -v tests/test_cinema_noble_source.py
      - name: Build Ubuntu Noble candidate with signed Ubuntu source packages
        shell: bash
        run: |
          set -euo pipefail
          docker build --pull --no-cache -f Dockerfile.cinema.noble \
            -t dsg-cinema-noble-candidate:${GITHUB_SHA} .
      - name: Validate pinned package floors and Git CUPS Chromium GnuTLS-free linkage
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm dsg-cinema-noble-candidate:${GITHUB_SHA} sh -eu -c '
            dpkg-query -W libc6 libxml2 zlib1g git libcups2t64
            for pkg in python3-pip-whl python3-setuptools-whl python3-venv; do
              if dpkg -s "$pkg" 2>/dev/null | grep -q "^Status: install ok installed$"; then
                echo "BLOCK: unused Ubuntu pip wheel dependency still present: $pkg"; exit 1
              fi
            done
            dpkg --compare-versions "$(dpkg-query -W libc6 | cut -f2)" ge "2.39-0ubuntu8.9"
            dpkg --compare-versions "$(dpkg-query -W libxml2 | cut -f2)" ge "2.9.14+dfsg-1.3ubuntu3.10"
            # Ubuntu may retain GnuTLS for Essential apt. Governed execution
            # surfaces may not dynamically link it; never force-remove apt.
            ldd "$(command -v git)" | tee /tmp/dsg-noble-git-ldd.log
            ldd /usr/local/lib/libcups.so.2 | tee /tmp/dsg-noble-cups-ldd.log
            ldd /ms-playwright/chromium-*/chrome-linux64/chrome | tee /tmp/dsg-noble-chromium-ldd.log
            for linkage in /tmp/dsg-noble-git-ldd.log /tmp/dsg-noble-cups-ldd.log /tmp/dsg-noble-chromium-ldd.log; do
              if grep -q "not found" "$linkage"; then echo "BLOCK: missing runtime library $linkage"; exit 1; fi
              if grep -q libgnutls "$linkage"; then echo "BLOCK: GnuTLS linked into runtime surface $linkage"; exit 1; fi
            done
            if command -v curl >/dev/null 2>&1; then echo "BLOCK: curl binary present"; exit 1; fi
            if ! dpkg-query -W apt libgnutls30t64 >/dev/null; then echo "BLOCK: Ubuntu essential package inventory drift"; exit 1; fi
            echo CINEMA_NOBLE_PACKAGE_AND_LINKAGE=PASS
          '
      - name: Launch real Chromium and execute a real browser action
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(docker run --rm -i dsg-cinema-noble-candidate:${GITHUB_SHA} python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True, args=["--no-sandbox", "--disable-dev-shm-usage"]
              )
              page = browser.new_page()
              page.set_content('<html><head><title>DSG Noble</title></head><body><button id="go">0</button><script>document.getElementById("go").addEventListener("click", function () {this.textContent="1";});</script></body></html>')
              assert page.title() == "DSG Noble"
              page.locator("#go").click()
              assert page.locator("#go").inner_text() == "1"
              assert page.screenshot(type="png").startswith(bytes((137, 80, 78, 71, 13, 10, 26, 10)))
              print("CINEMA_NOBLE_CHROMIUM_SMOKE=PASS version=" + browser.version)
              browser.close()
          PY
          )"
          echo "$OUTPUT"
          grep -q "CINEMA_NOBLE_CHROMIUM_SMOKE=PASS" <<<"$OUTPUT"
      - name: Exercise local-only Git clone without network credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm dsg-cinema-noble-candidate:${GITHUB_SHA} sh -eu -c '
            tmp="$(mktemp -d)"
            git init -q "$tmp/work"
            git -C "$tmp/work" config user.name DSG
            git -C "$tmp/work" config user.email sandbox@dsg.invalid
            printf "%s\\n" proof > "$tmp/work/proof.txt"
            git -C "$tmp/work" add .
            git -C "$tmp/work" commit -qm proof
            git clone -q --bare "$tmp/work" "$tmp/work.git"
            test -f "$tmp/work.git/HEAD"
            echo CINEMA_NOBLE_LOCAL_GIT_SMOKE=PASS
          '
      - name: Validate new FastAPI and Starlette runtime API contract
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT="$(docker run --rm -i dsg-cinema-noble-candidate:${GITHUB_SHA} python - <<'PY'
          from fastapi.testclient import TestClient
          from cinema_main import app

          with TestClient(app) as client:
              schema = client.get("/openapi.json")
              assert schema.status_code == 200, (schema.status_code, schema.text[:400])
              api = schema.json()
              assert "/health" in api["paths"]
              health = client.get("/health")
              # No owner/backend secrets in the CI container: health MUST fail closed.
              assert health.status_code == 503, (health.status_code, health.text[:400])
              assert health.json().get("status") == "blocked"
              print("CINEMA_NOBLE_API_IMPORT_OPENAPI_AND_AUTH=PASS")
          PY
          )"
          echo "$OUTPUT"
          grep -q 'CINEMA_NOBLE_API_IMPORT_OPENAPI_AND_AUTH=PASS' <<<"$OUTPUT"
      - name: Security scan full candidate image (all fix-statuses)
        # Independent open-source diagnosis; AWS ECR exact-digest scan remains
        # mandatory before any image can be published or promoted.
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'dsg-cinema-noble-candidate:${{ github.sha }}'
          scan-type: image
          severity: 'CRITICAL,HIGH'
          vuln-type: 'os,library'
          ignore-unfixed: false
          format: table
          exit-code: '1'
          cache: 'false'
      - name: Report candidate only, NOT promoted
        run: |
          echo "CINEMA_NOBLE_CANDIDATE=SOURCE_BUILD_AND_SMOKE_ONLY"
          echo "CINEMA_NOBLE_ECR_ZERO_HIGH=NOT_VERIFIED"
          echo "CINEMA_NOBLE_PRODUCTION_PROMOTION=BLOCKED_UNTIL_ECR_SCAN"
