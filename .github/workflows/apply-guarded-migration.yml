name: apply-guarded-migration

# Brings a live database to the guarded evidence schema this runtime writes, then
# proves the constraints against it. The connection URI exists only as a repository
# secret: no job step prints it, and the migration runner validates it without
# echoing it.

on:
  workflow_dispatch:
    inputs:
      run_live_test:
        description: Run the live guarded mutation test after migrating
        type: boolean
        default: true
  push:
    branches:
      - claude/mutation-execution-impl-ys9vux

concurrency:
  group: guarded-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      DSG_REVENUE_DATABASE_URL: ${{ secrets.DSG_REVENUE_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to run without a database URI
        run: |
          if [ -z "${DSG_REVENUE_DATABASE_URL}" ]; then
            echo "::error::secrets.DSG_REVENUE_DATABASE_URL is not set on this repository."
            echo "Add it under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi
          echo "database URI is configured (value not printed)"

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Bootstrap schema and apply migration
        run: python scripts/apply_guarded_migration.py

      - name: Live guarded mutation test
        if: github.event_name == 'push' || inputs.run_live_test
        run: python scripts/live_supabase_mutation_test.py
