name: Copilot CLI Plugin E2E

on:
  push:
    branches: [main]
    paths:
      - '.github/plugin/**'
      - 'marketplace/agent-plugin/**'
      - '.github/workflows/copilot-cli-plugin-e2e.yml'
  pull_request:
    paths:
      - '.github/plugin/**'
      - 'marketplace/agent-plugin/**'
      - '.github/workflows/copilot-cli-plugin-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-install:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: '1'
      NO_COLOR: '1'
      MARKETPLACE_NAME: dsg-agent-plugins
      PLUGIN_NAME: dsg-governance

    steps:
      - name: Checkout exact workflow revision
        uses: actions/checkout@v6

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        run: npm install -g @github/copilot

      - name: Record Copilot CLI and expected plugin versions
        shell: bash
        run: |
          set -euo pipefail
          copilot --version | tee /tmp/copilot-version.txt
          plugin_version="$(python - <<'PY'
          import json
          from pathlib import Path
          print(json.loads(Path('marketplace/agent-plugin/plugin.json').read_text(encoding='utf-8'))['version'])
          PY
          )"
          echo "PLUGIN_VERSION=$plugin_version" >> "$GITHUB_ENV"
          printf '%s\n' "$plugin_version" | tee /tmp/plugin-version.txt

      - name: Add DSG marketplace from exact checked-out revision
        shell: bash
        env:
          HOME: ${{ runner.temp }}/copilot-e2e-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          # A GitHub OWNER/REPO marketplace add resolves the repository's default
          # branch and therefore cannot prove an unmerged PR. Using the checked-out
          # local marketplace makes this client test commit-bound.
          copilot plugin marketplace add "$GITHUB_WORKSPACE"
          copilot plugin marketplace list | tee /tmp/marketplaces.txt
          grep -F "$MARKETPLACE_NAME" /tmp/marketplaces.txt

      - name: Browse exact DSG marketplace
        shell: bash
        env:
          HOME: ${{ runner.temp }}/copilot-e2e-home
        run: |
          set -euo pipefail
          copilot plugin marketplace browse "$MARKETPLACE_NAME" | tee /tmp/browse.txt
          grep -F "$PLUGIN_NAME" /tmp/browse.txt
          grep -F "Spacetime" /tmp/browse.txt

      - name: Install exact DSG governance plugin
        shell: bash
        env:
          HOME: ${{ runner.temp }}/copilot-e2e-home
        run: |
          set -euo pipefail
          copilot plugin install "$PLUGIN_NAME@$MARKETPLACE_NAME"
          copilot plugin list | tee /tmp/plugins.txt
          grep -F "$PLUGIN_NAME@$MARKETPLACE_NAME" /tmp/plugins.txt
          grep -F "(v$PLUGIN_VERSION)" /tmp/plugins.txt

      - name: Build commit-bound client-install evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          cli_version = Path('/tmp/copilot-version.txt').read_text(encoding='utf-8').strip()
          plugin_version = Path('/tmp/plugin-version.txt').read_text(encoding='utf-8').strip()
          evidence = {
              'schema_version': '1.1',
              'client': 'GitHub Copilot CLI',
              'client_version': cli_version,
              'tested_git_sha': os.environ['GITHUB_SHA'],
              'marketplace_source': 'checked-out workflow revision',
              'marketplace_name': os.environ['MARKETPLACE_NAME'],
              'plugin_name': os.environ['PLUGIN_NAME'],
              'plugin_version': plugin_version,
              'marketplace_add': 'PASS',
              'marketplace_browse': 'PASS',
              'plugin_install': 'PASS',
              'plugin_list_exact_version': 'PASS',
              'authenticated_mcp_tool_call': 'NOT_RUN',
              'truth_boundary': 'Exact checked-out package installation proof only. Spacetime Bearer credential binding and authenticated MCP tool-call proof remain separate gates.'
          }
          Path('copilot-cli-plugin-e2e.json').write_text(json.dumps(evidence, indent=2) + '\n', encoding='utf-8')
          PY
          cat copilot-cli-plugin-e2e.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload client-install evidence
        uses: actions/upload-artifact@v4
        with:
          name: copilot-cli-plugin-e2e-${{ github.sha }}
          path: copilot-cli-plugin-e2e.json
          if-no-files-found: error
