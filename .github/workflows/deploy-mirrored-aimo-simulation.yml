name: Deploy Mirrored AIMO Simulation Runtime

on:
  pull_request:
    branches: [main]
    paths:
      - '_proof/simulation-runtime/**'
      - '.github/workflows/deploy-mirrored-aimo-simulation.yml'

permissions:
  contents: read
  id-token: write

jobs:
  verify-deploy-prove:
    name: Verify snapshot then deploy immutable simulation container
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 25
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      SIMULATION_APP: dsg-agi-simulation
      SIMULATION_URL: https://dsg-agi-simulation.azurewebsites.net
      ACR_NAME: dsgcp50aaef839
      ACR_LOGIN_SERVER: dsgcp50aaef839.azurecr.io
      IMAGE_REPOSITORY: dsg-agi-simulation
      IMAGE_TAG: authority-8a1a603a31aa6578
      EXPECTED_SOURCE_SHA: 8a1a603a31aa65780b6e57762589ab19a0e76b68

    steps:
      - name: Checkout exact proof head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify mirrored source Git blob identities
        shell: bash
        run: |
          set -euo pipefail
          cd _proof/simulation-runtime
          manifest_sha=$(jq -r '.sourceCommit' SOURCE_MANIFEST.json)
          test "$manifest_sha" = "$EXPECTED_SOURCE_SHA" || { echo 'BLOCK: source commit mismatch'; exit 1; }
          jq -r '.files[] | [.path,.originalBlobSha] | @tsv' SOURCE_MANIFEST.json | while IFS=$'\t' read -r path expected; do
            test -f "$path" || { echo "BLOCK: missing mirrored file $path"; exit 1; }
            actual=$(git hash-object "$path")
            if [ "$actual" != "$expected" ]; then
              echo "BLOCK: mirrored source drift path=$path expected=$expected actual=$actual"
              exit 1
            fi
            echo "SOURCE_BLOB_PASS path=$path sha=$actual"
          done
          grep -q 'solveGovernedAimoShard' src/http-server.ts
          grep -q 'encodingProofAuthorityConfigured' src/http-server.ts
          echo 'MIRRORED_SOURCE_PROOF=PASS'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Local production smoke before Azure mutation
        shell: bash
        run: |
          set -euo pipefail
          cd _proof/simulation-runtime
          npm install --omit=dev --ignore-scripts=false --no-audit --no-fund
          PORT=18080 \
          NODE_ENV=production \
          DSG_AGI_SIMULATION_API_KEY=local-smoke-key \
          DSG_CONTROL_PLANE_URL=https://control-plane.invalid \
          DSG_CONTROL_PLANE_API_KEY=local-proof-key \
          npm run serve > "$RUNNER_TEMP/simulation-local.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=false
          for attempt in $(seq 1 20); do
            if curl --silent --fail http://127.0.0.1:18080/health > "$RUNNER_TEMP/local-health.json"; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true || { cat "$RUNNER_TEMP/simulation-local.log"; exit 1; }
          jq -e '.ok == true and .authConfigured == true and .encodingProofAuthorityConfigured == true and .productionAuthFailClosed == true' "$RUNNER_TEMP/local-health.json" >/dev/null
          kill "$pid" 2>/dev/null || true
          trap - EXIT
          echo 'LOCAL_PRODUCTION_RUNTIME_PROOF=PASS'

      - name: Azure login with Cinema production OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current container and verify bindings
        id: before
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/simulation-evidence"
          current_fx=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --query linuxFxVersion -o tsv)
          case "$current_fx" in DOCKER\|*) ;; *) echo "BLOCK: expected Linux custom container, got $current_fx"; exit 1;; esac
          printf '%s\n' "$current_fx" > "$RUNNER_TEMP/simulation-evidence/previous-linux-fx-version.txt"
          echo "previous_fx=$current_fx" >> "$GITHUB_OUTPUT"

          names=$(az webapp config appsettings list --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --query '[].name' -o tsv)
          for required in DSG_AGI_SIMULATION_API_KEY DSG_CONTROL_PLANE_URL DSG_CONTROL_PLANE_API_KEY WEBSITES_PORT; do
            grep -qx "$required" <<<"$names" || { echo "BLOCK: missing Azure runtime binding $required"; exit 1; }
          done

          actual_login=$(az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" --query loginServer -o tsv)
          test "$actual_login" = "$ACR_LOGIN_SERVER" || { echo 'BLOCK: ACR login server mismatch'; exit 1; }
          echo "PREVIOUS_IMAGE=$current_fx"
          echo 'AZURE_CONTAINER_PRECONDITION=PASS'

      - name: Build immutable authority image in ACR
        shell: bash
        run: |
          set -euo pipefail
          cd _proof/simulation-runtime
          cat > Dockerfile.proof <<'DOCKERFILE'
          FROM node:20-alpine
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev --ignore-scripts=false --no-audit --no-fund
          COPY src ./src
          ENV NODE_ENV=production
          ENV PORT=8080
          RUN addgroup -g 1001 -S appgroup && adduser -S -u 1001 -G appgroup appuser && chown -R appuser:appgroup /app
          USER appuser
          EXPOSE 8080
          CMD ["npx", "tsx", "src/http-server.ts"]
          DOCKERFILE

          az acr build \
            --registry "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --image "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --file Dockerfile.proof \
            . \
            --only-show-errors

          digest=$(az acr repository show \
            --name "$ACR_NAME" \
            --image "$IMAGE_REPOSITORY:$IMAGE_TAG" \
            --query digest -o tsv)
          test -n "$digest" || { echo 'BLOCK: ACR image digest missing'; exit 1; }
          printf '%s\n' "$digest" > "$RUNNER_TEMP/simulation-evidence/new-image-digest.txt"
          printf '%s/%s:%s\n' "$ACR_LOGIN_SERVER" "$IMAGE_REPOSITORY" "$IMAGE_TAG" > "$RUNNER_TEMP/simulation-evidence/new-image.txt"
          printf '%s\n' "$EXPECTED_SOURCE_SHA" > "$RUNNER_TEMP/simulation-evidence/source-commit.txt"
          echo "ACR_IMAGE_DIGEST=$digest"
          echo 'ACR_IMMUTABLE_IMAGE_BUILD=PASS'

      - name: Activate new container image
        id: activate
        shell: bash
        run: |
          set -euo pipefail
          new_image="$ACR_LOGIN_SERVER/$IMAGE_REPOSITORY:$IMAGE_TAG"
          az webapp config set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$SIMULATION_APP" \
            --linux-fx-version "DOCKER|$new_image" \
            --only-show-errors --output none
          az webapp restart --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --only-show-errors
          actual_fx=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --query linuxFxVersion -o tsv)
          test "$actual_fx" = "DOCKER|$new_image" || { echo "BLOCK: Azure did not activate requested image: $actual_fx"; exit 1; }
          echo "ACTIVE_IMAGE=$actual_fx"
          echo 'AZURE_CONTAINER_ACTIVATION=PASS'

      - name: Prove deployed authority boundary with automatic rollback
        shell: bash
        env:
          PREVIOUS_FX: ${{ steps.before.outputs.previous_fx }}
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/simulation-evidence/health.json"
          ready=false
          for attempt in $(seq 1 60); do
            code=$(curl --silent --show-error --max-time 15 --output "$body" --write-out '%{http_code}' "$SIMULATION_URL/health" || true)
            if [ "$code" = 200 ] && jq -e '.ok == true and .service == "dsg-agi-simulation" and .authConfigured == true and .encodingProofAuthorityConfigured == true and .productionAuthFailClosed == true' "$body" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 5
          done

          if [ "$ready" != true ]; then
            echo 'NEW_IMAGE_HEALTH=BLOCK; rolling back to previous image'
            cat "$body" 2>/dev/null || true
            az webapp config set \
              --resource-group "$RESOURCE_GROUP" \
              --name "$SIMULATION_APP" \
              --linux-fx-version "$PREVIOUS_FX" \
              --only-show-errors --output none
            az webapp restart --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --only-show-errors
            echo 'AZURE_CONTAINER_ROLLBACK=ISSUED'
            exit 1
          fi

          jq '{ok,service,aimoShardEndpoint,authConfigured,encodingProofAuthorityConfigured,authMode,productionAuthFailClosed,truthBoundary}' "$body"

          unauth_code=$(curl --silent --show-error --max-time 15 \
            --output "$RUNNER_TEMP/simulation-evidence/unauthenticated-solve.json" \
            --write-out '%{http_code}' \
            --header 'Content-Type: application/json' \
            --data '{}' \
            "$SIMULATION_URL/v1/aimo/solve-shard" || true)
          test "$unauth_code" = 401 || { echo "BLOCK: expected unauthenticated solve HTTP 401, got $unauth_code"; exit 1; }
          jq -e '.status == "BLOCKED" and .error == "unauthorized"' "$RUNNER_TEMP/simulation-evidence/unauthenticated-solve.json" >/dev/null

          active_fx=$(az webapp config show --resource-group "$RESOURCE_GROUP" --name "$SIMULATION_APP" --query linuxFxVersion -o tsv)
          printf '%s\n' "$active_fx" > "$RUNNER_TEMP/simulation-evidence/active-linux-fx-version.txt"
          echo 'SIMULATION_CONTAINER_DEPLOYMENT_PROOF=PASS'

      - name: Upload safe deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulation-authority-container-${{ github.run_id }}
          path: ${{ runner.temp }}/simulation-evidence
          if-no-files-found: warn
          retention-days: 30
