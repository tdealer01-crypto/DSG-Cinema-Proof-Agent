name: Apply Campaign Readiness Patch

on:
  push:
    branches:
      - 'fix/campaign-readiness-20260831'

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/campaign-readiness-20260831

      - name: Materialize patched workflow
        run: |
          set -euo pipefail
          python scripts/apply_campaign_readiness_patch.py
          git diff --check
          echo "PATCHED_SHA256=$(sha256sum .github/workflows/deploy-cinema-production.yml | awk '{print $1}')"
          echo 'PATCHED_BASE64_BEGIN'
          base64 -w0 .github/workflows/deploy-cinema-production.yml
          echo
          echo 'PATCHED_BASE64_END'
