name: Diagnose GitHub Marketplace Credentials

on:
  pull_request:
    paths:
      - '.github/workflows/diagnose-github-marketplace-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 5
    env:
      HAS_WEBHOOK_SECRET: ${{ secrets.GITHUB_MARKETPLACE_WEBHOOK_SECRET != '' }}
      HAS_CLIENT_ID_VAR: ${{ vars.GITHUB_MARKETPLACE_OAUTH_CLIENT_ID != '' }}
      HAS_CLIENT_ID_SECRET: ${{ secrets.GITHUB_MARKETPLACE_OAUTH_CLIENT_ID != '' }}
      HAS_CLIENT_SECRET: ${{ secrets.GITHUB_MARKETPLACE_OAUTH_CLIENT_SECRET != '' }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          set -euo pipefail

          CLIENT_ID_PRESENT=false
          if [[ "$HAS_CLIENT_ID_VAR" == 'true' || "$HAS_CLIENT_ID_SECRET" == 'true' ]]; then
            CLIENT_ID_PRESENT=true
          fi

          jq -n \
            --argjson webhook_secret "$HAS_WEBHOOK_SECRET" \
            --argjson oauth_client_id "$CLIENT_ID_PRESENT" \
            --argjson oauth_client_id_variable "$HAS_CLIENT_ID_VAR" \
            --argjson oauth_client_id_secret "$HAS_CLIENT_ID_SECRET" \
            --argjson oauth_client_secret "$HAS_CLIENT_SECRET" \
            '{
              github_marketplace_credential_presence: {
                webhook_secret: $webhook_secret,
                oauth_client_id: $oauth_client_id,
                oauth_client_id_variable: $oauth_client_id_variable,
                oauth_client_id_secret: $oauth_client_id_secret,
                oauth_client_secret: $oauth_client_secret
              }
            }' > marketplace-credential-presence.json

          cat marketplace-credential-presence.json

          {
            echo '## GitHub Marketplace credential presence'
            echo
            echo "- Webhook secret present: $HAS_WEBHOOK_SECRET"
            echo "- OAuth client ID present: $CLIENT_ID_PRESENT"
            echo "- OAuth client secret present: $HAS_CLIENT_SECRET"
            echo
            echo 'No credential value is read or printed by this diagnostic.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload presence evidence
        uses: actions/upload-artifact@v4
        with:
          name: github-marketplace-credential-presence-${{ github.run_id }}
          path: marketplace-credential-presence.json
          retention-days: 30
