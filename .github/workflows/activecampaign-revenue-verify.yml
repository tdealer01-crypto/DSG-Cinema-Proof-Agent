name: Verify ActiveCampaign Revenue

on:
  pull_request:
    paths:
      - 'revenue/activecampaign_sync.py'
      - 'revenue/activecampaign_projection.py'
      - 'revenue/activecampaign_projection_sync.py'
      - 'revenue/marketing_profiles.py'
      - 'revenue/marketing_api.py'
      - 'revenue/revenue_pipeline.py'
      - 'revenue/signals.py'
      - 'revenue/lifecycle.py'
      - 'api_v1/__init__.py'
      - 'web/customer-dashboard/**'
      - 'tests/test_activecampaign_revenue.py'
      - 'tests/test_revenue_pipeline.py'
      - '.github/workflows/activecampaign-revenue-*.yml'
  push:
    branches: [main]
    paths:
      - 'revenue/activecampaign_sync.py'
      - 'revenue/activecampaign_projection.py'
      - 'revenue/activecampaign_projection_sync.py'
      - 'revenue/marketing_profiles.py'
      - 'revenue/marketing_api.py'
      - 'revenue/revenue_pipeline.py'
      - 'revenue/signals.py'
      - 'revenue/lifecycle.py'
      - 'api_v1/__init__.py'
      - 'web/customer-dashboard/**'
      - 'tests/test_activecampaign_revenue.py'
      - 'tests/test_revenue_pipeline.py'
      - '.github/workflows/activecampaign-revenue-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: activecampaign-revenue-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir -r requirements.txt pytest pyyaml

      - name: Compile ActiveCampaign revenue modules
        run: |
          python -m py_compile \
            revenue/activecampaign_sync.py \
            revenue/activecampaign_projection.py \
            revenue/activecampaign_projection_sync.py \
            revenue/marketing_profiles.py \
            revenue/marketing_api.py \
            revenue/revenue_pipeline.py \
            revenue/signals.py \
            revenue/lifecycle.py \
            api_v1/__init__.py \
            cinema_main.py

      - name: Run consent and payment truth tests
        run: |
          python -m pytest -q \
            tests/test_activecampaign_revenue.py \
            tests/test_revenue_pipeline.py

      - name: Validate workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml

          for path in (
              '.github/workflows/activecampaign-revenue-verify.yml',
              '.github/workflows/activecampaign-revenue-reconcile.yml',
          ):
              with open(path, encoding='utf-8') as handle:
                  body = yaml.safe_load(handle)
              assert body.get('jobs'), f'{path} has no jobs'

          with open('.github/workflows/activecampaign-revenue-reconcile.yml', encoding='utf-8') as handle:
              workflow = yaml.safe_load(handle)

          assert workflow.get('permissions', {}).get('id-token') == 'write'
          reconcile = workflow['jobs']['reconcile']
          assert reconcile.get('permissions', {}).get('id-token') == 'write'
          assert reconcile.get('permissions', {}).get('contents') == 'read'

          steps = reconcile['steps']
          shell = '\n'.join(str(step.get('run', '')) for step in steps)
          action_refs = [str(step.get('uses', '')) for step in steps]
          assert 'azure/login@v3.0.2' in action_refs
          assert 'ACTIONS_ID_TOKEN_REQUEST_URL' in shell
          assert 'ACTIONS_ID_TOKEN_REQUEST_TOKEN' in shell
          assert 'ACTIVECAMPAIGN_API_TOKEN' in shell
          assert 'secretref:activecampaign-api-token' in shell
          assert 'DSG_MARKETING_PROFILE_STORE=/revenue/marketing-profiles.json' in shell
          assert '/billing/marketing/reconcile' in shell
          assert 'signed Stripe invoice evidence only' in shell
          print('workflow contracts verified')
          PY

      - name: Assert payment truth cannot come from the client
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'authorize_signal_source(signal, trusted_source=trusted_source)' revenue/revenue_pipeline.py
          grep -q 'payment_proof.source != "stripe_paid_invoice"' revenue/revenue_pipeline.py
          grep -q 'requires authoritative payment proof' revenue/revenue_pipeline.py
          grep -q 'reconcile retries ActiveCampaign projection only' revenue/marketing_api.py
          python - <<'PY'
          from revenue.marketing_api import LifecycleEventRequest
          from revenue.signals import RevenueSignal, route_signal

          allowed = LifecycleEventRequest.model_fields['event'].annotation
          text = str(allowed)
          assert 'payment_confirmed' not in text, text

          route = route_signal(RevenueSignal.PAYMENT_CONFIRMED)
          assert route.trusted_source_only is True
          assert route.requires_payment_proof is True
          print('client payment assertion is excluded; payment authority is trusted paid-invoice proof')
          PY

      - name: Assert no ActiveCampaign credential is committed
        shell: bash
        run: |
          set -euo pipefail
          if grep -rInE 'Api-Token:[[:space:]]+[A-Za-z0-9_-]{16,}' \
            revenue tests web .github/workflows; then
            echo 'Concrete ActiveCampaign token found in source.' >&2
            exit 1
          fi
          grep -q 'ACTIVECAMPAIGN_API_TOKEN' revenue/activecampaign_sync.py
          grep -q 'secrets.ACTIVECAMPAIGN_API_TOKEN' .github/workflows/activecampaign-revenue-reconcile.yml
