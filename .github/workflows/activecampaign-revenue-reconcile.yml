name: ActiveCampaign Revenue Reconcile

on:
  workflow_run:
    workflows: ["Deploy Cinema + Z3 Production"]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-z3-production
  queue: max
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      ACTIVE_CAMPAIGN_API_URL: ${{ vars.DSG_ACTIVECAMPAIGN_API_URL }}
      ACTIVE_CAMPAIGN_API_TOKEN: ${{ secrets.ACTIVECAMPAIGN_API_TOKEN }}
      REVENUE_ADMIN_SECRET: ${{ secrets.DSG_REVENUE_ADMIN_SECRET }}

    steps:
      - name: Check configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIVE_CAMPAIGN_API_URL:-}" || -z "${ACTIVE_CAMPAIGN_API_TOKEN:-}" || -z "${REVENUE_ADMIN_SECRET:-}" ]]; then
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'ActiveCampaign revenue sync is PENDING_CONFIGURATION.'
            echo 'Required production configuration: DSG_ACTIVECAMPAIGN_API_URL variable, ACTIVECAMPAIGN_API_TOKEN secret, DSG_REVENUE_ADMIN_SECRET secret.'
            exit 0
          fi
          case "$ACTIVE_CAMPAIGN_API_URL" in
            https://*) ;;
            *) echo 'DSG_ACTIVECAMPAIGN_API_URL must be an HTTPS URL.' >&2; exit 1 ;;
          esac
          echo 'ready=true' >> "$GITHUB_OUTPUT"
          echo "::add-mask::$ACTIVE_CAMPAIGN_API_TOKEN"
          echo "::add-mask::$REVENUE_ADMIN_SECRET"

      - name: Verify GitHub OIDC token availability
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo 'GitHub OIDC token request variables are unavailable despite id-token: write.' >&2
            echo 'Check repository/organization Actions policy before retrying Azure login.' >&2
            exit 1
          fi
          echo 'GitHub OIDC token request capability is available.'

      - name: Azure login with OIDC
        if: steps.config.outputs.ready == 'true'
        uses: azure/login@v3.0.2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bind ActiveCampaign production configuration
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --secrets "activecampaign-api-token=$ACTIVE_CAMPAIGN_API_TOKEN" \
            --output none

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --set-env-vars \
              "ACTIVECAMPAIGN_API_URL=$ACTIVE_CAMPAIGN_API_URL" \
              ACTIVECAMPAIGN_API_TOKEN=secretref:activecampaign-api-token \
              ACTIVECAMPAIGN_LIST_ID=4 \
              ACTIVECAMPAIGN_PRODUCT_INTEREST_FIELD_ID=2 \
              ACTIVECAMPAIGN_LEAD_SOURCE_FIELD_ID=3 \
              ACTIVECAMPAIGN_LAST_HIGH_INTENT_FIELD_ID=4 \
              ACTIVECAMPAIGN_ACCOUNT_ID_FIELD_ID=5 \
              DSG_MARKETING_PROFILE_STORE=/revenue/marketing-profiles.json \
            --output none

      - name: Wait for marketing runtime readiness
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CINEMA_FQDN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          test -n "$CINEMA_FQDN"
          CINEMA_URL="https://$CINEMA_FQDN"
          echo "CINEMA_URL=$CINEMA_URL" >> "$GITHUB_ENV"

          for attempt in $(seq 1 72); do
            CODE=$(curl --silent --show-error \
              --output /tmp/marketing-status.json \
              --write-out '%{http_code}' \
              "$CINEMA_URL/billing/marketing/status" || true)
            if [[ "$CODE" == '200' ]] && jq -e '
              .activecampaign_configured == true and
              .profile_store_durable == true and
              .list_id == 4 and
              .account_id_field_id == 5 and
              .payment_truth == "signature-verified scoped Stripe invoice.paid evidence only"
            ' /tmp/marketing-status.json >/dev/null 2>&1; then
              break
            fi
            if [[ "$attempt" == '72' ]]; then
              echo 'ActiveCampaign marketing runtime did not become ready.' >&2
              cat /tmp/marketing-status.json >&2 || true
              exit 1
            fi
            sleep 5
          done

      - name: Reconcile paid lifecycle
        if: steps.config.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --request POST "$CINEMA_URL/billing/marketing/reconcile" \
            --header "Authorization: Bearer $REVENUE_ADMIN_SECRET" \
            --header 'Content-Type: application/json' \
            --data '{}' > /tmp/activecampaign-reconcile.json

          jq -e '
            (.checked | type == "number") and
            (.eligible_from_paid_invoice | type == "number") and
            (.synced | type == "number") and
            (.pending | type == "number") and
            (.failed | type == "number")
          ' /tmp/activecampaign-reconcile.json >/dev/null

          if [[ "$(jq -r '.failed' /tmp/activecampaign-reconcile.json)" != '0' ]]; then
            echo 'One or more ActiveCampaign lifecycle reconciliations failed.' >&2
            jq -c . /tmp/activecampaign-reconcile.json >&2
            exit 1
          fi

          jq -c '{checked,eligible_from_paid_invoice,synced,pending,failed}' /tmp/activecampaign-reconcile.json
