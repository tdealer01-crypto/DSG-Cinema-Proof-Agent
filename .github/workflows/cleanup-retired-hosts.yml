name: Remove retired hosting references

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-retired-hosts.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired hosting references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          retired = "https://dsg-one-verified-execution.onrender.com"
          azure = "https://dsgoneverifiedweb.z1.web.core.windows.net"

          replacements = {
              Path("cinema_main.py"): [(f'        "{retired}",\n', "")],
              Path(".github/workflows/deploy-cinema-production.yml"): [
                  (f"          RENDER_ORIGIN='{retired}'\n", ""),
                  ('          for origin in "$AZURE_ORIGIN" "$RENDER_ORIGIN"; do\n', '          for origin in "$AZURE_ORIGIN"; do\n'),
              ],
              Path("landing/index.html"): [(retired, azure)],
              Path("azure-landing/index.html"): [(retired, azure)],
              Path("tests/test_cinema_main.py"): [(retired, azure)],
              Path("tests/test_marketplace_surfaces.py"): [(retired, azure)],
          }

          for path, pairs in replacements.items():
              if not path.exists():
                  continue
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding="utf-8")

          checked = list(replacements)
          remaining = [str(p) for p in checked if p.exists() and retired in p.read_text(encoding="utf-8")]
          if remaining:
              raise SystemExit(f"retired host still present in active files: {remaining}")
          PY

          python -m py_compile cinema_main.py
          git diff --check
          mkdir -p .dsg-cleanup
          cp .github/workflows/deploy-cinema-production.yml .dsg-cleanup/deploy-cinema-production.azure-only.yml
          git checkout -- .github/workflows/deploy-cinema-production.yml

      - name: Commit non-workflow cleanup and staged Azure workflow blob
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cinema_main.py landing/index.html azure-landing/index.html tests/test_cinema_main.py tests/test_marketplace_surfaces.py .dsg-cleanup/deploy-cinema-production.azure-only.yml
          if git diff --cached --quiet; then
            echo 'No non-workflow cleanup changes required.'
            exit 0
          fi
          git commit -m 'chore: stage Azure-only Cinema hosting cleanup'
          git push origin HEAD:main
