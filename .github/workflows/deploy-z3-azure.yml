name: Deploy Z3 Verifier to Azure

on:
  pull_request:
    paths:
      - 'z3_main.py'
      - 'requirements.txt'
      - 'Dockerfile'
      - 'tests/test_z3_main.py'
      - 'tests/test_deploy_z3_azure_rest.py'
      - '.github/workflows/deploy-z3-azure.yml'
      - 'AZURE_BOOTSTRAP_GITHUB_OIDC.sh'
  # Coordinated production pushes are owned by deploy-cinema-production.yml so
  # Z3 and Cinema rotate their shared credential in the same deployment.
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

# Staging PR deploys use latest-run-wins so a newer verification run can replace
# a stale or superseded staging run. Production dispatches remain serialized and
# are never cancelled by a newer run.
concurrency:
  group: z3-verifier-${{ github.event_name == 'pull_request' && 'staging' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'production') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'pull_request' && 'staging' || (github.event_name == 'workflow_dispatch' && inputs.environment || 'production') }}
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      LOCATION: westus3
      ACR_NAME: tdealer01acr
      IMAGE_NAME: z3-solver-service
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      CONFIGURED_SOLVER_SECRET: ${{ secrets.DSG_SOLVER_SHARED_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select deployment target
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            TARGET_ENV="staging"
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TARGET_ENV="${{ inputs.environment }}"
          else
            TARGET_ENV="production"
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> "$GITHUB_ENV"
          echo "CONTAINER_ENV_NAME=dsg-z3-env-$TARGET_ENV" >> "$GITHUB_ENV"
          echo "CONTAINER_APP_NAME=dsg-z3-verifier-$TARGET_ENV" >> "$GITHUB_ENV"
          echo "PULL_IDENTITY_NAME=dsg-z3-acr-pull-$TARGET_ENV" >> "$GITHUB_ENV"

      - name: Resolve fail-closed solver secret
        shell: bash
        run: |
          set -euo pipefail
          SECRET="${CONFIGURED_SOLVER_SECRET:-}"

          if [[ "$TARGET_ENV" == "staging" && -z "$SECRET" ]]; then
            SECRET=$(openssl rand -hex 32)
            echo "Using an ephemeral masked staging solver secret"
          fi

          if [[ -z "$SECRET" ]]; then
            echo "DSG_SOLVER_SHARED_SECRET is required for production" >&2
            exit 1
          fi
          if [[ ${#SECRET} -lt 32 ]]; then
            echo "DSG_SOLVER_SHARED_SECRET must be at least 32 characters" >&2
            exit 1
          fi

          echo "::add-mask::$SECRET"
          echo "DSG_SOLVER_SHARED_SECRET=$SECRET" >> "$GITHUB_ENV"

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure identity and prerequisites
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          ACTIVE_SUB=$(az account show --query id --output tsv)
          test "$ACTIVE_SUB" = "$AZURE_SUBSCRIPTION_ID"

          az extension add --name containerapp --upgrade --only-show-errors

          az group show --name "$RESOURCE_GROUP" >/dev/null
          az acr show --name "$ACR_NAME" --resource-group "$RESOURCE_GROUP" >/dev/null

          az identity show \
            --name "$PULL_IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null

          IDENTITY_ID=$(az identity show \
            --name "$PULL_IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)
          PRINCIPAL_ID=$(az identity show \
            --name "$PULL_IDENTITY_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query principalId --output tsv)
          ACR_ID=$(az acr show \
            --name "$ACR_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query id --output tsv)

          test -n "$IDENTITY_ID"
          test -n "$PRINCIPAL_ID"
          test -n "$ACR_ID"

          ROLE_COUNT=$(az role assignment list \
            --assignee "$PRINCIPAL_ID" \
            --scope "$ACR_ID" \
            --query "[?roleDefinitionName=='AcrPull'] | length(@)" \
            --output tsv)
          if [[ "$ROLE_COUNT" == "0" ]]; then
            echo "AcrPull is missing for $PULL_IDENTITY_NAME. Re-run AZURE_BOOTSTRAP_GITHUB_OIDC.sh." >&2
            exit 1
          fi

          echo "IDENTITY_ID=$IDENTITY_ID" >> "$GITHUB_ENV"
          echo "ACR_ID=$ACR_ID" >> "$GITHUB_ENV"

      - name: Ensure Container Apps environment
        shell: bash
        run: |
          set -euo pipefail
          if ! az containerapp env show \
            --name "$CONTAINER_ENV_NAME" \
            --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
            az containerapp env create \
              --name "$CONTAINER_ENV_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --location "$LOCATION" \
              --output none
          fi

      - name: Build immutable image in ACR
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${GITHUB_SHA}"
          IMAGE_REF="$ACR_NAME.azurecr.io/$IMAGE_NAME:$IMAGE_TAG"
          echo "IMAGE_TAG=$IMAGE_TAG" >> "$GITHUB_ENV"
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          az acr build \
            --registry "$ACR_NAME" \
            --image "$IMAGE_NAME:$IMAGE_TAG" \
            --file Dockerfile \
            .

      - name: Create or update Container App
        shell: bash
        run: |
          set -euo pipefail
          deploy_with_retry() {
            local max_attempts=5
            local wait_seconds=15
            local attempt=1

            while (( attempt <= max_attempts )); do
              if [[ "$attempt" -gt 1 ]]; then
                echo "Attempt $attempt/$max_attempts after ${wait_seconds}s..."
                sleep "$wait_seconds"
                wait_seconds=$((wait_seconds + 15))
              fi

              if az containerapp show \
                --name "$CONTAINER_APP_NAME" \
                --resource-group "$RESOURCE_GROUP" >/dev/null 2>&1; then
                # Update path: suppress OperationInProgress errors to retry
                az containerapp identity assign \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --user-assigned "$IDENTITY_ID" \
                  --output none 2>&1 | grep -v "already assigned" || true

                az containerapp registry set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --server "$ACR_NAME.azurecr.io" \
                  --identity "$IDENTITY_ID" \
                  --output none || true

                az containerapp secret set \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --secrets "solver-secret=$DSG_SOLVER_SHARED_SECRET" \
                  --output none || true

                if az containerapp update \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --image "$IMAGE_REF" \
                  --set-env-vars \
                    DSG_SOLVER_SHARED_SECRET=secretref:solver-secret \
                    Z3_DETERMINISTIC_SEED=42 \
                    Z3_TIMEOUT_MS=30000 \
                    PORT=8080 \
                  --output none 2>&1; then
                  break
                else
                  # Update failed, retry
                  :
                fi
              else
                if az containerapp create \
                  --name "$CONTAINER_APP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --environment "$CONTAINER_ENV_NAME" \
                  --image "$IMAGE_REF" \
                  --ingress external \
                  --target-port 8080 \
                  --transport http \
                  --user-assigned "$IDENTITY_ID" \
                  --registry-server "$ACR_NAME.azurecr.io" \
                  --registry-identity "$IDENTITY_ID" \
                  --secrets "solver-secret=$DSG_SOLVER_SHARED_SECRET" \
                  --env-vars \
                    DSG_SOLVER_SHARED_SECRET=secretref:solver-secret \
                    Z3_DETERMINISTIC_SEED=42 \
                    Z3_TIMEOUT_MS=30000 \
                    PORT=8080 \
                  --min-replicas 1 \
                  --max-replicas 2 \
                  --cpu 0.5 \
                  --memory 1.0Gi \
                  --output none 2>&1; then
                  break
                else
                  # Create failed, retry
                  :
                fi
              fi

              ((attempt++))
            done

            if (( attempt > max_attempts )); then
              echo "Failed after $max_attempts attempts"
              return 1
            fi
          }

          deploy_with_retry

          az containerapp ingress update \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --type external \
            --target-port 8080 \
            --transport http \
            --allow-insecure false \
            --output none

          FQDN=$(az containerapp show \
            --name "$CONTAINER_APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)
          test -n "$FQDN"
          echo "SERVICE_URL=https://$FQDN" >> "$GITHUB_ENV"

      - name: Verify readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            CODE=$(curl --silent --show-error \
              --output /tmp/ready.json \
              --write-out '%{http_code}' \
              "$SERVICE_URL/ready" || true)
            if [[ "$CODE" == "200" ]] && jq -e '.status == "ready"' /tmp/ready.json >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/ready.json 2>/dev/null || true
          echo "Z3 verifier did not become ready" >&2
          exit 1

      - name: Verify exact optimum and deterministic replay
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD='{"request_id":"deployment-e2e","preset_name":"deployment","problem_type":"qubo","linear":[-4,-3,1],"quadratic":[[0,1,5],[1,2,2]],"proveOptimality":true,"z3TimeoutMs":30000}'

          verify_with_retry() {
            local max_attempts=36
            local wait_seconds=5
            local attempt=1

            while (( attempt <= max_attempts )); do
              if [[ "$attempt" -gt 1 ]]; then
                echo "Attempt $attempt/$max_attempts after ${wait_seconds}s..."
                sleep "$wait_seconds"
              fi

              if curl --silent --show-error \
                --output /tmp/proof-1.json \
                --write-out '%{http_code}' \
                --request POST "$SERVICE_URL/solve" \
                --header "Authorization: Bearer $DSG_SOLVER_SHARED_SECRET" \
                --header 'Content-Type: application/json' \
                --data "$PAYLOAD" | grep -q "200"; then
                break
              fi

              if [[ "$attempt" == "$max_attempts" ]]; then
                cat /tmp/proof-1.json 2>/dev/null || true
                echo "Failed to get valid response after $max_attempts attempts" >&2
                return 1
              fi

              ((attempt++))
            done
          }

          verify_with_retry

          curl --silent --show-error \
            --request POST "$SERVICE_URL/solve" \
            --header "Authorization: Bearer $DSG_SOLVER_SHARED_SECRET" \
            --header 'Content-Type: application/json' \
            --data "$PAYLOAD" > /tmp/proof-2.json

          jq -e '
            .z3_status == "SAT" and
            .verified == true and
            .verification == "VERIFIED_GLOBAL_OPTIMUM" and
            .witness == [1,0,0] and
            .energy_exact == "-4"
          ' /tmp/proof-1.json >/dev/null

          HASH_1=$(jq -r '.proof_hash' /tmp/proof-1.json)
          HASH_2=$(jq -r '.proof_hash' /tmp/proof-2.json)
          REQUEST_1=$(jq -r '.request_hash' /tmp/proof-1.json)
          REQUEST_2=$(jq -r '.request_hash' /tmp/proof-2.json)

          test -n "$HASH_1"
          test "$HASH_1" = "$HASH_2"
          test "$REQUEST_1" = "$REQUEST_2"

          jq '{request_id,z3_status,verification,verified,witness,energy,energy_exact,proof_hash,request_hash,audit}' \
            /tmp/proof-1.json > deployment_evidence.json

      - name: Write non-secret deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg service_url "$SERVICE_URL" \
            --arg image_ref "$IMAGE_REF" \
            --arg commit "$GITHUB_SHA" \
            --arg environment "$TARGET_ENV" \
            --slurpfile proof deployment_evidence.json \
            '{
              service_url: $service_url,
              image_ref: $image_ref,
              commit: $commit,
              environment: $environment,
              transport: "https",
              proof: $proof[0]
            }' > deployment_evidence.tmp
          mv deployment_evidence.tmp deployment_evidence.json
          cat deployment_evidence.json

      - name: Upload deployment evidence
        uses: actions/upload-artifact@v4
        with:
          name: z3-deployment-evidence-${{ github.sha }}
          path: deployment_evidence.json
          retention-days: 30
