name: Bind Browserbase Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api_v1/browserbase_executor.py'
      - '.github/workflows/bind-browserbase-production.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-browserbase-production
  cancel-in-progress: false

jobs:
  bind-browserbase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      CONFIGURED_BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}

    steps:
      - name: Refuse missing Browserbase credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CONFIGURED_BROWSERBASE_API_KEY:-}" ]]; then
            echo 'BROWSERBASE_API_KEY is not configured in GitHub Actions secrets.' >&2
            exit 1
          fi
          echo "::add-mask::$CONFIGURED_BROWSERBASE_API_KEY"

      - name: Verify Browserbase credential before production mutation
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request GET 'https://api.browserbase.com/v1/projects' \
            --header "X-BB-API-Key: $CONFIGURED_BROWSERBASE_API_KEY")
          if [[ "$code" != "200" ]]; then
            echo "Browserbase credential preflight failed with HTTP ${code}; refusing Azure mutation." >&2
            exit 1
          fi
          echo 'Browserbase credential preflight passed.'

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bind Browserbase credential to Cinema
        shell: bash
        run: |
          set -euo pipefail
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --output none

          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --secrets "browserbase-api-key=$CONFIGURED_BROWSERBASE_API_KEY" \
            --output none

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --set-env-vars BROWSERBASE_API_KEY=secretref:browserbase-api-key \
            --output none

      - name: Verify Browserbase binding without reading secret value
        shell: bash
        run: |
          set -euo pipefail
          BINDING=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query "properties.template.containers[0].env[?name=='BROWSERBASE_API_KEY'].secretRef | [0]" \
            --output tsv)
          test "$BINDING" = "browserbase-api-key"
          echo 'BROWSERBASE_API_KEY is bound to Cinema production via secretRef.'
