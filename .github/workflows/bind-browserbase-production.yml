name: Bind Browserbase Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api_v1/browserbase_executor.py'
      - 'api_v1/browserbase_shared_profile.py'
      - '.github/workflows/bind-browserbase-production.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cinema-z3-production
  queue: max
  cancel-in-progress: false

jobs:
  bind-browserbase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      RESOURCE_GROUP: rg-t.dealer01-0468
      CINEMA_APP: dsg-cinema-production
      CINEMA_PUBLIC_BASE_URL: https://dsg-cinema-production.nicetree-a005fe99.westus3.azurecontainerapps.io
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      CONFIGURED_BROWSERBASE_API_KEY: ${{ secrets.BROWSERBASE_API_KEY }}
      REQUESTED_BROWSERBASE_PROJECT_ID: ${{ vars.BROWSERBASE_PROJECT_ID }}

    steps:
      - name: Resolve Browserbase project from production credential
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CONFIGURED_BROWSERBASE_API_KEY:-}" ]]; then
            echo 'BROWSERBASE_API_KEY is not configured in GitHub Actions secrets.' >&2
            exit 1
          fi
          echo "::add-mask::$CONFIGURED_BROWSERBASE_API_KEY"

          response=$(curl --silent --show-error --fail-with-body \
            --request GET 'https://api.browserbase.com/v1/projects' \
            --header "X-BB-API-Key: $CONFIGURED_BROWSERBASE_API_KEY")

          mapfile -t project_ids < <(
            printf '%s' "$response" | jq -r '
              if type == "array" then
                .[]? | .id // empty
              elif ((.projects? | type) == "array") then
                .projects[]? | .id // empty
              elif .id? then
                .id
              else
                empty
              end
            ' | sort -u
          )

          if [[ -n "${REQUESTED_BROWSERBASE_PROJECT_ID:-}" ]]; then
            found=false
            for project_id in "${project_ids[@]}"; do
              if [[ "$project_id" == "$REQUESTED_BROWSERBASE_PROJECT_ID" ]]; then
                found=true
                break
              fi
            done
            if [[ "$found" != true ]]; then
              echo 'Configured BROWSERBASE_PROJECT_ID is not visible to the configured Browserbase credential.' >&2
              exit 1
            fi
            resolved_project_id="$REQUESTED_BROWSERBASE_PROJECT_ID"
          else
            if [[ "${#project_ids[@]}" -ne 1 ]]; then
              echo "Browserbase project discovery returned ${#project_ids[@]} projects; configure production BROWSERBASE_PROJECT_ID explicitly when the credential can access more than one." >&2
              exit 1
            fi
            resolved_project_id="${project_ids[0]}"
          fi

          if [[ -z "$resolved_project_id" ]]; then
            echo 'Browserbase project resolution returned an empty project id.' >&2
            exit 1
          fi
          echo "BROWSERBASE_PROJECT_ID=$resolved_project_id" >> "$GITHUB_ENV"
          echo 'Browserbase project/credential preflight passed.'

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Bind Browserbase credential, project and public origin to Cinema
        shell: bash
        run: |
          set -euo pipefail
          test -n "${BROWSERBASE_PROJECT_ID:-}"
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az extension add --name containerapp --upgrade --only-show-errors

          az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --output none

          az containerapp secret set \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --secrets "browserbase-api-key=$CONFIGURED_BROWSERBASE_API_KEY" \
            --output none

          az containerapp update \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --set-env-vars \
              BROWSERBASE_API_KEY=secretref:browserbase-api-key \
              BROWSERBASE_PROJECT_ID="$BROWSERBASE_PROJECT_ID" \
              DSG_PUBLIC_BASE_URL="$CINEMA_PUBLIC_BASE_URL" \
            --output none

      - name: Verify Browserbase binding without reading secret value
        shell: bash
        run: |
          set -euo pipefail
          BINDING=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query "properties.template.containers[0].env[?name=='BROWSERBASE_API_KEY'].secretRef | [0]" \
            --output tsv)
          test "$BINDING" = "browserbase-api-key"

          PROJECT_ID=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query "properties.template.containers[0].env[?name=='BROWSERBASE_PROJECT_ID'].value | [0]" \
            --output tsv)
          test "$PROJECT_ID" = "$BROWSERBASE_PROJECT_ID"

          PUBLIC_ORIGIN=$(az containerapp show \
            --resource-group "$RESOURCE_GROUP" \
            --name "$CINEMA_APP" \
            --query "properties.template.containers[0].env[?name=='DSG_PUBLIC_BASE_URL'].value | [0]" \
            --output tsv)
          test "$PUBLIC_ORIGIN" = "$CINEMA_PUBLIC_BASE_URL"

          echo 'Browserbase API key, project ID and Cinema public origin are bound for production.'
