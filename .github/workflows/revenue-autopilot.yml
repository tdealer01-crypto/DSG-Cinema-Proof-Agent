name: Revenue Autopilot

# Scheduled reconciliation of the live Verified Execution revenue system.
# The run probes production, verifies the usage ledger hash chain, and files a
# report. It reports UNAVAILABLE rather than guessing when a probe fails, and
# it never modifies pricing, accounts, or entitlement state.

on:
  workflow_dispatch:
    inputs:
      period:
        description: Billing period to report (YYYY-MM). Defaults to the current period.
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: revenue-autopilot
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CINEMA_BASE_URL: https://dsg-cinema-production.nicetree-a005fe99.westus3.azurecontainerapps.io
      REPORT_LABEL: revenue-autopilot
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Reconcile the revenue ledger
        id: reconcile
        shell: bash
        env:
          DSG_REVENUE_ADMIN_SECRET: ${{ secrets.DSG_REVENUE_ADMIN_SECRET }}
        run: |
          set -euo pipefail
          PERIOD_ARG=()
          if [[ -n "${{ inputs.period }}" ]]; then
            PERIOD_ARG=(--period "${{ inputs.period }}")
          fi

          set +e
          python scripts/revenue_report.py \
            --base-url "$CINEMA_BASE_URL" \
            --admin-secret "${DSG_REVENUE_ADMIN_SECRET:-}" \
            --output revenue-report.md \
            --json-output revenue-report.json \
            "${PERIOD_ARG[@]}"
          RESULT=$?
          set -e

          echo "reconcile_exit=$RESULT" >> "$GITHUB_OUTPUT"
          cat revenue-report.md >> "$GITHUB_STEP_SUMMARY"

          if [[ "$RESULT" == "0" ]]; then
            echo 'reconciliation_failed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'reconciliation_failed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Upload reconciliation evidence
        uses: actions/upload-artifact@v4
        with:
          name: revenue-report-${{ github.run_id }}
          path: |
            revenue-report.md
            revenue-report.json
          retention-days: 90

      - name: Publish the report to the tracking issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('revenue-report.md', 'utf8');
            const title = 'Revenue Autopilot — reconciliation log';

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: process.env.REPORT_LABEL,
              });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: process.env.REPORT_LABEL,
                color: '0e8a16',
                description: 'Automated revenue reconciliation evidence',
              });
            }

            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: process.env.REPORT_LABEL,
              per_page: 1,
            });

            const footer = [
              '',
              '---',
              `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');

            if (existing.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                labels: [process.env.REPORT_LABEL],
                body: body + footer,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.data[0].number,
              body: body + footer,
            });

      - name: Fail the run when reconciliation is unavailable or invalid
        if: steps.reconcile.outputs.reconciliation_failed == 'true'
        run: |
          echo 'Production revenue reconciliation did not return complete, verified evidence.' >&2
          exit 1
