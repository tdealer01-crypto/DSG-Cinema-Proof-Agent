name: DSG ONE Secret Boundary Probe

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/dsg-one-secret-boundary-probe.yml'

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 6
    env:
      AZURE_CLIENT_ID: bd54ab6e-5f92-48c8-8f8d-0c114ef938da
      AZURE_TENANT_ID: cbc618d5-9aa3-46b5-ae64-d07794603a7a
      AZURE_SUBSCRIPTION_ID: dcf13c0d-0d9f-4f81-aa89-c6b50aaef839
      RESOURCE_GROUP: rg-t.dealer01-0468
      WEBAPP: dsg-one-v1
      VAULT: dsg-shared-secrets
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Inspect identity and secret reference shape only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== MANAGED_IDENTITY ==='
          az webapp identity show -g "$RESOURCE_GROUP" -n "$WEBAPP" \
            --query '{type:type,principalId:principalId,tenantId:tenantId}' -o json || true

          settings="$RUNNER_TEMP/settings.json"
          az webapp config appsettings list -g "$RESOURCE_GROUP" -n "$WEBAPP" -o json > "$settings"
          node - "$settings" <<'NODE'
          const fs = require('fs');
          const rows = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const wanted = new Set([
            'DSG_ONE_V1_SUPABASE_SERVICE_ROLE_KEY',
            'DSG_AIMO_ROOT_KEY',
            'DSG_CONTROL_PLANE_API_KEY',
            'DSG_AGI_SIMULATION_API_KEY'
          ]);
          console.log('=== EXISTING_SECRET_BINDING_SHAPE ===');
          for (const row of rows.filter((r) => wanted.has(r.name)).sort((a,b)=>a.name.localeCompare(b.name))) {
            console.log(JSON.stringify({
              name: row.name,
              keyVaultReference: typeof row.value === 'string' && row.value.startsWith('@Microsoft.KeyVault(')
            }));
          }
          NODE

          principal="$(az webapp identity show -g "$RESOURCE_GROUP" -n "$WEBAPP" --query principalId -o tsv 2>/dev/null || true)"
          vault_id="$(az keyvault show -g "$RESOURCE_GROUP" -n "$VAULT" --query id -o tsv 2>/dev/null || true)"
          echo '=== VAULT_ROLE_ASSIGNMENTS ==='
          if [[ -n "$principal" && -n "$vault_id" ]]; then
            az role assignment list --assignee "$principal" --scope "$vault_id" \
              --query '[].{role:roleDefinitionName,scope:scope}' -o json || true
          else
            echo 'IDENTITY_OR_VAULT_NOT_RESOLVED'
          fi
