name: Build DSG Cinema production image on AWS

on:
  pull_request:
    paths:
      - ".github/workflows/build-aws-cinema.yml"
      - "Dockerfile.cinema"
      - "requirements-cinema.txt"
      - "cinema_main.py"
      - "api_v1/**"
      - "revenue/**"
      - "web/**"
      - "openapi/**"
      - "market_ready_payload/**"
      - "tools/**"
      - "config/owner-service-accounts.json"
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-aws-cinema.yml"
      - "Dockerfile.cinema"
      - "requirements-cinema.txt"
      - "cinema_main.py"
      - "api_v1/**"
      - "revenue/**"
      - "web/**"
      - "openapi/**"
      - "market_ready_payload/**"
      - "tools/**"
      - "config/owner-service-accounts.json"

permissions:
  contents: read
  id-token: write

concurrency:
  group: dsg-cinema-aws-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build Cinema image locally
        run: docker build -f Dockerfile.cinema -t dsg-cinema:${GITHUB_SHA} .
      - name: Smoke-test bundled Chromium
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm dsg-cinema:${GITHUB_SHA} python - <<'PY'
          from playwright.sync_api import sync_playwright

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=["--no-sandbox", "--disable-dev-shm-usage"],
              )
              page = browser.new_page()
              page.set_content("<title>DSG Cinema smoke</title>")
              assert page.title() == "DSG Cinema smoke"
              print(f"CINEMA_CHROMIUM_SMOKE=PASS version={browser.version}")
              browser.close()
          PY
      - name: Assert patched libcurl and local Git runtime
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm dsg-cinema:${GITHUB_SHA} sh -lc '
            version="$(dpkg-query -W libcurl4-gnutls | cut -f2)"
            dpkg --compare-versions "$version" ge "8.21.0-2~bpo13+1"
            test ! -x "$(command -v curl || true)"
            tmp="$(mktemp -d)"
            git init -q "$tmp/source"
            git -C "$tmp/source" config user.email sandbox@dsg.invalid
            git -C "$tmp/source" config user.name "DSG Sandbox"
            echo proof > "$tmp/source/proof.txt"
            git -C "$tmp/source" add .
            git -C "$tmp/source" commit -qm proof
            git clone -q --bare "$tmp/source" "$tmp/source.git"
            test -f "$tmp/source.git/HEAD"
            echo "CINEMA_PATCHED_LIBCURL_LOCAL_GIT=PASS version=$version"
          '
      - name: Assert curl CLI absent from production image
        run: |
          set -euo pipefail
          docker run --rm dsg-cinema:${GITHUB_SHA} sh -lc '! command -v curl'
          echo "CINEMA_CURL_CLI_ABSENT=PASS"
      - name: Assert no Claw server in canonical image contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Rni --exclude-dir=.git -E 'claw-server|browseros-neo-claw' Dockerfile.cinema cinema_main.py api_v1 revenue web openapi market_ready_payload tools
          echo "CINEMA_NO_CLAW_CONTRACT=PASS"

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify-image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_REGION: us-east-1
      AWS_ROLE_ARN: arn:aws:iam::121205961822:role/dsg-cinema-github-deploy
      ECR_REPOSITORY: dsg-cinema-prod
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build or reuse immutable image and verify digest
        shell: bash
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          IMAGE="$REGISTRY/$ECR_REPOSITORY:$GITHUB_SHA"
          EXISTING_DIGEST="$(aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids imageTag="$GITHUB_SHA"             --query 'imageDetails[0].imageDigest'             --output text 2>/dev/null || true)"
          if [[ "$EXISTING_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "AWS_CINEMA_IMAGE_REUSE=PASS digest=$EXISTING_DIGEST"
          else
            docker build -f Dockerfile.cinema -t "$IMAGE" .
            docker push "$IMAGE"
          fi
          DIGEST="$(aws ecr describe-images             --repository-name "$ECR_REPOSITORY"             --image-ids imageTag="$GITHUB_SHA"             --query 'imageDetails[0].imageDigest'             --output text)"
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "AWS_CINEMA_ECR_BUILD=PASS source_sha=$GITHUB_SHA digest=$DIGEST"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
        id: image
      - name: Block release on critical ECR findings
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="${{ steps.image.outputs.digest }}"
          FINDINGS=""
          SCAN_STATUS=""
          for attempt in $(seq 1 60); do
            ERROR_FILE="$(mktemp)"
            if FINDINGS="$(aws ecr describe-image-scan-findings \
              --repository-name "$ECR_REPOSITORY" \
              --image-id imageDigest="$DIGEST" \
              --output json 2>"$ERROR_FILE")"; then
              SCAN_STATUS="$(jq -r '.imageScanStatus.status // "UNKNOWN"' <<<"$FINDINGS")"
              rm -f "$ERROR_FILE"
              if [[ "$SCAN_STATUS" == "COMPLETE" ]]; then
                break
              fi
              case "$SCAN_STATUS" in
                FAILED|UNSUPPORTED_IMAGE|FINDINGS_UNAVAILABLE|LIMIT_EXCEEDED|IMAGE_ARCHIVED)
                  echo "READINESS=BLOCKED"
                  echo "BLOCK: ECR image scan ended in status $SCAN_STATUS"
                  echo "nextAction=Inspect the ECR scan status/finding source and publish a corrected immutable image before runtime deployment."
                  exit 26
                  ;;
              esac
            else
              if grep -q "ScanNotFoundException" "$ERROR_FILE"; then
                echo "ECR scan not registered yet; retrying attempt=$attempt"
              else
                cat "$ERROR_FILE" >&2
                echo "READINESS=BLOCKED"
                echo "nextAction=Repair ECR scan-read access or the scan API error, then rerun the immutable-image security gate."
                rm -f "$ERROR_FILE"
                exit 27
              fi
              rm -f "$ERROR_FILE"
            fi
            sleep 5
          done
          if [[ "$SCAN_STATUS" != "COMPLETE" ]]; then
            echo "READINESS=BLOCKED"
            echo "BLOCK: ECR image scan did not complete within the five-minute bounded polling window"
            echo "nextAction=Read the ECR scan result directly; rerun only after the same immutable digest reaches COMPLETE."
            exit 28
          fi
          CRITICAL="$(jq -r '.imageScanFindings.findingSeverityCounts.CRITICAL // 0' <<<"$FINDINGS")"
          HIGH="$(jq -r '.imageScanFindings.findingSeverityCounts.HIGH // 0' <<<"$FINDINGS")"
          MEDIUM="$(jq -r '.imageScanFindings.findingSeverityCounts.MEDIUM // 0' <<<"$FINDINGS")"
          echo "AWS_CINEMA_ECR_SCAN critical=$CRITICAL high=$HIGH medium=$MEDIUM"
          if (( CRITICAL > 0 )); then
            echo "READINESS=BLOCKED"
            echo "BLOCK: Cinema image has critical ECR findings"
            echo "nextAction=Patch the vulnerable package(s), publish a new source-bound image, and require zero CRITICAL findings before deployment."
            exit 25
          fi
          echo "AWS_CINEMA_ECR_SCAN_GATE=PASS"
      - name: Cost-safe deployment gate
        run: |
          echo "AWS_CINEMA_RUNTIME_DEPLOY=BLOCKED_BY_COST_GATE"
          echo "No EC2/ECS/Fargate/ALB/NAT/App Runner/browser cloud is started by this workflow."
          echo "Canonical target is BrowserOS capability + Cinema; Claw Server must not be recreated."
