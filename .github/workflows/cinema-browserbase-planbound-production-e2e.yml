name: Cinema Browserbase Plan-Bound Production E2E

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cinema-browserbase-planbound-production-e2e.yml'

permissions:
  contents: read

concurrency:
  group: cinema-browserbase-planbound-production-e2e
  cancel-in-progress: false

jobs:
  governed-live-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CINEMA_BASE_URL: https://dsg-cinema-production.nicetree-a005fe99.westus3.azurecontainerapps.io

    steps:
      - name: Run governed Cinema to Browserbase production E2E
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/cinema-browserbase-e2e"
          mkdir -p "$work"
          api_key=""
          session_token=""

          cleanup() {
            if [[ -n "$api_key" ]]; then
              curl -sS -o /dev/null -X POST "$CINEMA_BASE_URL/remote-browser/disable" \
                -H "X-DSG-API-Key: $api_key" || true
            fi
            rm -rf "$work"
          }
          trap cleanup EXIT

          activation_id="browserbase-prod-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          http=$(curl -sS -o "$work/activate.json" -w '%{http_code}' \
            -X POST "$CINEMA_BASE_URL/billing/activate" \
            -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg id "$activation_id" '{channel:"browserbase_e2e",activation_id:$id,display_name:"Cinema Browserbase Production E2E"}')")
          [[ "$http" == "200" || "$http" == "201" ]]
          api_key=$(jq -r '.api_key // empty' "$work/activate.json")
          account_id=$(jq -r '.account.account_id // empty' "$work/activate.json")
          [[ -n "$api_key" && -n "$account_id" ]]
          echo "::add-mask::$api_key"
          rm -f "$work/activate.json"
          echo 'activation=PASS'

          cat > "$work/plan.json" <<'JSON'
          {
            "title":"Governed Browserbase production E2E",
            "agent_identity":"github-actions-live-e2e",
            "channel":"mcp",
            "steps":[{
              "step_id":"example-domain",
              "action":"browser_workflow",
              "target":"example.com",
              "parameters":{"browser_allowed_origins":"https://example.com"},
              "requires_evidence":true
            }]
          }
          JSON

          http=$(curl -sS -o "$work/plan-created.json" -w '%{http_code}' \
            -X POST "$CINEMA_BASE_URL/api/v1/plans" \
            -H "X-DSG-API-Key: $api_key" -H 'Content-Type: application/json' \
            --data-binary @"$work/plan.json")
          [[ "$http" == "201" ]]
          plan_id=$(jq -r '.plan_id // empty' "$work/plan-created.json")
          plan_hash=$(jq -r '.plan_hash // empty' "$work/plan-created.json")
          [[ -n "$plan_id" && ${#plan_hash} -eq 64 ]]
          echo 'create_plan=PASS'

          http=$(curl -sS -o "$work/approved.json" -w '%{http_code}' \
            -X POST "$CINEMA_BASE_URL/api/v1/plans/$plan_id/approve" \
            -H "X-DSG-API-Key: $api_key" -H 'Content-Type: application/json' \
            --data "$(jq -nc --arg h "$plan_hash" '{approver:"production-e2e",plan_hash:$h,approval_note:"Harmless governed Browserbase production E2E"}')")
          [[ "$http" == "200" ]]
          [[ "$(jq -r '.status' "$work/approved.json")" == "APPROVED" ]]
          echo 'approve_plan=PASS'

          http=$(curl -sS -o "$work/enabled.json" -w '%{http_code}' \
            -X POST "$CINEMA_BASE_URL/remote-browser/enable" \
            -H "X-DSG-API-Key: $api_key")
          [[ "$http" == "200" ]]
          jq -e '.remote_enabled == true' "$work/enabled.json" >/dev/null
          echo 'remote_on=PASS'

          rpc() {
            local body="$1" output="$2"
            curl -sS -o "$output" -w '%{http_code}' \
              -X POST "$CINEMA_BASE_URL/mcp" \
              -H "Authorization: Bearer $api_key" -H 'Content-Type: application/json' \
              --data "$body"
          }

          http=$(rpc "$(jq -nc --arg p "$plan_id" '{jsonrpc:"2.0",id:1,method:"tools/call",params:{name:"remote_agent_connect",arguments:{plan_id:$p,agent_identity:"github-actions-live-e2e",step_id:"example-domain",ttl_seconds:600}}}')" "$work/connect.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == false' "$work/connect.json" >/dev/null
          session_token=$(jq -r '.result.structuredContent.session_token // empty' "$work/connect.json")
          cinema_session_id=$(jq -r '.result.structuredContent.session_id // empty' "$work/connect.json")
          browserbase_session_id=$(jq -r '.result.structuredContent.shared_browser.browserbase_session_id // empty' "$work/connect.json")
          [[ -n "$session_token" && -n "$cinema_session_id" && -n "$browserbase_session_id" ]]
          jq -e '.result.structuredContent.shared_browser.live_view_url | type == "string" and startswith("https://")' "$work/connect.json" >/dev/null
          echo "::add-mask::$session_token"
          rm -f "$work/connect.json"
          echo 'remote_agent_connect=PASS'

          http=$(rpc "$(jq -nc --arg t "$session_token" '{jsonrpc:"2.0",id:2,method:"tools/call",params:{name:"remote_action",arguments:{session_token:$t,action:{kind:"browser.navigate",controller:"agent_executor",parameters:{url:"https://example.com"}}}}}')" "$work/action.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == false' "$work/action.json" >/dev/null
          navigate_evidence=$(jq -r '.result.structuredContent.evidence_hash // empty' "$work/action.json")
          [[ ${#navigate_evidence} -eq 64 ]]
          echo 'navigate=PASS'

          http=$(rpc "$(jq -nc --arg t "$session_token" '{jsonrpc:"2.0",id:3,method:"tools/call",params:{name:"remote_action",arguments:{session_token:$t,action:{kind:"browser.extract",controller:"agent_verifier",parameters:{}}}}}')" "$work/action.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == false' "$work/action.json" >/dev/null
          title=$(jq -r '.result.structuredContent.response.title // empty' "$work/action.json")
          extract_evidence=$(jq -r '.result.structuredContent.evidence_hash // empty' "$work/action.json")
          [[ "$title" == "Example Domain" && ${#extract_evidence} -eq 64 ]]
          echo 'extract=PASS'

          http=$(rpc "$(jq -nc --arg t "$session_token" '{jsonrpc:"2.0",id:4,method:"tools/call",params:{name:"remote_action",arguments:{session_token:$t,action:{kind:"browser.screenshot",controller:"agent_verifier",parameters:{full_page:true}}}}}')" "$work/action.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == false' "$work/action.json" >/dev/null
          screenshot_evidence=$(jq -r '.result.structuredContent.evidence_hash // empty' "$work/action.json")
          screenshot_sha=$(jq -r '.result.structuredContent.response.screenshot_sha256 // empty' "$work/action.json")
          [[ ${#screenshot_evidence} -eq 64 && ${#screenshot_sha} -eq 64 ]]
          echo 'screenshot=PASS'

          http=$(rpc "$(jq -nc --arg t "$session_token" '{jsonrpc:"2.0",id:5,method:"tools/call",params:{name:"remote_action",arguments:{session_token:$t,action:{kind:"browser.navigate",controller:"agent_executor",parameters:{url:"https://example.org"}}}}}')" "$work/block.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == true and .result.structuredContent.status_code == 403' "$work/block.json" >/dev/null
          echo 'out_of_plan_block=PASS'

          http=$(rpc "$(jq -nc --arg t "$session_token" '{jsonrpc:"2.0",id:6,method:"tools/call",params:{name:"remote_disconnect",arguments:{session_token:$t}}}')" "$work/action.json")
          [[ "$http" == "200" ]]
          jq -e '.result.isError == false and .result.structuredContent.browser_session_terminated == false' "$work/action.json" >/dev/null
          echo 'disconnect=PASS'

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg plan_hash "$plan_hash" \
            --arg account_hash "$(printf '%s' "$account_id" | sha256sum | cut -d' ' -f1)" \
            --arg cinema_session_hash "$(printf '%s' "$cinema_session_id" | sha256sum | cut -d' ' -f1)" \
            --arg browserbase_session_hash "$(printf '%s' "$browserbase_session_id" | sha256sum | cut -d' ' -f1)" \
            --arg navigate_evidence "$navigate_evidence" \
            --arg extract_evidence "$extract_evidence" \
            --arg screenshot_evidence "$screenshot_evidence" \
            --arg screenshot_sha "$screenshot_sha" \
            --arg title "$title" \
            '{status:"PASS",commit:$commit,provider:"browserbase",governed_path:["self_activate","create_plan","approve_plan","remote_on","remote_agent_connect","navigate","extract","screenshot","out_of_plan_block","disconnect"],plan_hash:$plan_hash,account_sha256:$account_hash,cinema_session_sha256:$cinema_session_hash,browserbase_session_sha256:$browserbase_session_hash,live_view_present:true,title:$title,navigate_evidence_hash:$navigate_evidence,extract_evidence_hash:$extract_evidence,screenshot_evidence_hash:$screenshot_evidence,screenshot_sha256:$screenshot_sha,out_of_plan_http_status:403}' \
            > cinema-browserbase-planbound-e2e-evidence.json
          echo 'Cinema Browserbase plan-bound production E2E: PASS'

      - name: Upload non-secret governed E2E evidence
        uses: actions/upload-artifact@v4
        with:
          name: cinema-browserbase-planbound-e2e-${{ github.sha }}
          path: cinema-browserbase-planbound-e2e-evidence.json
          if-no-files-found: error
          retention-days: 30
