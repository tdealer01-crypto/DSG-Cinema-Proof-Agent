name: Verify Revenue W2-B Signals

on:
  pull_request:
    paths:
      - 'revenue/signals.py'
      - 'tests/test_revenue_signals.py'
      - '.github/workflows/revenue-w2b-signals-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pytest
      - run: python -m py_compile revenue/signals.py
      - run: python -m pytest -q tests/test_revenue_signals.py
