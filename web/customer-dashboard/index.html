<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSG ONE Customer</title><style>
:root{--bg:#0f1012;--panel:#17181b;--line:#2b2d31;--ink:#f5f6f7;--muted:#979ba3;--green:#43d49e;--blue:#58a6ff;--red:#ff716b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:960px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{font-weight:700}.brand i{display:inline-block;width:10px;height:10px;background:var(--green);margin-right:8px}.key{display:flex;gap:8px;margin:22px 0}.key input{flex:1;background:#111214;border:1px solid var(--line);color:#fff;padding:12px;border-radius:6px}.btn{border:0;border-radius:6px;padding:11px 16px;background:#fff;color:#111;font-weight:600;cursor:pointer}.btn.secondary{background:#25272a;color:#fff}.btn:disabled{opacity:.4}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.8px}.value{font-size:25px;margin-top:7px}.progress{height:8px;background:#292b2f;border-radius:99px;overflow:hidden;margin:12px 0}.progress i{display:block;height:100%;width:0;background:var(--green)}.wide{grid-column:1/-1}.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.step{padding:10px;background:#111214;border:1px solid var(--line);border-radius:6px;color:var(--muted)}.step.done{color:var(--green);border-color:#285c49}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{font:12px ui-monospace,monospace;color:var(--muted)}.error{color:var(--red)}@media(max-width:700px){.grid{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.key{flex-direction:column}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><i></i>DSG ONE Customer</div><span class="status" id="connection">NOT CONNECTED</span></header><section class="key"><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your DSG API key"><button class="btn" id="connect">Connect</button></section><section class="grid"><div class="card"><div class="label">Plan</div><div class="value" id="plan">—</div></div><div class="card"><div class="label">Proof usage</div><div class="value" id="usage">—</div></div><div class="card"><div class="label">Remaining</div><div class="value" id="remaining">—</div></div><div class="card wide"><div class="label">Onboarding</div><div class="progress"><i id="progressBar"></i></div><div id="progressText">Connect to load progress</div><div class="steps" id="steps"></div></div><div class="card wide"><div class="label">Next action</div><p id="next">Connect your account to continue.</p><div class="actions"><button class="btn" id="upgrade" disabled>Upgrade with Stripe</button><button class="btn secondary" id="portal" disabled>Manage billing</button></div><p class="status" id="message"></p></div></section></main><script>
const $=id=>document.getElementById(id); let key="";
async function api(path,options={}){const headers={...(options.headers||{}),"X-DSG-API-Key":key};if(options.body)headers["Content-Type"]="application/json";const r=await fetch(path,{...options,headers});const body=await r.json().catch(()=>({}));if(!r.ok)throw new Error(body.detail?.message||body.detail||`HTTP ${r.status}`);return body}
function showError(e){$("message").textContent=e.message;$("message").className="status error"}
async function load(){key=$("apiKey").value.trim();if(!key)return showError(new Error("API key required"));$("message").textContent="Loading…";try{const [onboarding,usage]=await Promise.all([api("/onboarding/status"),api("/billing/usage")]);$("connection").textContent="CONNECTED";$("connection").style.color="var(--green)";$("plan").textContent=usage.account.plan;$("usage").textContent=usage.units;$("remaining").textContent=usage.units_remaining??"Uncapped";$("progressBar").style.width=`${onboarding.progress}%`;$("progressText").textContent=`${onboarding.progress}% · ${onboarding.current_step}`;$("steps").innerHTML="";Object.entries(onboarding.steps).forEach(([name,done])=>{const n=document.createElement("div");n.className=`step ${done?"done":""}`;n.textContent=`${done?"✓":"○"} ${name.replaceAll("_"," ")}`;$("steps").appendChild(n)});$("next").textContent=onboarding.next_action?`${onboarding.next_action.method} ${onboarding.next_action.endpoint}`:"Onboarding complete";$("upgrade").disabled=!usage.upgrade?.recommended;$("portal").disabled=!usage.account.payment_linked;$("message").textContent=usage.upgrade?.recommended?`Upgrade recommended: ${usage.upgrade.reason}`:"Account ready";$("message").className="status"}catch(e){showError(e)}}
$("connect").onclick=load;
$("upgrade").onclick=async()=>{try{const data=await api("/billing/checkout/session",{method:"POST",body:JSON.stringify({plan:"metered",checkout_id:crypto.randomUUID()})});location.href=data.checkout_url}catch(e){showError(e)}};
$("portal").onclick=async()=>{try{const data=await api("/billing/portal/session",{method:"POST"});location.href=data.portal_url}catch(e){showError(e)}};
</script></body></html>
