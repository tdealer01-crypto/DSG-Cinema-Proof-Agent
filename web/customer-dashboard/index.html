<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSG ONE Customer</title><link rel="stylesheet" href="/dashboard-assets/dashboard.css"></head><body><main class="wrap"><header class="top"><div class="brand"><i></i>DSG ONE Customer</div><span class="status" id="connection">NOT CONNECTED</span></header><section class="key"><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your DSG API key"><button class="btn" id="connect">Connect</button></section><section class="grid"><div class="card"><div class="label">Plan</div><div class="value" id="plan">—</div></div><div class="card"><div class="label">Proof usage</div><div class="value" id="usage">—</div></div><div class="card"><div class="label">Remaining</div><div class="value" id="remaining">—</div></div><div class="card wide"><div class="label">Onboarding</div><div class="progress"><i id="progressBar"></i></div><div id="progressText">Connect to load progress</div><div class="steps" id="steps"></div></div><div class="card wide"><div class="label">Next action</div><p id="next">Connect your account to continue.</p><div class="actions"><button class="btn" id="upgrade" disabled>Upgrade with Stripe</button><button class="btn secondary" id="portal" disabled>Manage billing</button></div><p class="status" id="message"></p></div></section></main><script src="/dashboard-assets/dashboard.js"></script></body></html>
